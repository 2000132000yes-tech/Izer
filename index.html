<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dungeon Survivor - Action Roguelike</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      background-color: #111116;
    }
    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .stats-panel {
      background: rgba(15, 15, 25, 0.75);
      border: 2px solid #3a3a55;
      border-radius: 8px;
      padding: 10px 15px;
      backdrop-filter: blur(4px);
      min-width: 220px;
    }
    .bar-container {
      width: 100%;
      height: 14px;
      background: #222;
      border-radius: 7px;
      margin: 4px 0 8px 0;
      overflow: hidden;
      border: 1px solid #444;
    }
    .bar-fill-hp {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff2a2a, #ff6b6b);
      transition: width 0.15s ease-out;
    }
    .bar-fill-exp {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2a8bff, #6bc5ff);
      transition: width 0.15s ease-out;
    }
    .hud-text {
      font-size: 14px;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      justify-content: space-between;
    }
    .inventory-panel {
      background: rgba(15, 15, 25, 0.75);
      border: 2px solid #3a3a55;
      border-radius: 8px;
      padding: 8px 12px;
      backdrop-filter: blur(4px);
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .inv-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 16px;
    }
    .inv-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      border-radius: 50%;
    }
    .icon-coin { background: #ffd700; box-shadow: 0 0 5px #ffd700; }
    .icon-key { background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }
    
    /* Touch Controls */
    #touch-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .joystick-zone {
      position: absolute;
      bottom: 30px;
      left: 30px;
      width: 140px;
      height: 140px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    .joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .action-btn-zone {
      position: absolute;
      bottom: 30px;
      right: 30px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }
    .btn-action {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 60, 60, 0.4);
      border: 2px solid rgba(255, 100, 100, 0.8);
      color: white;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
    }
    .btn-action:active, .btn-action.active {
      background: rgba(255, 60, 60, 0.8);
      transform: scale(0.95);
    }
    .btn-dash {
      background: rgba(60, 160, 255, 0.4);
      border-color: rgba(100, 200, 255, 0.8);
      width: 60px;
      height: 60px;
      margin-top: 10px;
    }
    .btn-dash:active, .btn-dash.active {
      background: rgba(60, 160, 255, 0.8);
    }

    /* Modal Screens */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .modal-title {
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff4e50, #f9d423);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 15px rgba(255, 78, 80, 0.4);
    }
    .modal-sub {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 30px;
      text-align: center;
      max-width: 400px;
      line-height: 1.5;
    }
    .btn-start {
      padding: 15px 40px;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 30px;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
      transition: all 0.2s ease;
    }
    .btn-start:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 25px rgba(255, 65, 108, 0.7);
    }
    
    /* Level Up Shop */
    .cards-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .upgrade-card {
      width: 180px;
      height: 240px;
      background: #181824;
      border: 2px solid #33334d;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .upgrade-card:hover {
      border-color: #ff416c;
      transform: translateY(-10px);
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
      background: #202030;
    }
    .card-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #2a2a40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-top: 10px;
    }
    .card-title {
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      color: #fff;
    }
    .card-desc {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      line-height: 1.3;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD Overlay -->
    <div id="ui-layer">
      <div class="hud-top">
        <div class="stats-panel">
          <div class="hud-text">
            <span>체력 (HP)</span>
            <span id="hp-text">100 / 100</span>
          </div>
          <div class="bar-container">
            <div id="hp-bar" class="bar-fill-hp"></div>
          </div>
          <div class="hud-text">
            <span>경험치 (EXP) - Lv.<span id="level-text">1</span></span>
            <span id="exp-text">0 / 50</span>
          </div>
          <div class="bar-container">
            <div id="exp-bar" class="bar-fill-exp"></div>
          </div>
        </div>

        <div class="inventory-panel">
          <div class="inv-item">
            <span class="inv-icon icon-coin"></span>
            <span id="coin-text">0</span>
          </div>
          <div class="inv-item">
            <span class="inv-icon icon-key"></span>
            <span id="key-text">0</span>
          </div>
          <div class="inv-item" style="margin-left: 10px; color: #ff8800;">
            <span>FLOOR <span id="floor-text">1</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Virtual Joystick & Mobile Buttons -->
    <div id="touch-controls">
      <div id="joystick-zone" class="joystick-zone">
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
      <div class="action-btn-zone">
        <div id="btn-dash" class="btn-action btn-dash">대시</div>
        <div id="btn-attack" class="btn-action">공격</div>
      </div>
    </div>

    <!-- Start / Game Over / Upgrade Modals -->
    <div id="start-modal" class="modal">
      <div class="modal-title">DUNGEON SURVIVOR</div>
      <div class="modal-sub">
        키보드 [WASD / 화살표] 이동, [스페이스바] 공격, [Shift] 대시<br>
        모바일 사용자는 화면 하단 조이스틱 및 버튼을 이용하세요.<br><br>
        상자를 열어 열쇠와 코인을 얻고 던전을 탈출하세요!
      </div>
      <button id="btn-start-game" class="btn-start">게임 시작</button>
    </div>

    <div id="upgrade-modal" class="modal hidden">
      <div class="modal-title" style="font-size: 32px;">LEVEL UP!</div>
      <div class="modal-sub">강화할 능력을 선택하세요.</div>
      <div class="cards-container" id="cards-container">
        <!-- Cards inserted dynamically -->
      </div>
    </div>

    <div id="gameover-modal" class="modal hidden">
      <div class="modal-title" style="background: linear-gradient(45deg, #ff2a2a, #880000); -webkit-background-clip: text;">YOU DIED</div>
      <div class="modal-sub" id="gameover-stats">
        도달 층수: 1층 | 처치한 적: 0
      </div>
      <button id="btn-restart-game" class="btn-start">다시 도전</button>
    </div>
  </div>

  <script>
    /* ========================================================================== */
    /* 1. GLOBAL CONSTANTS & AUDIO ENGINE                                         */
    /* ========================================================================== */
    const CANVAS_WIDTH = 1280;
    const CANVAS_HEIGHT = 720;
    const TILE_SIZE = 48;
    const MAP_COLS = 35;
    const MAP_ROWS = 35;

    // Web Audio API Synth Generator
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, type, duration, vol = 0.1) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playSwing() {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
      }
      playHit() {
        this.playTone(120, 'sawtooth', 0.15, 0.2);
      }
      playCoin() {
        this.playTone(987.77, 'sine', 0.08, 0.1);
        setTimeout(() => this.playTone(1318.51, 'sine', 0.15, 0.1), 60);
      }
      playChest() {
        this.playTone(300, 'square', 0.1, 0.15);
        setTimeout(() => this.playTone(500, 'square', 0.2, 0.15), 80);
      }
      playDash() {
        this.playTone(200, 'triangle', 0.12, 0.15);
      }
      playLevelUp() {
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((n, i) => {
          setTimeout(() => this.playTone(n, 'sine', 0.2, 0.15), i * 80);
        });
      }
    }
    const soundEngine = new SoundEngine();

    /* ========================================================================== */
    /* 2. VECTOR & MATH UTILITIES                                                 */
    /* ========================================================================== */
    class Vector2 {
      constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
      }
      set(x, y) { this.x = x; this.y = y; return this; }
      clone() { return new Vector2(this.x, this.y); }
      add(v) { this.x += v.x; this.y += v.y; return this; }
      sub(v) { this.x -= v.x; this.y -= v.y; return this; }
      mult(n) { this.x *= n; this.y *= n; return this; }
      div(n) { this.x /= n; this.y /= n; return this; }
      mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
      normalize() {
        let m = this.mag();
        if (m !== 0) this.div(m);
        return this;
      }
      dist(v) {
        let dx = this.x - v.x;
        let dy = this.y - v.y;
        return Math.sqrt(dx * dx + dy * dy);
      }
    }

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /* ========================================================================== */
    /* 3. CAMERA & SCREEN SHAKE                                                   */
    /* ========================================================================== */
    class Camera {
      constructor() {
        this.pos = new Vector2(0, 0);
        this.viewportWidth = CANVAS_WIDTH;
        this.viewportHeight = CANVAS_HEIGHT;
        this.shakeIntensity = 0;
        this.shakeDecay = 0.9;
        this.shakeOffset = new Vector2(0, 0);
      }
      follow(target) {
        this.pos.x = target.pos.x - this.viewportWidth / 2;
        this.pos.y = target.pos.y - this.viewportHeight / 2;
        
        // Clamp bounds
        const mapWidth = MAP_COLS * TILE_SIZE;
        const mapHeight = MAP_ROWS * TILE_SIZE;
        this.pos.x = Math.max(0, Math.min(this.pos.x, mapWidth - this.viewportWidth));
        this.pos.y = Math.max(0, Math.min(this.pos.y, mapHeight - this.viewportHeight));

        if (this.shakeIntensity > 0.5) {
          this.shakeOffset.x = (Math.random() - 0.5) * this.shakeIntensity;
          this.shakeOffset.y = (Math.random() - 0.5) * this.shakeIntensity;
          this.shakeIntensity *= this.shakeDecay;
        } else {
          this.shakeOffset.set(0, 0);
          this.shakeIntensity = 0;
        }
      }
      addShake(amount) {
        this.shakeIntensity = Math.min(this.shakeIntensity + amount, 25);
      }
      getRenderPos(worldPos) {
        return new Vector2(
          worldPos.x - this.pos.x + this.shakeOffset.x,
          worldPos.y - this.pos.y + this.shakeOffset.y
        );
      }
    }

    /* ========================================================================== */
    /* 4. MAP GENERATOR (Procedural Dungeon)                                     */
    /* ========================================================================== */
    const TILE_FLOOR = 0;
    const TILE_WALL = 1;
    const TILE_DOOR = 2;

    class DungeonMap {
      constructor(cols, rows) {
        this.cols = cols;
        this.rows = rows;
        this.grid = [];
        this.rooms = [];
        this.spawnPos = new Vector2();
        this.exitPos = new Vector2();
        this.chestSpawns = [];
      }
      generate() {
        this.grid = Array(this.rows).fill(0).map(() => Array(this.cols).fill(TILE_WALL));
        this.rooms = [];
        this.chestSpawns = [];

        const roomCount = randomInt(6, 10);
        const minSize = 5;
        const maxSize = 9;

        for (let i = 0; i < roomCount * 5; i++) {
          if (this.rooms.length >= roomCount) break;

          let w = randomInt(minSize, maxSize);
          let h = randomInt(minSize, maxSize);
          let x = randomInt(1, this.cols - w - 1);
          let y = randomInt(1, this.rows - h - 1);

          let newRoom = { x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) };
          let overlap = false;

          for (let r of this.rooms) {
            if (x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y) {
              overlap = true;
              break;
            }
          }

          if (!overlap) {
            this.rooms.push(newRoom);
            for (let ry = y; ry < y + h; ry++) {
              for (let rx = x; rx < x + w; rx++) {
                this.grid[ry][rx] = TILE_FLOOR;
              }
            }
          }
        }

        // Connect rooms with corridors
        for (let i = 0; i < this.rooms.length - 1; i++) {
          let r1 = this.rooms[i];
          let r2 = this.rooms[i + 1];

          let currX = r1.cx;
          let currY = r1.cy;

          while (currX !== r2.cx) {
            this.grid[currY][currX] = TILE_FLOOR;
            currX += (r2.cx > currX) ? 1 : -1;
          }
          while (currY !== r2.cy) {
            this.grid[currY][currX] = TILE_FLOOR;
            currY += (r2.cy > currY) ? 1 : -1;
          }
        }

        // Setup Special Rooms
        this.spawnPos.set(this.rooms[0].cx * TILE_SIZE + TILE_SIZE / 2, this.rooms[0].cy * TILE_SIZE + TILE_SIZE / 2);
        let lastRoom = this.rooms[this.rooms.length - 1];
        this.exitPos.set(lastRoom.cx * TILE_SIZE + TILE_SIZE / 2, lastRoom.cy * TILE_SIZE + TILE_SIZE / 2);

        // Chest Spawns in intermediate rooms
        for (let i = 1; i < this.rooms.length - 1; i++) {
          if (Math.random() < 0.7) {
            let room = this.rooms[i];
            this.chestSpawns.push(new Vector2(room.cx * TILE_SIZE + TILE_SIZE / 2, room.cy * TILE_SIZE + TILE_SIZE / 2));
          }
        }
      }

      isWall(x, y) {
        let col = Math.floor(x / TILE_SIZE);
        let row = Math.floor(y / TILE_SIZE);
        if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return true;
        return this.grid[row][col] === TILE_WALL;
      }

      draw(ctx, camera) {
        let startCol = Math.floor(camera.pos.x / TILE_SIZE);
        let endCol = startCol + Math.ceil(camera.viewportWidth / TILE_SIZE) + 1;
        let startRow = Math.floor(camera.pos.y / TILE_SIZE);
        let endRow = startRow + Math.ceil(camera.viewportHeight / TILE_SIZE) + 1;

        startCol = Math.max(0, startCol);
        endCol = Math.min(this.cols, endCol);
        startRow = Math.max(0, startRow);
        endRow = Math.min(this.rows, endRow);

        for (let r = startRow; r < endRow; r++) {
          for (let c = startCol; c < endCol; c++) {
            let renderPos = camera.getRenderPos(new Vector2(c * TILE_SIZE, r * TILE_SIZE));
            let tile = this.grid[r][c];

            if (tile === TILE_WALL) {
              ctx.fillStyle = "#1e1e2f";
              ctx.fillRect(renderPos.x, renderPos.y, TILE_SIZE, TILE_SIZE);
              ctx.strokeStyle = "#12121c";
              ctx.lineWidth = 2;
              ctx.strokeRect(renderPos.x, renderPos.y, TILE_SIZE, TILE_SIZE);

              // Wall Top Highlight
              ctx.fillStyle = "#2d2d48";
              ctx.fillRect(renderPos.x, renderPos.y, TILE_SIZE, 6);
            } else {
              ctx.fillStyle = ((c + r) % 2 === 0) ? "#161620" : #191926";
              ctx.fillRect(renderPos.x, renderPos.y, TILE_SIZE, TILE_SIZE);
              
              ctx.strokeStyle = "rgba(255,255,255,0.02)";
              ctx.strokeRect(renderPos.x, renderPos.y, TILE_SIZE, TILE_SIZE);
            }
          }
        }

        // Draw Exit Portal
        let exitRenderPos = camera.getRenderPos(this.exitPos);
        ctx.save();
        ctx.translate(exitRenderPos.x, exitRenderPos.y);
        ctx.rotate(Date.now() * 0.002);
        ctx.fillStyle = "rgba(0, 229, 255, 0.4)";
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
      }
    }

    /* ========================================================================== */
    /* 5. PARTICLES & VISUAL EFFECTS ENGINE                                       */
    /* ========================================================================== */
    class Particle {
      constructor(x, y, color, velocity, life, size) {
        this.pos = new Vector2(x, y);
        this.vel = velocity;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size;
        this.friction = 0.95;
      }
      update() {
        this.vel.mult(this.friction);
        this.pos.add(this.vel);
        this.life--;
      }
      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        let alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(rPos.x, rPos.y, Math.max(0.1, this.size * alpha), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class ParticleSystem {
      constructor() {
        this.particles = [];
      }
      spawnExplosion(x, y, color, count = 15, speed = 4) {
        for (let i = 0; i < count; i++) {
          let angle = Math.random() * Math.PI * 2;
          let spd = randomRange(1, speed);
          let vel = new Vector2(Math.cos(angle) * spd, Math.sin(angle) * spd);
          let life = randomInt(15, 35);
          let size = randomRange(2, 6);
          this.particles.push(new Particle(x, y, color, vel, life, size));
        }
      }
      spawnSlashEffect(x, y, angle) {
        for (let i = 0; i < 8; i++) {
          let pAngle = angle + randomRange(-0.5, 0.5);
          let spd = randomRange(3, 8);
          let vel = new Vector2(Math.cos(pAngle) * spd, Math.sin(pAngle) * spd);
          this.particles.push(new Particle(x, y, '#ffffff', vel, 12, randomRange(1, 4)));
        }
      }
      update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          this.particles[i].update();
          if (this.particles[i].life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }
      draw(ctx, camera) {
        for (let p of this.particles) {
          p.draw(ctx, camera);
        }
      }
    }

    class DamageText {
      constructor(x, y, text, color = '#ff3333') {
        this.pos = new Vector2(x, y);
        this.text = text;
        this.color = color;
        this.life = 40;
        this.velY = -1.5;
      }
      update() {
        this.pos.y += this.velY;
        this.life--;
      }
      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life / 40);
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText(this.text, rPos.x, rPos.y);
        ctx.fillText(this.text, rPos.x, rPos.y);
        ctx.restore();
      }
    }

    /* ========================================================================== */
    /* 6. GAME OBJECTS & ENTITIES                                                */
    /* ========================================================================== */
    class ItemDrop {
      constructor(x, y, type) {
        this.pos = new Vector2(x, y);
        this.type = type; // 'coin', 'key', 'potion', 'exp'
        this.radius = 10;
        this.bobOffset = Math.random() * 100;
        this.markedForDelete = false;
      }
      update(player) {
        this.bobOffset += 0.05;
        let dist = this.pos.dist(player.pos);
        
        // Magnet effect
        if (dist < 100) {
          let dir = player.pos.clone().sub(this.pos).normalize().mult(6);
          this.pos.add(dir);
        }

        if (dist < player.radius + this.radius) {
          this.pickup(player);
        }
      }
      pickup(player) {
        this.markedForDelete = true;
        if (this.type === 'coin') {
          player.coins += randomInt(1, 3);
          soundEngine.playCoin();
        } else if (this.type === 'key') {
          player.keys += 1;
          soundEngine.playCoin();
        } else if (this.type === 'potion') {
          player.hp = Math.min(player.maxHp, player.hp + 25);
          soundEngine.playLevelUp();
        } else if (this.type === 'exp') {
          player.addExp(15);
          soundEngine.playCoin();
        }
      }
      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        let yShift = Math.sin(this.bobOffset) * 4;

        ctx.save();
        ctx.translate(rPos.x, rPos.y + yShift);

        if (this.type === 'coin') {
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(0, 0, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#b8860b';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (this.type === 'key') {
          ctx.fillStyle = '#00e5ff';
          ctx.fillRect(-3, -6, 6, 12);
          ctx.beginPath();
          ctx.arc(0, -6, 5, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'potion') {
          ctx.fillStyle = '#ff2a6d';
          ctx.beginPath();
          ctx.arc(0, 2, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.fillRect(-2, -6, 4, 4);
        } else if (this.type === 'exp') {
          ctx.fillStyle = '#00ff88';
          ctx.beginPath();
          ctx.arc(0, 0, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    class Chest {
      constructor(x, y) {
        this.pos = new Vector2(x, y);
        this.width = 32;
        this.height = 24;
        this.isOpen = false;
      }
      interact(player, drops, particleSys) {
        if (this.isOpen) return;
        if (player.keys > 0) {
          player.keys--;
          this.isOpen = true;
          soundEngine.playChest();
          particleSys.spawnExplosion(this.pos.x, this.pos.y, '#ffd700', 25, 6);

          // Drop Items
          for (let i = 0; i < 5; i++) {
            drops.push(new ItemDrop(this.pos.x + randomRange(-20, 20), this.pos.y + randomRange(-20, 20), 'coin'));
          }
          if (Math.random() < 0.6) {
            drops.push(new ItemDrop(this.pos.x + randomRange(-15, 15), this.pos.y + randomRange(-15, 15), 'potion'));
          }
        }
      }
      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        ctx.save();
        ctx.translate(rPos.x - this.width / 2, rPos.y - this.height / 2);

        // Box base
        ctx.fillStyle = this.isOpen ? "#5a3d28" : "#8b5a2b";
        ctx.fillRect(0, 0, this.width, this.height);
        ctx.strokeStyle = "#3a1e05";
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, this.width, this.height);

        // Lock / Trim
        ctx.fillStyle = "#ffd700";
        if (!this.isOpen) {
          ctx.fillRect(this.width / 2 - 3, this.height / 2 - 2, 6, 8);
        } else {
          ctx.fillRect(0, 4, this.width, 4);
        }

        ctx.restore();
      }
    }

    /* ========================================================================== */
    /* 7. PLAYER CONTROLLER & WEAPON SYSTEM                                       */
    /* ========================================================================== */
    class Player {
      constructor(x, y) {
        this.pos = new Vector2(x, y);
        this.vel = new Vector2(0, 0);
        this.radius = 18;
        this.speed = 4.2;
        this.maxHp = 100;
        this.hp = 100;
        this.level = 1;
        this.exp = 0;
        this.nextExp = 50;
        this.coins = 0;
        this.keys = 1;

        // Weapon Stats
        this.damage = 25;
        this.attackRange = 65;
        this.attackSpeed = 250; // ms cooldown
        this.lastAttackTime = 0;
        this.isAttacking = false;
        this.attackAngle = 0;
        this.attackProgress = 0;

        // Dash Ability
        this.dashSpeed = 12;
        this.dashDuration = 10;
        this.dashTimer = 0;
        this.dashCooldown = 1200; // ms
        this.lastDashTime = 0;
        this.isDashing = false;
        this.dashDir = new Vector2(1, 0);

        this.facingAngle = 0;
      }

      move(moveVec, map) {
        if (this.isDashing) {
          let nextX = this.pos.x + this.dashDir.x * this.dashSpeed;
          let nextY = this.pos.y + this.dashDir.y * this.dashSpeed;
          if (!map.isWall(nextX, this.pos.y)) this.pos.x = nextX;
          if (!map.isWall(this.pos.x, nextY)) this.pos.y = nextY;
          this.dashTimer--;
          if (this.dashTimer <= 0) this.isDashing = false;
          return;
        }

        if (moveVec.mag() > 0) {
          moveVec.normalize();
          this.facingAngle = Math.atan2(moveVec.y, moveVec.x);
          this.dashDir = moveVec.clone();

          let nextX = this.pos.x + moveVec.x * this.speed;
          let nextY = this.pos.y + moveVec.y * this.speed;

          // Wall Collision Box Test
          if (!map.isWall(nextX + Math.sign(moveVec.x) * this.radius, this.pos.y)) {
            this.pos.x = nextX;
          }
          if (!map.isWall(this.pos.x, nextY + Math.sign(moveVec.y) * this.radius)) {
            this.pos.y = nextY;
          }
        }
      }

      dash(particleSys) {
        let now = Date.now();
        if (now - this.lastDashTime >= this.dashCooldown) {
          this.isDashing = true;
          this.dashTimer = this.dashDuration;
          this.lastDashTime = now;
          soundEngine.playDash();
          particleSys.spawnExplosion(this.pos.x, this.pos.y, 'rgba(60, 160, 255, 0.6)', 12, 3);
        }
      }

      attack(enemies, particleSys, damageTexts, camera) {
        let now = Date.now();
        if (now - this.lastAttackTime < this.attackSpeed) return;

        this.lastAttackTime = now;
        this.isAttacking = true;
        this.attackProgress = 1;
        this.attackAngle = this.facingAngle;

        soundEngine.playSwing();

        let hitAny = false;
        for (let enemy of enemies) {
          let dist = this.pos.dist(enemy.pos);
          if (dist <= this.attackRange + enemy.radius) {
            let angleToEnemy = Math.atan2(enemy.pos.y - this.pos.y, enemy.pos.x - this.pos.x);
            let diff = Math.abs(this.attackAngle - angleToEnemy);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;

            if (diff < Math.PI / 2.2) { // Forward Arc
              enemy.takeDamage(this.damage, particleSys, damageTexts, this.pos);
              hitAny = true;
            }
          }
        }

        if (hitAny) {
          camera.addShake(6);
          soundEngine.playHit();
        }
      }

      addExp(amount) {
        this.exp += amount;
        if (this.exp >= this.nextExp) {
          this.level++;
          this.exp -= this.nextExp;
          this.nextExp = Math.floor(this.nextExp * 1.4);
          return true; // Trigger Level Up UI
        }
        return false;
      }

      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);

        // Draw Slash Arc
        if (this.isAttacking && this.attackProgress > 0) {
          ctx.save();
          ctx.translate(rPos.x, rPos.y);
          ctx.rotate(this.attackAngle);
          ctx.fillStyle = "rgba(255, 255, 255, " + (this.attackProgress * 0.6) + ")";
          ctx.beginPath();
          ctx.arc(0, 0, this.attackRange, -Math.PI / 3, Math.PI / 3);
          ctx.lineTo(0, 0);
          ctx.fill();
          ctx.restore();

          this.attackProgress -= 0.15;
          if (this.attackProgress <= 0) this.isAttacking = false;
        }

        // Draw Player Body
        ctx.save();
        ctx.translate(rPos.x, rPos.y);
        ctx.rotate(this.facingAngle);

        // Body Glow
        ctx.shadowColor = "#ff416c";
        ctx.shadowBlur = 10;

        ctx.fillStyle = "#ff416c";
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Direction Indicator / Weapon
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, -3, this.radius + 8, 6);

        ctx.restore();
      }
    }

    /* ========================================================================== */
    /* 8. ENEMY AI & TYPES                                                       */
    /* ========================================================================== */
    class Enemy {
      constructor(x, y, type = 'slime') {
        this.pos = new Vector2(x, y);
        this.type = type;
        this.markedForDelete = false;

        if (type === 'slime') {
          this.radius = 16;
          this.speed = 2.0;
          this.maxHp = 40;
          this.damage = 8;
          this.color = '#33ff77';
          this.expValue = 15;
        } else if (type === 'goblin') {
          this.radius = 14;
          this.speed = 3.2;
          this.maxHp = 30;
          this.damage = 12;
          this.color = '#ff9900';
          this.expValue = 20;
        } else if (type === 'boss') {
          this.radius = 32;
          this.speed = 1.6;
          this.maxHp = 300;
          this.damage = 25;
          this.color = '#cc00ff';
          this.expValue = 100;
        }

        this.hp = this.maxHp;
        this.knockback = new Vector2(0, 0);
      }

      update(player, map, particleSys) {
        // Apply Knockback Friction
        this.pos.add(this.knockback);
        this.knockback.mult(0.8);

        let dist = this.pos.dist(player.pos);
        if (dist < 450) { // Aggro Range
          let dir = player.pos.clone().sub(this.pos).normalize();
          let nextX = this.pos.x + dir.x * this.speed;
          let nextY = this.pos.y + dir.y * this.speed;

          if (!map.isWall(nextX, this.pos.y)) this.pos.x = nextX;
          if (!map.isWall(this.pos.x, nextY)) this.pos.y = nextY;

          // Attack Player Collision
          if (dist < this.radius + player.radius) {
            if (!player.isDashing) {
              player.hp -= this.damage * 0.05; // Continuous touch damage
              particleSys.spawnExplosion(player.pos.x, player.pos.y, '#ff0000', 1, 2);
            }
          }
        }
      }

      takeDamage(amount, particleSys, damageTexts, attackerPos) {
        this.hp -= amount;
        damageTexts.push(new DamageText(this.pos.x, this.pos.y, Math.floor(amount)));
        particleSys.spawnExplosion(this.pos.x, this.pos.y, this.color, 8, 4);

        // Apply Knockback Vector
        if (attackerPos) {
          let kbDir = this.pos.clone().sub(attackerPos).normalize().mult(8);
          this.knockback = kbDir;
        }

        if (this.hp <= 0) {
          this.markedForDelete = true;
          particleSys.spawnExplosion(this.pos.x, this.pos.y, this.color, 20, 6);
        }
      }

      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        ctx.save();
        ctx.translate(rPos.x, rPos.y);

        // Body
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-this.radius / 3, -this.radius / 4, 3, 0, Math.PI * 2);
        ctx.arc(this.radius / 3, -this.radius / 4, 3, 0, Math.PI * 2);
        ctx.fill();

        // Health Bar Above Head
        if (this.hp < this.maxHp) {
          let barW = this.radius * 2;
          let barH = 4;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(-barW / 2, -this.radius - 10, barW, barH);
          ctx.fillStyle = '#ff3333';
          ctx.fillRect(-barW / 2, -this.radius - 10, barW * (this.hp / this.maxHp), barH);
        }

        ctx.restore();
      }
    }

    /* ========================================================================== */
    /* 9. GAME ENGINE & CONTROLLER MANAGEMENT                                     */
    /* ========================================================================== */
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.resizeCanvas();

        this.camera = new Camera();
        this.map = new DungeonMap(MAP_COLS, MAP_ROWS);
        this.particleSys = new ParticleSystem();

        this.player = null;
        this.enemies = [];
        this.chests = [];
        this.drops = [];
        this.damageTexts = [];

        this.floor = 1;
        this.enemiesKilled = 0;
        this.isPaused = false;
        this.isGameOver = false;

        // Input States
        this.keys = {};
        this.joystickVector = new Vector2(0, 0);

        this.setupEventListeners();
        this.setupTouchControls();
      }

      resizeCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        if (this.camera) {
          this.camera.viewportWidth = this.canvas.width;
          this.camera.viewportHeight = this.canvas.height;
        }
      }

      startNewGame() {
        this.floor = 1;
        this.enemiesKilled = 0;
        this.isGameOver = false;
        this.player = new Player(0, 0);
        this.loadFloor();
        document.getElementById('start-modal').classList.add('hidden');
        document.getElementById('gameover-modal').classList.add('hidden');
      }

      loadFloor() {
        this.map.generate();
        this.player.pos = this.map.spawnPos.clone();
        this.enemies = [];
        this.chests = [];
        this.drops = [];

        // Spawn Chests
        for (let pos of this.map.chestSpawns) {
          this.chests.push(new Chest(pos.x, pos.y));
        }

        // Spawn Enemies per room
        for (let i = 1; i < this.map.rooms.length; i++) {
          let room = this.map.rooms[i];
          let enemyCount = randomInt(2, 4) + Math.floor(this.floor * 0.5);

          for (let e = 0; e < enemyCount; e++) {
            let ex = (room.x + randomInt(1, room.w - 1)) * TILE_SIZE;
            let ey = (room.y + randomInt(1, room.h - 1)) * TILE_SIZE;
            let type = (Math.random() < 0.6) ? 'slime' : 'goblin';
            if (i === this.map.rooms.length - 1 && e === 0) type = 'boss'; // Boss in last room
            this.enemies.push(new Enemy(ex, ey, type));
          }
        }
      }

      setupEventListeners() {
        window.addEventListener('resize', () => this.resizeCanvas());

        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
          if (e.code === 'Space') {
            soundEngine.init();
            if (this.player) this.player.attack(this.enemies, this.particleSys, this.damageTexts, this.camera);
          }
          if (e.code === 'ShiftLeft' || e.code === 'KeyE') {
            if (this.player) this.player.dash(this.particleSys);
          }
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });

        document.getElementById('btn-start-game').addEventListener('click', () => {
          soundEngine.init();
          this.startNewGame();
        });

        document.getElementById('btn-restart-game').addEventListener('click', () => {
          soundEngine.init();
          this.startNewGame();
        });
      }

      setupTouchControls() {
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let touchId = null;
        let center = { x: 0, y: 0 };

        zone.addEventListener('touchstart', (e) => {
          soundEngine.init();
          let touch = e.changedTouches[0];
          touchId = touch.identifier;
          let rect = zone.getBoundingClientRect();
          center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          this.updateJoystick(touch.clientX, touch.clientY, center, knob);
        });

        zone.addEventListener('touchmove', (e) => {
          for (let touch of e.changedTouches) {
            if (touch.identifier === touchId) {
              this.updateJoystick(touch.clientX, touch.clientY, center, knob);
            }
          }
        });

        const resetJoystick = () => {
          touchId = null;
          knob.style.left = '50%';
          knob.style.top = '50%';
          this.joystickVector.set(0, 0);
        };

        zone.addEventListener('touchend', resetJoystick);
        zone.addEventListener('touchcancel', resetJoystick);

        // Buttons
        const attackBtn = document.getElementById('btn-attack');
        attackBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          soundEngine.init();
          if (this.player) this.player.attack(this.enemies, this.particleSys, this.damageTexts, this.camera);
        });

        const dashBtn = document.getElementById('btn-dash');
        dashBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          soundEngine.init();
          if (this.player) this.player.dash(this.particleSys);
        });
      }

      updateJoystick(clientX, clientY, center, knob) {
        let maxRadius = 50;
        let dx = clientX - center.x;
        let dy = clientY - center.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        knob.style.left = `calc(50% + ${dx}px)`;
        knob.style.top = `calc(50% + ${dy}px)`;
        this.joystickVector.set(dx / maxRadius, dy / maxRadius);
      }

      processInput() {
        if (!this.player || this.isPaused || this.isGameOver) return;

        let moveVec = new Vector2(0, 0);

        if (this.keys['KeyW'] || this.keys['ArrowUp']) moveVec.y -= 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) moveVec.y += 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveVec.x -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) moveVec.x += 1;

        if (this.joystickVector.mag() > 0.1) {
          moveVec = this.joystickVector.clone();
        }

        this.player.move(moveVec, this.map);
      }

      triggerLevelUpScreen() {
        this.isPaused = true;
        soundEngine.playLevelUp();
        const container = document.getElementById('cards-container');
        container.innerHTML = '';

        const upgrades = [
          { title: '공격력 증가', desc: '기본 공격 데미지가 +10 증가합니다.', apply: () => this.player.damage += 10, icon: '⚔️' },
          { title: '공격 속도 증가', desc: '공격 쿨타임이 15% 감소합니다.', apply: () => this.player.attackSpeed = Math.max(100, this.player.attackSpeed * 0.85), icon: '⚡' },
          { title: '최대 체력 증가', desc: '최대 HP가 +25 증가하고 회복됩니다.', apply: () => { this.player.maxHp += 25; this.player.hp += 25; }, icon: '❤️' },
          { title: '이동 속도 증가', desc: '플레이어 이동 속도가 증가합니다.', apply: () => this.player.speed += 0.6, icon: '👟' }
        ];

        // Shuffle & pick 3
        let shuffled = upgrades.sort(() => 0.5 - Math.random()).slice(0, 3);

        shuffled.forEach(up => {
          let card = document.createElement('div');
          card.className = 'upgrade-card';
          card.innerHTML = `
            <div class="card-icon">${up.icon}</div>
            <div class="card-title">${up.title}</div>
            <div class="card-desc">${up.desc}</div>
          `;
          card.onclick = () => {
            up.apply();
            this.isPaused = false;
            document.getElementById('upgrade-modal').classList.add('hidden');
          };
          container.appendChild(card);
        });

        document.getElementById('upgrade-modal').classList.remove('hidden');
      }

      updateUI() {
        if (!this.player) return;
        document.getElementById('hp-text').innerText = `${Math.max(0, Math.ceil(this.player.hp))} / ${this.player.maxHp}`;
        document.getElementById('hp-bar').style.width = `${Math.max(0, (this.player.hp / this.maxHp) * 100)}%`;

        document.getElementById('level-text').innerText = this.player.level;
        document.getElementById('exp-text').innerText = `${this.player.exp} / ${this.player.nextExp}`;
        document.getElementById('exp-bar').style.width = `${(this.player.exp / this.player.nextExp) * 100}%`;

        document.getElementById('coin-text').innerText = this.player.coins;
        document.getElementById('key-text').innerText = this.player.keys;
        document.getElementById('floor-text').innerText = this.floor;
      }

      checkInteractions() {
        if (!this.player) return;

        // Chest Interaction
        for (let chest of this.chests) {
          if (this.player.pos.dist(chest.pos) < 35) {
            chest.interact(this.player, this.drops, this.particleSys);
          }
        }

        // Exit Floor Portal Interaction
        if (this.player.pos.dist(this.map.exitPos) < 30) {
          this.floor++;
          soundEngine.playLevelUp();
          this.loadFloor();
        }

        // Player Death Check
        if (this.player.hp <= 0 && !this.isGameOver) {
          this.isGameOver = true;
          document.getElementById('gameover-stats').innerText = `도달 층수: ${this.floor}층 | 처치한 적: ${this.enemiesKilled}`;
          document.getElementById('gameover-modal').classList.remove('hidden');
        }
      }

      update() {
        if (this.isPaused || this.isGameOver || !this.player) return;

        this.processInput();
        this.camera.follow(this.player);

        // Update Enemies
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          let e = this.enemies[i];
          e.update(this.player, this.map, this.particleSys);
          if (e.markedForDelete) {
            this.enemiesKilled++;
            // Drop EXP / Coins
            this.drops.push(new ItemDrop(e.pos.x, e.pos.y, 'exp'));
            if (Math.random() < 0.4) this.drops.push(new ItemDrop(e.pos.x + 10, e.pos.y, 'coin'));
            this.enemies.splice(i, 1);
          }
        }

        // Update Item Drops
        for (let i = this.drops.length - 1; i >= 0; i--) {
          let d = this.drops[i];
          d.update(this.player);
          if (d.markedForDelete) {
            this.drops.splice(i, 1);
          }
        }

        // Damage Texts Update
        for (let i = this.damageTexts.length - 1; i >= 0; i--) {
          this.damageTexts[i].update();
          if (this.damageTexts[i].life <= 0) this.damageTexts.splice(i, 1);
        }

        this.particleSys.update();
        this.checkInteractions();
        this.updateUI();
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        if (this.player) {
          this.map.draw(this.ctx, this.camera);

          // Draw Chests
          for (let chest of this.chests) chest.draw(this.ctx, this.camera);

          // Draw Drops
          for (let drop of this.drops) drop.draw(this.ctx, this.camera);

          // Draw Enemies
          for (let enemy of this.enemies) enemy.draw(this.ctx, this.camera);

          // Draw Player
          this.player.draw(this.ctx, this.camera);

          // Draw Particles & Damage Overlay
          this.particleSys.draw(this.ctx, this.camera);
          for (let dt of this.damageTexts) dt.draw(this.ctx, this.camera);
        }
      }

      loop() {
        this.update();
        this.render();
        requestAnimationFrame(() => this.loop());
      }
    }

    /* ========================================================================== */
    /* 10. ENTRY POINT                                                            */
    /* ========================================================================== */
    window.onload = () => {
      const game = new Game();
      game.loop();
    };
  </script>
