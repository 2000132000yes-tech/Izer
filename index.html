<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Tactical AI FPS Spectator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      width: 90%;
      max-width: 420px;
    }
    .score-card {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      color: white;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .red { background: rgba(220, 53, 69, 0.85); }
    .blue { background: rgba(13, 110, 253, 0.85); }
    .status { font-size: 11px; margin-top: 2px; opacity: 0.9; }
    .score { font-size: 18px; margin-top: 4px; }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }
    .btn:active { background: rgba(255, 255, 255, 0.5); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <div class="score-card red">
      <div>AI RED</div>
      <div id="hp-red">HP: 100</div>
      <div id="state-red" class="status">상태: 탐색 중</div>
      <div id="score-red" class="score">0 Kills</div>
    </div>
    <div class="score-card blue">
      <div>AI BLUE</div>
      <div id="hp-blue">HP: 100</div>
      <div id="state-blue" class="status">상태: 탐색 중</div>
      <div id="score-blue" class="score">0 Kills</div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" onclick="setCamView('top')">탑뷰</button>
    <button class="btn" onclick="setCamView('red')">RED 시점</button>
    <button class="btn" onclick="setCamView('blue')">BLUE 시점</button>
  </div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111118);
    scene.fog = new THREE.FogExp2(0x111118, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 조명
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(20, 40, 20);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x555566));

    const MAP_SIZE = 60;
    const GRID_SIZE = 30;
    const CELL_SIZE = MAP_SIZE / GRID_SIZE;

    // 바닥
    const floorGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222225, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    function worldToGrid(x, z) {
      const gx = Math.floor((x + MAP_SIZE / 2) / CELL_SIZE);
      const gz = Math.floor((z + MAP_SIZE / 2) / CELL_SIZE);
      return {
        x: Math.max(0, Math.min(GRID_SIZE - 1, gx)),
        z: Math.max(0, Math.min(GRID_SIZE - 1, gz))
      };
    }

    function gridToWorld(gx, gz) {
      return {
        x: (gx + 0.5) * CELL_SIZE - MAP_SIZE / 2,
        z: (gz + 0.5) * CELL_SIZE - MAP_SIZE / 2
      };
    }

    // 실제 환경 장애물
    const obstacles = [];
    function createObstacle(x, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.6 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      obstacles.push(mesh);
    }

    // 지형 배치
    createObstacle(0, 0, 10, 4, 10);
    createObstacle(-12, -10, 8, 3, 6);
    createObstacle(12, 10, 8, 3, 6);
    createObstacle(-10, 12, 6, 3, 10);
    createObstacle(10, -12, 6, 3, 10);
    createObstacle(0, -20, 12, 3, 4);
    createObstacle(0, 20, 12, 3, 4);

    // AI 메모리 기반 A* 길찾기
    function findPath(startPos, targetPos, memoryGrid) {
      const start = worldToGrid(startPos.x, startPos.z);
      const target = worldToGrid(targetPos.x, targetPos.z);

      const openList = [];
      const closedList = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
      const parent = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));

      const gScore = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(Infinity));
      const fScore = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(Infinity));

      gScore[start.x][start.z] = 0;
      fScore[start.x][start.z] = Math.hypot(target.x - start.x, target.z - start.z);

      openList.push(start);

      while (openList.length > 0) {
        openList.sort((a, b) => fScore[a.x][a.z] - fScore[b.x][b.z]);
        const current = openList.shift();

        if (current.x === target.x && current.z === target.z) {
          const path = [];
          let curr = current;
          while (curr) {
            path.push(gridToWorld(curr.x, curr.z));
            curr = parent[curr.x][curr.z];
          }
          return path.reverse();
        }

        closedList[current.x][current.z] = true;

        const neighbors = [
          { x: current.x + 1, z: current.z }, { x: current.x - 1, z: current.z },
          { x: current.x, z: current.z + 1 }, { x: current.x, z: current.z - 1 }
        ];

        for (const n of neighbors) {
          if (n.x < 0 || n.x >= GRID_SIZE || n.z < 0 || n.z >= GRID_SIZE) continue;
          // AI가 직접 인식한 벽(1)만 피함
          if (memoryGrid[n.x][n.z] === 1 || closedList[n.x][n.z]) continue;

          const tentativeG = gScore[current.x][current.z] + 1;
          if (tentativeG < gScore[n.x][n.z]) {
            parent[n.x][n.z] = current;
            gScore[n.x][n.z] = tentativeG;
            fScore[n.x][n.z] = tentativeG + Math.hypot(target.x - n.x, target.z - n.z);

            if (!openList.some(o => o.x === n.x && o.z === n.z)) {
              openList.push(n);
            }
          }
        }
      }
      return null;
    }

    class TacticalBot {
      constructor(color, startX, startZ, name) {
        this.name = name;
        this.color = color;
        this.hp = 100;
        this.kills = 0;
        this.speed = 0.13;
        this.lastShot = 0;

        // FSM 상태: EXPLORE, COMBAT, RETREAT, HEAL
        this.state = 'EXPLORE'; 
        this.targetWaypoint = null;
        this.path = [];

        // 지형 기억 그리드 (-1: 미탐색, 0: 빈 공간, 1: 벽)
        this.memoryGrid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(-1));

        const group = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        group.add(body);

        const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 0.8);
        const gunMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0.4, 1.1, -0.5);
        group.add(gun);

        this.mesh = group;
        this.mesh.position.set(startX, 0, startZ);
        scene.add(this.mesh);
      }

      reset(x, z) {
        this.hp = 100;
        this.state = 'EXPLORE';
        this.mesh.position.set(x, 0, z);
        this.path = [];
        this.targetWaypoint = null;
      }

      // 주위 지형을 레이캐스트로 탐색하여 메모리에 기록
      scanEnvironment() {
        const myPos = this.mesh.position;
        const rays = 16;
        for (let i = 0; i < rays; i++) {
          const angle = (i / rays) * Math.PI * 2;
          const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
          const raycaster = new THREE.Raycaster(new THREE.Vector3(myPos.x, 1, myPos.z), dir, 0, 15);
          const hits = raycaster.intersectObjects(obstacles);

          if (hits.length > 0) {
            const hitPoint = hits[0].point;
            const g = worldToGrid(hitPoint.x, hitPoint.z);
            this.memoryGrid[g.x][g.z] = 1; // 벽 기록
          }
        }
        // 현재 위치 및 주변은 안전 공간으로 기록
        const currentG = worldToGrid(myPos.x, myPos.z);
        this.memoryGrid[currentG.x][currentG.z] = 0;
      }

      // 적 시야에서 완전히 차단된 안전 엄폐 장소 탐색
      findSafeCoverPoint(enemyPos) {
        let bestPoint = null;
        let maxCoverScore = -Infinity;

        for (let gx = 1; gx < GRID_SIZE - 1; gx += 2) {
          for (let gz = 1; gz < GRID_SIZE - 1; gz += 2) {
            if (this.memoryGrid[gx][gz] === 0) {
              const worldP = gridToWorld(gx, gz);
              const dirFromEnemy = new THREE.Vector3().subVectors(worldP, enemyPos);
              const distFromEnemy = dirFromEnemy.length();
              dirFromEnemy.y = 0;
              dirFromEnemy.normalize();

              // 적 시선 레이캐스트
              const ray = new THREE.Raycaster(new THREE.Vector3(enemyPos.x, 1, enemyPos.z), dirFromEnemy, 0, distFromEnemy);
              const hits = ray.intersectObjects(obstacles);

              // 적 시야가 가려지는 곳(시선 차단 엄폐물 존재)
              if (hits.length > 0) {
                const distFromMe = new THREE.Vector3(worldP.x, 0, worldP.z).distanceTo(this.mesh.position);
                const score = distFromEnemy * 2 - distFromMe; // 적과의 거리는 멀고, 나와는 가까운 곳
                if (score > maxCoverScore) {
                  maxCoverScore = score;
                  bestPoint = worldP;
                }
              }
            }
          }
        }
        return bestPoint;
      }

      update(enemy) {
        if (this.hp <= 0) return;

        this.scanEnvironment();

        const myPos = this.mesh.position;
        const enemyPos = enemy.mesh.position;

        // 적 시야 확보 레이캐스팅
        const dirToEnemy = new THREE.Vector3().subVectors(enemyPos, myPos);
        const distToEnemy = dirToEnemy.length();
        dirToEnemy.y = 0;
        dirToEnemy.normalize();

        const raycaster = new THREE.Raycaster(new THREE.Vector3(myPos.x, 1, myPos.z), dirToEnemy, 0, distToEnemy);
        const hits = raycaster.intersectObjects(obstacles);
        const canSeeEnemy = (hits.length === 0);

        // 상태 전환 (FSM)
        if (this.hp < 40) {
          this.state = (canSeeEnemy || this.hp < 30) ? 'RETREAT' : 'HEAL';
        } else if (canSeeEnemy) {
          this.state = 'COMBAT';
        } else if (this.state === 'COMBAT' && !canSeeEnemy) {
          this.state = 'EXPLORE';
        }

        // 상태별 로직 수행
        if (this.state === 'COMBAT') {
          // 교전
          const angle = Math.atan2(dirToEnemy.x, dirToEnemy.z);
          this.mesh.rotation.y = angle + Math.PI;

          if (distToEnemy > 12) {
            this.mesh.position.addScaledVector(dirToEnemy, this.speed);
          } else if (distToEnemy < 5) {
            this.mesh.position.addScaledVector(dirToEnemy, -this.speed);
          }
          this.shoot(enemy);

        } else if (this.state === 'RETREAT') {
          // 적을 등지고 안전 엄폐 장소로 후퇴
          if (!this.targetWaypoint || Math.random() < 0.05) {
            this.targetWaypoint = this.findSafeCoverPoint(enemyPos);
          }

          if (this.targetWaypoint) {
            this.path = findPath(myPos, this.targetWaypoint, this.memoryGrid) || [];
            this.moveAlongPath();
          } else {
            // 엄폐 장소를 미처 기억 못했다면 일단 적의 반대 방향으로 후퇴
            this.mesh.position.addScaledVector(dirToEnemy, -this.speed);
          }

        } else if (this.state === 'HEAL') {
          // 적에게 안 보이는 곳에서 엄폐 체력 회복
          this.hp = Math.min(100, this.hp + 0.15); 
          if (this.hp >= 80) this.state = 'EXPLORE';

        } else if (this.state === 'EXPLORE') {
          // 지형 무작위 탐색
          if (!this.targetWaypoint || new THREE.Vector3(this.targetWaypoint.x, 0, this.targetWaypoint.z).distanceTo(myPos) < 2) {
            // 랜덤 탐색 지점 선정
            const rx = (Math.random() - 0.5) * (MAP_SIZE - 10);
            const rz = (Math.random() - 0.5) * (MAP_SIZE - 10);
            this.targetWaypoint = { x: rx, z: rz };
            this.path = findPath(myPos, this.targetWaypoint, this.memoryGrid) || [];
          }
          this.moveAlongPath();
        }

        // 맵 경계 제한
        this.mesh.position.x = Math.max(-27, Math.min(27, this.mesh.position.x));
        this.mesh.position.z = Math.max(-27, Math.min(27, this.mesh.position.z));
      }

      moveAlongPath() {
        if (this.path && this.path.length > 1) {
          const next = this.path[1];
          const dir = new THREE.Vector3(next.x - this.mesh.position.x, 0, next.z - this.mesh.position.z);
          if (dir.length() < 0.8) {
            this.path.shift();
          } else {
            dir.normalize();
            const angle = Math.atan2(dir.x, dir.z);
            this.mesh.rotation.y = angle + Math.PI;
            this.mesh.position.addScaledVector(dir, this.speed);
          }
        }
      }

      shoot(target) {
        const now = Date.now();
        if (now - this.lastShot < 320) return;
        this.lastShot = now;

        const bulletGeo = new THREE.BufferGeometry().setFromPoints([
          this.mesh.position.clone().add(new THREE.Vector3(0, 1.1, 0)),
          target.mesh.position.clone().add(new THREE.Vector3(0, 0.9 + (Math.random() - 0.5) * 0.4, 0))
        ]);
        const bulletMat = new THREE.LineBasicMaterial({ color: this.color === 0xff3333 ? 0xff8888 : 0x8888ff });
        const line = new THREE.Line(bulletGeo, bulletMat);
        scene.add(line);
        setTimeout(() => scene.remove(line), 40);

        if (Math.random() < 0.7) {
          target.takeDamage(12, this);
        }
      }

      takeDamage(amount, attacker) {
        this.hp -= amount;
        if (this.hp <= 0) {
          this.hp = 0;
          attacker.kills++;
          setTimeout(() => {
            redBot.reset(-20, -20);
            blueBot.reset(20, 20);
          }, 1000);
        }
      }
    }

    const redBot = new TacticalBot(0xff3333, -20, -20, 'RED');
    const blueBot = new TacticalBot(0x3388ff, 20, 20, 'BLUE');

    let currentCamMode = 'top';
    window.setCamView = function(mode) {
      currentCamMode = mode;
    };

    function updateCamera() {
      if (currentCamMode === 'top') {
        camera.position.set(0, 50, 0);
        camera.lookAt(0, 0, 0);
      } else if (currentCamMode === 'red') {
        const p = redBot.mesh.position;
        const rot = redBot.mesh.rotation.y;
        camera.position.set(p.x + Math.sin(rot) * 2.5, 2.3, p.z + Math.cos(rot) * 2.5);
        camera.lookAt(p.x - Math.sin(rot) * 10, 1.5, p.z - Math.cos(rot) * 10);
      } else if (currentCamMode === 'blue') {
        const p = blueBot.mesh.position;
        const rot = blueBot.mesh.rotation.y;
        camera.position.set(p.x + Math.sin(rot) * 2.5, 2.3, p.z + Math.cos(rot) * 2.5);
        camera.lookAt(p.x - Math.sin(rot) * 10, 1.5, p.z - Math.cos(rot) * 10);
      }
    }

    const stateTexts = {
      'EXPLORE': '상태: 지형 탐색 중',
      'COMBAT': '상태: 교전 중!',
      'RETREAT': '상태: 엄폐물로 후퇴 중',
      'HEAL': '상태: 은신 및 회복 중...'
    };

    function updateUI() {
      document.getElementById('hp-red').innerText = `HP: ${Math.ceil(redBot.hp)}`;
      document.getElementById('state-red').innerText = stateTexts[redBot.state];
      document.getElementById('score-red').innerText = `${redBot.kills} Kills`;

      document.getElementById('hp-blue').innerText = `HP: ${Math.ceil(blueBot.hp)}`;
      document.getElementById('state-blue').innerText = stateTexts[blueBot.state];
      document.getElementById('score-blue').innerText = `${blueBot.kills} Kills`;
    }

    function animate() {
      requestAnimationFrame(animate);

      redBot.update(blueBot);
      blueBot.update(redBot);

      updateCamera();
      updateUI();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
