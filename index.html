<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세로형 탑다운 카드 슈팅 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 450px;
            height: 700px;
            background-color: #c2a178;
            border: 4px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        canvas {
            display: block;
        }
        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* 스테이지 마름모 표시 */
        .stage-diamond {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 42px;
            height: 42px;
            background: #fff;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .stage-number {
            transform: rotate(-45deg);
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        /* 시작 버튼 */
        #start-btn {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background: #27ae60;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        #start-btn:hover {
            background: #219150;
            transform: translateX(-50%) scale(1.05);
        }
        #start-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: translateX(-50%);
        }
        /* 카드 덱 영역 */
        #deck-area {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 80px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            font-weight: bold;
            color: #333;
        }
        #deck-area:hover {
            transform: translateX(-50%) scale(1.05);
        }
        #deck-area.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 카드 뽑기 팝업 영역 */
        #card-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .card {
            width: 105px;
            height: 150px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            animation: drawCard 0.3s ease-out forwards;
        }
        .card:hover {
            transform: translateY(-8px);
        }
        .card-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }
        .card-value {
            font-size: 16px;
            font-weight: bold;
            color: #e67e22;
        }
        @keyframes drawCard {
            0% { opacity: 0; transform: translateY(60px) scale(0.5); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* 데미지 텍스트 */
        .damage-text {
            position: absolute;
            font-weight: bold;
            font-size: 15px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        .damage-text.normal { color: #ffffff; text-shadow: 0 0 3px #000; }
        .damage-text.headshot { color: #ff2a2a; font-size: 20px; text-shadow: 0 0 5px #000; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -35px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="450" height="700"></canvas>
    
    <div id="ui-layer">
        <div class="stage-diamond">
            <div class="stage-number" id="stage-num">1</div>
        </div>
        <button id="start-btn" disabled>시작</button>
        <div id="deck-area"><span>DECK</span></div>
        <div id="card-container"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 오디오 합성 시스템 (외부 파일 없이 총소리 생성)
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playGunSound(gunType) {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (gunType === 'SHERIFF') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    } else if (gunType === 'GHOST') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
    } else { // CLASSIC
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.18);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
    }
}

// 게임 상태
let stage = 1;
let gameState = 'PREPARE';
let cardDrawn = false;
let myHeadshotProb = 0.10;
let enemyHeadshotProb = 0.10;
let shakeTime = 0;

// 총기 정보
const GUNS = {
    CLASSIC: { name: '클래식', bodyDmg: 20, headDmg: 60, speed: 13, cooldown: 40, type: 'CLASSIC' },
    GHOST: { name: '고스트', bodyDmg: 50, headDmg: 100, speed: 16, cooldown: 30, type: 'GHOST' },
    SHERIFF: { name: '셰리프', bodyDmg: 60, headDmg: 140, speed: 18, cooldown: 55, type: 'SHERIFF' }
};

// 지형 및 데코레이션
let obstacles = [];
let grassDetails = [];
let rockDetails = [];

// 개체 리스트
let allies = [];
let enemies = [];
let bullets = [];
let particles = [];

// UI 요소
const stageNumEl = document.getElementById('stage-num');
const startBtn = document.getElementById('start-btn');
const deckArea = document.getElementById('deck-area');
const cardContainer = document.getElementById('card-container');

// --- 클래스 정의 ---

class Entity {
    constructor(x, y, isEnemy, gun) {
        this.x = x;
        this.y = y;
        this.radius = 13;
        this.isEnemy = isEnemy;
        this.maxHp = isEnemy ? 150 + (stage - 1) * 30 : 150;
        this.hp = this.maxHp;
        this.gun = gun;
        this.angle = 0;
        this.shootCooldown = 0;
        this.speed = 1.4;
        
        // 탐색/AI 제어
        this.target = null;
        this.patrolAngle = Math.random() * Math.PI * 2;
        this.patrolTimer = 0;
        this.sightRange = 220; // 시야 범위
    }

    update() {
        if (this.hp <= 0) return;
        if (this.shootCooldown > 0) this.shootCooldown--;

        const targets = this.isEnemy ? allies : enemies;
        const aliveTargets = targets.filter(t => t.hp > 0);

        // 시야 내 적 탐색 (Raycast 시야 검사)
        let visibleTarget = null;
        let minDist = Infinity;

        for (let t of aliveTargets) {
            let d = Math.hypot(t.x - this.x, t.y - this.y);
            if (d < this.sightRange && d < minDist) {
                if (hasLineOfSight(this.x, this.y, t.x, t.y)) {
                    minDist = d;
                    visibleTarget = t;
                }
            }
        }

        this.target = visibleTarget;

        if (this.target) {
            // 적 발견 시 시선 고정
            this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);

            // 거리 및 엄폐 판단
            if (minDist > 120) {
                // 사거리 내부로 연속 이동 (각도 제한 없음)
                let moveX = Math.cos(this.angle) * this.speed;
                let moveY = Math.sin(this.angle) * this.speed;
                this.move(moveX, moveY);
            } else {
                // 적절한 사거리 확보 시 엄폐/약간의 좌우 움직임
                let strafeAngle = this.angle + Math.PI / 2 * (Math.sin(Date.now() / 300) > 0 ? 1 : -1);
                this.move(Math.cos(strafeAngle) * this.speed * 0.5, Math.sin(strafeAngle) * this.speed * 0.5);

                if (this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = this.gun.cooldown;
                }
            }
        } else {
            // 적을 못 찾았을 때는 자유 탐색 (배회)
            this.patrolTimer--;
            if (this.patrolTimer <= 0) {
                this.patrolAngle += (Math.random() - 0.5) * 1.5;
                this.patrolTimer = 40 + Math.floor(Math.random() * 40);
            }

            this.angle = this.patrolAngle;
            let moveX = Math.cos(this.patrolAngle) * this.speed * 0.7;
            let moveY = Math.sin(this.patrolAngle) * this.speed * 0.7;
            this.move(moveX, moveY);
        }

        // 벽 및 타 개체와의 충돌 밀려나기 (기물 겹침 방지)
        this.resolveCollisions();
    }

    move(dx, dy) {
        let nextX = this.x + dx;
        let nextY = this.y + dy;

        // 장애물 충돌 검사
        if (!checkObstacleCollision(nextX, this.y, this.radius)) this.x = nextX;
        if (!checkObstacleCollision(this.x, nextY, this.radius)) this.y = nextY;

        // 맵 경계 제한
        this.x = Math.max(this.radius + 5, Math.min(canvas.width - this.radius - 5, this.x));
        this.y = Math.max(this.radius + 5, Math.min(canvas.height - this.radius - 5, this.y));
    }

    resolveCollisions() {
        const allEntities = [...allies, ...enemies].filter(e => e !== this && e.hp > 0);
        for (let other of allEntities) {
            let dx = this.x - other.x;
            let dy = this.y - other.y;
            let dist = Math.hypot(dx, dy);
            let minDist = this.radius + other.radius;

            if (dist < minDist && dist > 0) {
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;

                this.x += nx * overlap * 0.5;
                this.y += ny * overlap * 0.5;
            }
        }
    }

    shoot() {
        // 캐릭터 오른쪽 손 위치에서 총알 발사
        let rightHandOffsetX = 8;
        let rightHandOffsetY = 12;

        let handX = this.x + Math.cos(this.angle) * rightHandOffsetY + Math.cos(this.angle + Math.PI/2) * rightHandOffsetX;
        let handY = this.y + Math.sin(this.angle) * rightHandOffsetY + Math.sin(this.angle + Math.PI/2) * rightHandOffsetX;

        bullets.push(new Bullet(handX, handY, this.angle, this.gun, this.isEnemy));
        shakeTime = 4; // 화면 흔들림 효과
        playGunSound(this.gun.type);
    }

    draw() {
        if (this.hp <= 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.isEnemy) {
            // 적: 빨간 원
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#922b21';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // 아군: 발로란트 제트 (탑다운 모델링)
            // 파란 어깨/의상
            ctx.fillStyle = '#2980b9';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1b4f72';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 백발 (제트 머리 스타일)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-2, 0, this.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // 바람 꽁지머리
            ctx.fillStyle = '#d5f5e3';
            ctx.beginPath();
            ctx.moveTo(-this.radius * 0.8, -3);
            ctx.lineTo(-this.radius * 1.5, 0);
            ctx.lineTo(-this.radius * 0.8, 3);
            ctx.closePath();
            ctx.fill();
        }

        // 오른손 및 디테일 총기 모델링
        ctx.save();
        ctx.translate(8, 8); // 캐릭터 우측 손 위치

        ctx.fillStyle = '#2c3e50';
        if (this.gun === GUNS.CLASSIC) { 
            // 클래식 (글록 느낌)
            ctx.fillRect(0, -2, 10, 4);
            ctx.fillStyle = '#111';
            ctx.fillRect(-2, -1, 4, 2);
        } else if (this.gun === GUNS.GHOST) { 
            // 고스트 (긴 소음기 권총)
            ctx.fillRect(0, -2, 10, 4);
            ctx.fillStyle = '#1a252f';
            ctx.fillRect(10, -2.5, 12, 5); // 사각형 소음기
        } else if (this.gun === GUNS.SHERIFF) { 
            // 셰리프 (대형 리볼버)
            ctx.fillRect(0, -2, 8, 4);
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(3, -3, 6, 6); // 회전 실린더
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(9, -2, 11, 4); // 총열
        }
        ctx.restore();

        ctx.restore();

        this.drawUI();
    }

    drawUI() {
        const barW = 32;
        const barH = 4;
        const barX = this.x - barW / 2;
        const barY = this.y - this.radius - 14;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX, barY, barW, barH);

        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = this.isEnemy ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(barX, barY, barW * hpPercent, barH);

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        // 총기 이름 표시
        ctx.fillStyle = '#222';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.gun.name, this.x, barY - 3);
    }
}

class Bullet {
    constructor(x, y, angle, gun, isEnemy) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.gun = gun;
        this.isEnemy = isEnemy;
        this.speed = gun.speed;
        this.active = true;
    }

    update() {
        if (!this.active) return;

        let nextX = this.x + Math.cos(this.angle) * this.speed;
        let nextY = this.y + Math.sin(this.angle) * this.speed;

        // 벽 충돌 (총알 통과 불가)
        if (checkObstacleCollision(nextX, nextY, 2)) {
            this.active = false;
            return;
        }

        this.x = nextX;
        this.y = nextY;

        // 캐릭터 충돌
        const targets = this.isEnemy ? allies : enemies;
        for (let target of targets) {
            if (target.hp > 0 && Math.hypot(target.x - this.x, target.y - this.y) < target.radius) {
                this.hit(target);
                this.active = false;
                break;
            }
        }

        // 화면 밖으로 나갈 때
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.active = false;
        }
    }

    hit(target) {
        let prob = this.isEnemy ? enemyHeadshotProb : myHeadshotProb;
        let isHead = Math.random() < prob;
        let damage = isHead ? this.gun.headDmg : this.gun.bodyDmg;

        target.hp -= damage;
        showDamageText(target.x, target.y - 15, damage, isHead);

        if (target.hp <= 0) {
            explode(target.x, target.y, target.isEnemy);
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - Math.cos(this.angle) * 8, this.y - Math.sin(this.angle) * 8);
        ctx.stroke();
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 25;
        this.maxLife = 25;
        this.size = Math.random() * 3 + 2;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- 보조 검사 함수 ---

function checkObstacleCollision(x, y, r) {
    for (let obs of obstacles) {
        if (x + r > obs.x && x - r < obs.x + obs.w &&
            y + r > obs.y && y - r < obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

function hasLineOfSight(x1, y1, x2, y2) {
    let steps = 15;
    for (let i = 0; i <= steps; i++) {
        let px = x1 + (x2 - x1) * (i / steps);
        let py = y1 + (y2 - y1) * (i / steps);
        if (checkObstacleCollision(px, py, 2)) return false;
    }
    return true;
}

function initMap() {
    // 장애물 생성
    obstacles = [];
    const count = 5 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
        let w = 40 + Math.random() * 40;
        let h = 40 + Math.random() * 40;
        let x = 30 + Math.random() * (canvas.width - w - 60);
        let y = 120 + Math.random() * (canvas.height - h - 240);
        obstacles.push({ x, y, w, h });
    }

    // 잔디 디테일 생성
    grassDetails = [];
    for (let i = 0; i < 35; i++) {
        grassDetails.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height
        });
    }

    // 돌멩이 생성
    rockDetails = [];
    for (let i = 0; i < 20; i++) {
        rockDetails.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: 2 + Math.random() * 3
        });
    }
}

function drawEnvironment() {
    // 잔디 세부 표현
    ctx.strokeStyle = '#8daa73';
    ctx.lineWidth = 1.5;
    for (let g of grassDetails) {
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x - 2, g.y - 5);
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x + 3, g.y - 6);
        ctx.stroke();
    }

    // 돌멩이 표현
    ctx.fillStyle = '#a1887f';
    for (let r of rockDetails) {
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fill();
    }

    // 지형 장애물 (돌 벽)
    for (let obs of obstacles) {
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = 3;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }
}

function initRound() {
    stageNumEl.innerText = stage;
    bullets = [];
    particles = [];
    cardDrawn = false;
    deckArea.classList.remove('disabled');
    startBtn.disabled = true;
    cardContainer.innerHTML = '';
    gameState = 'PREPARE';

    initMap();

    enemyHeadshotProb = 0.10 + (stage - 1) * 0.03;

    // 아군 세팅
    if (allies.length === 0) {
        allies = [
            new Entity(120, 620, false, GUNS.CLASSIC),
            new Entity(330, 620, false, GUNS.CLASSIC)
        ];
    } else {
        let spacing = canvas.width / (allies.length + 1);
        allies.forEach((a, idx) => {
            a.hp = a.maxHp;
            a.x = spacing * (idx + 1);
            a.y = 620;
        });
    }

    // 적 생성 (라운드 비례)
    enemies = [];
    const gunKeys = Object.keys(GUNS);
    let enemyCount = stage;
    let spacing = canvas.width / (enemyCount + 1);

    for (let i = 0; i < enemyCount; i++) {
        let randomGun = GUNS[gunKeys[Math.floor(Math.random() * gunKeys.length)]];
        enemies.push(new Entity(spacing * (i + 1), 70, true, randomGun));
    }
}

function showDamageText(x, y, damage, isHead) {
    const el = document.createElement('div');
    el.className = `damage-text ${isHead ? 'headshot' : 'normal'}`;
    el.innerText = isHead ? `HEAD! -${damage}` : `-${damage}`;
    
    const rect = canvas.getBoundingClientRect();
    el.style.left = `${rect.left + x}px`;
    el.style.top = `${rect.top + y}px`;

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function explode(x, y, isEnemy) {
    const color = isEnemy ? '#e74c3c' : '#00e5ff';
    for (let i = 0; i < 25; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function drawCards() {
    if (cardDrawn || gameState !== 'PREPARE') return;
    cardDrawn = true;
    deckArea.classList.add('disabled');

    cardContainer.innerHTML = '';

    for (let i = 0; i < 3; i++) {
        let isSummonCard = Math.random() < 0.25;

        const card = document.createElement('div');
        card.className = 'card';

        if (isSummonCard) {
            card.innerHTML = `
                <div class="card-title">지원 요청</div>
                <div class="card-value" style="color: #2980b9;">+아군 1명</div>
            `;
            card.onclick = () => {
                let spawnX = 80 + Math.random() * 290;
                allies.push(new Entity(spawnX, 620, false, GUNS.CLASSIC));
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        } else {
            let boost = Math.floor(Math.random() * 10) + 1;
            card.innerHTML = `
                <div class="card-title">헤드샷 확률</div>
                <div class="card-value">+${boost}%</div>
            `;
            card.onclick = () => {
                myHeadshotProb += boost / 100;
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        }

        cardContainer.appendChild(card);
    }
}

// --- 이벤트 리스너 ---

deckArea.addEventListener('click', drawCards);

startBtn.addEventListener('click', () => {
    if (gameState === 'PREPARE' && cardDrawn) {
        gameState = 'BATTLE';
        startBtn.disabled = true;
    }
});

// --- 메인 루프 ---

function gameLoop() {
    ctx.save();

    // 화면 흔들림 오프셋
    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * 6;
        let dy = (Math.random() - 0.5) * 6;
        ctx.translate(dx, dy);
        shakeTime--;
    }

    ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);

    // 환경 배경
    drawEnvironment();

    if (gameState === 'BATTLE') {
        allies.forEach(a => a.update());
        enemies.forEach(e => e.update());
        bullets.forEach(b => b.update());
    }

    particles.forEach(p => p.update());

    bullets = bullets.filter(b => b.active);
    particles = particles.filter(p => p.life > 0);

    allies.forEach(a => a.draw());
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());

    ctx.restore();

    if (gameState === 'BATTLE') {
        const aliveAllies = allies.filter(a => a.hp > 0);
        const aliveEnemies = enemies.filter(e => e.hp > 0);

        if (aliveEnemies.length === 0) {
            stage++;
            setTimeout(() => {
                initRound();
            }, 1000);
            gameState = 'WAIT';
        } else if (aliveAllies.length === 0) {
            gameState = 'GAMEOVER';
            setTimeout(() => {
                alert('모든 아군이 전멸했습니다!');
                stage = 1;
                myHeadshotProb = 0.10;
                allies = [];
                initRound();
            }, 500);
        }
    }

    requestAnimationFrame(gameLoop);
}

// 게임 구동
initRound();
gameLoop();
</script>
