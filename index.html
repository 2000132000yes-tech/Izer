<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: #000000;
            touch-action: none;
            display: block;
        }

        /* UI 레이어 */
        .ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .currency-box {
            display: flex;
            align-items: center;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
        }

        .diamond-icon {
            width: 12px;
            height: 12px;
            background-color: #00e5ff;
            transform: rotate(45deg);
            margin-right: 8px;
            box-shadow: 0 0 6px #00e5ff;
        }

        .plus-btn {
            width: 36px;
            height: 36px;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #555;
            border-radius: 50%;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
        }

        .plus-btn:active {
            transform: scale(0.95);
            background: #444;
        }

        /* 슬라이드 업그레이드 창 */
        .upgrade-panel {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 60%;
            background: rgba(15, 15, 15, 0.95);
            border-bottom: 2px solid #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            transition: top 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 20;
            box-sizing: border-box;
            padding: 20px;
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        .upgrade-panel.active {
            top: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }

        .upgrade-list {
            flex: 1;
            overflow-y: auto;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .upgrade-info {
            font-size: 14px;
        }

        .upgrade-cost-btn {
            background: #00e5ff;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-layer">
            <div class="currency-box">
                <div class="diamond-icon"></div>
                <span id="gemCount">0</span>
            </div>
            <button class="plus-btn" id="openUpgradeBtn">+</button>
        </div>

        <div class="upgrade-panel" id="upgradePanel">
            <div class="panel-header">
                <div class="panel-title">UPGRADES</div>
                <button class="close-btn" id="closeUpgradeBtn">✕</button>
            </div>
            <div class="upgrade-list">
                <div class="upgrade-item">
                    <div class="upgrade-info">공 속도 증가</div>
                    <button class="upgrade-cost-btn">10</button>
                </div>
                <div class="upgrade-item">
                    <div class="upgrade-info">공 크기 증가</div>
                    <button class="upgrade-cost-btn">25</button>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountEl = document.getElementById('gemCount');
        const upgradePanel = document.getElementById('upgradePanel');
        const openUpgradeBtn = document.getElementById('openUpgradeBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');

        let gems = 0;

        // UI 이벤트
        openUpgradeBtn.addEventListener('click', () => {
            upgradePanel.classList.add('active');
        });

        closeUpgradeBtn.addEventListener('click', () => {
            upgradePanel.classList.remove('active');
        });

        // 캔버스 크기 조정
        const size = Math.min(window.innerWidth, window.innerHeight);
        canvas.width = size;
        canvas.height = size;

        const gridCount = 50; 
        const pixelSize = size / gridCount;

        let pixels = [];
        const particles = [];

        // 3x3 공백
        const centerStart = Math.floor(gridCount / 2) - 1;
        const centerEnd = centerStart + 2;

        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                pixels.push({
                    x: c * pixelSize,
                    y: r * pixelSize
                });
            }
        }

        // 공 설정
        const ball = {
            x: (centerStart + 1.5) * pixelSize,
            y: (centerStart + 1.5) * pixelSize,
            radius: pixelSize * 0.35,
            dx: pixelSize * 0.15,
            dy: pixelSize * 0.12,
            color: 'orange',
            history: []
        };

        // 파티클 생성 함수
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: pixelSize * 0.3,
                    alpha: 1,
                    life: 0.05
                });
            }
        }

        function update() {
            ball.history.push({ x: ball.x, y: ball.y });
            if (ball.history.length > 8) {
                ball.history.shift();
            }

            let nextX = ball.x + ball.dx;
            let nextY = ball.y + ball.dy;

            // 벽 충돌
            if (nextX - ball.radius < 0 || nextX + ball.radius > canvas.width) {
                ball.dx = -ball.dx;
                nextX = ball.x + ball.dx;
            }
            if (nextY - ball.radius < 0 || nextY + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
                nextY = ball.y + ball.dy;
            }

            // 블록 충돌 및 제거
            for (let i = pixels.length - 1; i >= 0; i--) {
                const p = pixels[i];

                const closestX = Math.max(p.x, Math.min(nextX, p.x + pixelSize));
                const closestY = Math.max(p.y, Math.min(nextY, p.y + pixelSize));

                const distX = nextX - closestX;
                const distY = nextY - closestY;
                const distance = Math.hypot(distX, distY);

                if (distance < ball.radius) {
                    // 충돌 위치에 파티클 발생
                    createParticles(p.x + pixelSize / 2, p.y + pixelSize / 2);

                    // 블록 제거
                    pixels.splice(i, 1);

                    // 재화 증가
                    gems += 1;
                    gemCountEl.textContent = gems;

                    // 공 반사
                    if (Math.abs(distX) > Math.abs(distY)) {
                        ball.dx = -ball.dx;
                    } else {
                        ball.dy = -ball.dy;
                    }
                    break;
                }
            }

            ball.x += ball.dx;
            ball.y += ball.dy;

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 회색 블록
            ctx.fillStyle = '#888888';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 파티클
            for (let i = 0; i < particles.length; i++) {
                const pt = particles[i];
                ctx.fillStyle = `rgba(136, 136, 136, ${pt.alpha})`;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            }

            // 잔상
            for (let i = 0; i < ball.history.length; i++) {
                const pos = ball.history[i];
                const alpha = (i + 1) / ball.history.length;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 165, 0, ${alpha * 0.4})`;
                ctx.fill();
                ctx.closePath();
            }

            // 주황색 공
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
