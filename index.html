<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars Style Web Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* 홈 화면 UI */
        #home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }
        #home-screen h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #000;
            color: #ffcc00;
        }
        #home-screen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .btn-match {
            padding: 15px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(180deg, #ff9900 0%, #ff5500 100%);
            border: 4px solid #fff;
            border-radius: 50px;
            box-shadow: 0 8px 0 #993300, 0 15px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-match:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #993300, 0 8px 10px rgba(0,0,0,0.4);
        }

        /* 게임 화면 HUD */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 5;
        }
        .hud-stats {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 모바일 가상 조이스틱 영역 */
        .joystick-zone {
            position: absolute;
            bottom: 30px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: auto;
            touch-action: none;
        }
        #move-joystick-zone {
            left: 40px;
        }
        #attack-joystick-zone {
            right: 40px;
            background: rgba(255, 0, 0, 0.15);
            border: 2px solid rgba(255, 100, 100, 0.3);
        }
        .joystick-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            margin-top: -30px;
            margin-left: -30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #attack-handle {
            background: rgba(255, 80, 80, 0.8);
        }

        /* 결과 화면 */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            display: none;
        }
        #game-over-title {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
    </style>
    <!-- Three.js 3D 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. 홈 화면 (매치 메이킹) -->
    <div id="home-screen">
        <h1>BRAWL MINI</h1>
        <p>가로 모드로 최적화된 3D 3v3 캐주얼 대전</p>
        <button class="btn-match" onclick="startMatch()">매치 시작</button>
    </div>

    <!-- 2. 인게임 HUD & 컨트롤러 -->
    <div id="game-hud">
        <div class="hud-stats">
            <div>체력: <span id="hp-display" style="color: #4CAF50;">1000</span></div>
            <div>점수: <span id="score-display" style="color: #FFD700;">0</span></div>
        </div>
        
        <!-- 이동 조이스틱 (좌측) -->
        <div id="move-joystick-zone" class="joystick-zone">
            <div id="move-handle" class="joystick-handle"></div>
        </div>
        
        <!-- 조준/공격 조이스틱 (우측) -->
        <div id="attack-joystick-zone" class="joystick-zone">
            <div id="attack-handle" class="joystick-handle"></div>
        </div>
    </div>

    <!-- 3. 게임 결과 화면 -->
    <div id="game-over-screen">
        <h1 id="game-over-title">VICTORY</h1>
        <button class="btn-match" onclick="returnToHome()">홈으로 돌아가기</button>
    </div>

    <script>
        // --- 1. 전역 변수 및 게임 상태 설정 ---
        let scene, camera, renderer;
        let player, playerBody;
        const enemies = [];
        const bullets = [];
        const obstacles = [];
        
        let isGameRunning = false;
        let score = 0;
        let playerHp = 1000;
        const maxHp = 1000;
        
        let lastAttackTime = 0;
        const attackCooldown = 300; // ms

        // 조이스틱 상태
        const moveInput = { x: 0, y: 0, active: false };
        const attackInput = { x: 0, y: 0, active: false };

        // --- 2. 초기화 및 Three.js 기본 씬 설정 ---
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x4a7c59); // 상큼한 잔디밭 색상

            // 가로 모드 비율 적용 카메라 (Top-Down / Quarter View)
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 22, 15);
            camera.lookAt(0, 0, 0);

            // 조명 설정
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        // --- 3. 절차적 3D 모델링 생성 함수 ---
        // 플레이어 / 적 브롤러 모델링 (캐릭터 잡다한 외형 구성)
        function createBrawlerModel(color) {
            const group = new THREE.Group();

            // 몸통
            const bodyGeo = new THREE.CylinderGeometry(0.6, 0.5, 1.2, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            group.add(body);

            // 머리
            const headGeo = new THREE.SphereGeometry(0.45, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.4;
            group.add(head);

            // 눈 (바라보는 방향 시각화)
            const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.15);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
            eyeLeft.position.set(0.18, 1.45, 0.35);
            const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
            eyeRight.position.set(-0.18, 1.45, 0.35);
            group.add(eyeLeft);
            group.add(eyeRight);

            // 총기/무기
            const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 0.7);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.4, 0.8, 0.4);
            group.add(gun);

            return group;
        }

        // 맵 요소 생성 (바닥, 장해물/상자 모델링)
        function setupMap() {
            // 바닥
            const floorGeo = new THREE.PlaneGeometry(40, 40);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x5c946e });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 외곽 벽
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x2b4c3f });
            const wallGeoH = new THREE.BoxGeometry(42, 2, 1);
            const wallGeoV = new THREE.BoxGeometry(1, 2, 42);

            const wallN = new THREE.Mesh(wallGeoH, wallMat); wallN.position.set(0, 1, -20); scene.add(wallN);
            const wallS = new THREE.Mesh(wallGeoH, wallMat); wallS.position.set(0, 1, 20); scene.add(wallS);
            const wallW = new THREE.Mesh(wallGeoV, wallMat); wallW.position.set(-20, 1, 0); scene.add(wallW);
            const wallE = new THREE.Mesh(wallGeoV, wallMat); wallE.position.set(20, 1, 0); scene.add(wallE);

            // 장애물 (상자 모델링 배치)
            const boxGeo = new THREE.BoxGeometry(2, 2, 2);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            
            const positions = [
                {x: -5, z: -5}, {x: 5, z: -5}, {x: -5, z: 5}, {x: 5, z: 5},
                {x: -10, z: 0}, {x: 10, z: 0}, {x: 0, z: -10}, {x: 0, z: 10}
            ];

            positions.forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(pos.x, 1, pos.z);
                scene.add(box);
                obstacles.push(box);
            });
        }

        // --- 4. 매치 메이킹 및 게임 루프 제어 ---
        function startMatch() {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            
            if (!scene) initScene();
            resetGame();
            isGameRunning = true;
            animate();
        }

        function resetGame() {
            // 기존 객체 청소
            enemies.forEach(e => scene.remove(e.mesh));
            bullets.forEach(b => scene.remove(b.mesh));
            enemies.length = 0;
            bullets.length = 0;

            if (player) scene.remove(player);

            // 플레이어 생성 (파란색 브롤러)
            player = createBrawlerModel(0x0088ff);
            player.position.set(0, 0, 12);
            scene.add(player);

            // 적 AI 브롤러 생성 (빨간색 브롤러 3마리)
            for (let i = 0; i < 3; i++) {
                spawnEnemy();
            }

            // 장애물 구성
            if (obstacles.length === 0) setupMap();

            // 스탯 초기화
            playerHp = maxHp;
            score = 0;
            updateHud();
        }

        function spawnEnemy() {
            const enemyMesh = createBrawlerModel(0xff3333);
            const x = (Math.random() - 0.5) * 30;
            const z = (Math.random() - 0.5) * 20 - 5;
            enemyMesh.position.set(x, 0, z);
            scene.add(enemyMesh);

            enemies.push({
                mesh: enemyMesh,
                hp: 300,
                lastShoot: 0
            });
        }

        function updateHud() {
            document.getElementById('hp-display').innerText = Math.max(0, playerHp);
            document.getElementById('score-display').innerText = score;
        }

        // --- 5. 모바일 터치 조이스틱 시스템 ---
        function setupJoystick(zoneId, handleId, inputObj, onReleaseCallback) {
            const zone = document.getElementById(zoneId);
            const handle = document.getElementById(handleId);
            let touchId = null;
            let center = { x: 0, y: 0 };
            const maxRadius = 45;

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (touchId !== null) return;
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                const rect = zone.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                updateJoystick(touch);
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        updateJoystick(e.changedTouches[i]);
                        break;
                    }
                }
            }, { passive: false });

            const endHandler = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        handle.style.transform = `translate(0px, 0px)`;
                        inputObj.x = 0;
                        inputObj.y = 0;
                        inputObj.active = false;
                        if (onReleaseCallback) onReleaseCallback();
                        break;
                    }
                }
            };

            zone.addEventListener('touchend', endHandler);
            zone.addEventListener('touchcancel', endHandler);

            function updateJoystick(touch) {
                let dx = touch.clientX - center.x;
                let dy = touch.clientY - center.y;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                handle.style.transform = `translate(${dx}px, ${dy}px)`;
                inputObj.x = dx / maxRadius;
                inputObj.y = dy / maxRadius;
                inputObj.active = true;
            }
        }

        // 조이스틱 바인딩
        setupJoystick('move-joystick-zone', 'move-handle', moveInput);
        setupJoystick('attack-joystick-zone', 'attack-handle', attackInput, () => {
            // 조이스틱에서 손을 뗐을 때 해당 방향으로 발사
            shootBullet(player.position, attackInputLastDir, true);
        });

        let attackInputLastDir = { x: 0, z: -1 };

        // --- 6. 슈팅 및 전투 시스템 ---
        function shootBullet(fromPos, direction, isPlayer) {
            const bulletGeo = new THREE.SphereGeometry(0.25, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff0000 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.set(fromPos.x, 0.8, fromPos.z);
            scene.add(bullet);

            const speed = 0.6;
            bullets.push({
                mesh: bullet,
                dir: { x: direction.x * speed, z: direction.z * speed },
                isPlayer: isPlayer,
                life: 40 // 수명
            });
        }

        // --- 7. 메인 게임 프레임 업데이트 (Animate) ---
        function animate() {
            if (!isGameRunning) return;
            requestAnimationFrame(animate);

            // 1) 플레이어 이동 처리
            if (moveInput.active) {
                const moveSpeed = 0.15;
                const nextX = player.position.x + moveInput.x * moveSpeed;
                const nextZ = player.position.z + moveInput.y * moveSpeed;

                // 맵 범위 제한
                if (Math.abs(nextX) < 18.5) player.position.x = nextX;
                if (Math.abs(nextZ) < 18.5) player.position.z = nextZ;

                // 조준하지 않을 때는 이동 방향을 바라봄
                if (!attackInput.active) {
                    player.rotation.y = Math.atan2(moveInput.x, moveInput.y);
                }
            }

            // 2) 플레이어 조준 방향 업데이트
            if (attackInput.active) {
                const angle = Math.atan2(attackInput.x, attackInput.y);
                player.rotation.y = angle;
                
                // 조준 방향 기록 (손 뗄 때 발사용)
                const len = Math.hypot(attackInput.x, attackInput.y);
                if (len > 0.2) {
                    attackInputLastDir = { x: attackInput.x / len, z: attackInput.y / len };
                }
            }

            // 카메라가 플레이어를 부드럽게 추적
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 15;

            // 3) 총알 이동 및 충돌
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.x += b.dir.x;
                b.mesh.position.z += b.dir.z;
                b.life--;

                // 적 충돌 확인 (플레이어 총알)
                if (b.isPlayer) {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        if (b.mesh.position.distanceTo(enemy.mesh.position) < 0.8) {
                            enemy.hp -= 100;
                            scene.remove(b.mesh);
                            bullets.splice(i, 1);

                            if (enemy.hp <= 0) {
                                scene.remove(enemy.mesh);
                                enemies.splice(j, 1);
                                score += 100;
                                updateHud();
                                setTimeout(spawnEnemy, 2000); // 2초 후 재소환
                            }
                            break;
                        }
                    }
                } else { // 플레이어 충돌 확인 (적 총알)
                    if (b.mesh.position.distanceTo(player.position) < 0.8) {
                        playerHp -= 50;
                        updateHud();
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);

                        if (playerHp <= 0) {
                            gameOver(false);
                        }
                        continue;
                    }
                }

                // 총알 수명 종료시 제거
                if (b && b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // 4) 적 AI 로직 (간단한 추적 및 사격)
            const now = Date.now();
            enemies.forEach(enemy => {
                const distToPlayer = enemy.mesh.position.distanceTo(player.position);
                
                // 적 플레이어 추적
                if (distToPlayer > 4 && distToPlayer < 15) {
                    const dirX = (player.position.x - enemy.mesh.position.x) / distToPlayer;
                    const dirZ = (player.position.z - enemy.mesh.position.z) / distToPlayer;
                    enemy.mesh.position.x += dirX * 0.05;
                    enemy.mesh.position.z += dirZ * 0.05;
                    enemy.mesh.rotation.y = Math.atan2(dirX, dirZ);
                }

                // 사거리 안으로 들어오면 공격
                if (distToPlayer <= 10 && now - enemy.lastShoot > 1500) {
                    const dirX = (player.position.x - enemy.mesh.position.x) / distToPlayer;
                    const dirZ = (player.position.z - enemy.mesh.position.z) / distToPlayer;
                    shootBullet(enemy.mesh.position, { x: dirX, z: dirZ }, false);
                    enemy.lastShoot = now;
                }
            });

            // 승리 조건 검사
            if (score >= 500) {
                gameOver(true);
            }

            renderer.render(scene, camera);
        }

        // --- 8. 게임 종료 및 리셋 ---
        function gameOver(isWin) {
            isGameRunning = false;
            const overScreen = document.getElementById('game-over-screen');
            const title = document.getElementById('game-over-title');
            
            title.innerText = isWin ? "VICTORY!" : "DEFEAT";
            title.style.color = isWin ? "#FFD700" : "#FF3333";
            overScreen.style.display = 'flex';
        }

        function returnToHome() {
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
