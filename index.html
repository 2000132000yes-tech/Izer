<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
        }
        canvas {
            background-color: #000000;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 모바일 전용 정사각형 화면 설정
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        canvas.width = size;
        canvas.height = size;

        // 작은 픽셀 격자 설정
        const gridCount = 50; 
        const pixelSize = size / gridCount;

        const pixels = [];

        // 가운데 3x3 영역 범위 계산
        const centerStart = Math.floor(gridCount / 2) - 1;
        const centerEnd = centerStart + 2;

        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                // 가운데 3x3 영역은 제외
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                pixels.push({
                    x: c * pixelSize,
                    y: r * pixelSize
                });
            }
        }

        // 가운데 3x3 공백 영역 안에서 무작위 위치 계산
        const randomCol = centerStart + Math.floor(Math.random() * 3);
        const randomRow = centerStart + Math.floor(Math.random() * 3);

        // 무작위 생성될 객체 (주황색 공)
        const ball = {
            x: (randomCol + 0.5) * pixelSize,
            y: (randomRow + 0.5) * pixelSize,
            radius: pixelSize * 0.35,
            color: 'orange'
        };

        function draw() {
            // 검은색 배경[span_0](start_span)[span_0](end_span)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 회색 블록[span_1](start_span)[span_1](end_span)
            ctx.fillStyle = '#888888';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 가운데 공백 안 무작위 위치에 주황색 공 그리기
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        draw();
    </script>
</body>
</html>
