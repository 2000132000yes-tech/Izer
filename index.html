<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 카드 FPS 슈팅 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 600px;
            background-color: #c2a178;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        canvas {
            display: block;
        }
        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* 스테이지 표시 */
        .stage-diamond {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 36px;
            height: 36px;
            background: #fff;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .stage-number {
            transform: rotate(-45deg);
            font-size: 16px;
            font-weight: bold;
            color: #222;
        }
        /* 시작 버튼 */
        #start-btn {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 22px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: #27ae60;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #start-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
        }
        /* 카드 덱 영역 */
        #deck-area {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 72px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 13px;
            color: #333;
        }
        #deck-area.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 카드 뽑기 팝업 영역 (위치 조정) */
        #card-container {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }
        .card {
            width: 95px;
            height: 135px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            animation: drawCard 0.25s ease-out forwards;
        }
        .card-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #222;
        }
        .card-value {
            font-size: 15px;
            font-weight: bold;
            color: #e67e22;
        }
        @keyframes drawCard {
            0% { opacity: 0; transform: translateY(40px) scale(0.6); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* 데미지 텍스트 */
        .damage-text {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        .damage-text.normal { color: #ffffff; text-shadow: 0 0 3px #000; }
        .damage-text.headshot { color: #ff2a2a; font-size: 18px; text-shadow: 0 0 5px #000; }
        .damage-text.heal { color: #2ecc71; font-size: 13px; text-shadow: 0 0 3px #000; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -30px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="stage-diamond">
            <div class="stage-number" id="stage-num">1</div>
        </div>
        <button id="start-btn" disabled>시작</button>
        <div id="deck-area"><span>DECK</span></div>
        <div id="card-container"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 사운드 합성 오디오
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playGunSound(gunType) {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (gunType === 'SHERIFF') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    } else if (gunType === 'GHOST') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    }

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
}

// 게임 제어 변수
let stage = 1;
let gameState = 'PREPARE';
let cardDrawn = false;
let myHeadshotProb = 0.10;
let enemyHeadshotProb = 0.10;
let shakeTime = 0;

// 총기 설정
const GUNS = {
    CLASSIC: { name: '클래식', bodyDmg: 20, headDmg: 60, speed: 12, cooldown: 42, type: 'CLASSIC' },
    GHOST: { name: '고스트', bodyDmg: 50, headDmg: 100, speed: 15, cooldown: 32, type: 'GHOST' },
    SHERIFF: { name: '셰리프', bodyDmg: 60, headDmg: 140, speed: 17, cooldown: 55, type: 'SHERIFF' }
};

// 요소 리스트
let obstacles = [];
let grassDetails = [];
let rockDetails = [];
let allies = [];
let enemies = [];
let bullets = [];
let particles = [];

// AI 맵 기억 전역 격자
const MEMORY_GRID_SIZE = 40;
let mapCols = Math.ceil(360 / MEMORY_GRID_SIZE);
let mapRows = Math.ceil(600 / MEMORY_GRID_SIZE);

// UI
const stageNumEl = document.getElementById('stage-num');
const startBtn = document.getElementById('start-btn');
const deckArea = document.getElementById('deck-area');
const cardContainer = document.getElementById('card-container');

// --- Entity 클래스 ---

class Entity {
    constructor(x, y, isEnemy, gun) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.isEnemy = isEnemy;
        this.maxHp = isEnemy ? 150 + (stage - 1) * 30 : 150;
        this.hp = this.maxHp;
        this.gun = gun;
        this.angle = 0;
        this.shootCooldown = 0;
        this.speed = 1.3;

        // AI 행동 상태: 'EXPLORE', 'ENGAGE', 'COVER', 'CHASE'
        this.aiState = 'EXPLORE';
        this.target = null;
        this.lastTargetPos = null; // 추격용 기억 좌표
        this.sightRange = 210;

        // 지능형 탐색 기억 맵
        this.visitedMap = Array.from({ length: mapRows }, () => Array(mapCols).fill(0));
        this.exploreAngle = Math.random() * Math.PI * 2;
        this.exploreTimer = 0;

        // 엄폐 및 회복 시스템
        this.coverTarget = null;
        this.healTimer = 0;
    }

    update() {
        if (this.hp <= 0) return;
        if (this.shootCooldown > 0) this.shootCooldown--;

        // 현재 서있는 지도 셀 기억
        let gx = Math.floor(this.x / MEMORY_GRID_SIZE);
        let gy = Math.floor(this.y / MEMORY_GRID_SIZE);
        if (gx >= 0 && gx < mapCols && gy >= 0 && gy < mapRows) {
            this.visitedMap[gy][gx] += 1;
        }

        const targets = this.isEnemy ? allies : enemies;
        const aliveTargets = targets.filter(t => t.hp > 0);

        // 시야 내 적 감지
        let visibleTarget = null;
        let minDist = Infinity;

        for (let t of aliveTargets) {
            let d = Math.hypot(t.x - this.x, t.y - this.y);
            if (d < this.sightRange && d < minDist) {
                if (hasLineOfSight(this.x, this.y, t.x, t.y)) {
                    minDist = d;
                    visibleTarget = t;
                }
            }
        }

        // 상태 전환 알고리즘
        if (this.hp < this.maxHp * 0.45) {
            // 체력이 45% 이하로 떨어지면 엄폐 모드 진입
            this.aiState = 'COVER';
        } else if (visibleTarget) {
            this.aiState = 'ENGAGE';
            this.target = visibleTarget;
            this.lastTargetPos = { x: visibleTarget.x, y: visibleTarget.y };

            // 주변 아군에게 지원 신호(핑) 공유
            const myAllies = this.isEnemy ? enemies : allies;
            myAllies.forEach(ally => {
                if (ally !== this && ally.aiState === 'EXPLORE') {
                    ally.aiState = 'CHASE';
                    ally.lastTargetPos = { x: visibleTarget.x, y: visibleTarget.y };
                }
            });
        } else if (this.lastTargetPos) {
            this.aiState = 'CHASE';
        } else {
            this.aiState = 'EXPLORE';
        }

        // AI 행동 실행
        if (this.aiState === 'COVER') {
            this.executeCover();
        } else if (this.aiState === 'ENGAGE' && this.target) {
            this.angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            
            if (minDist > 110) {
                this.moveInDirection(this.angle);
            } else {
                // 엄폐 가능한 공격 위치 잡기
                let strafe = this.angle + (Math.sin(Date.now() / 250) > 0 ? 1 : -1) * 1.2;
                this.moveInDirection(strafe);

                if (this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = this.gun.cooldown;
                }
            }
        } else if (this.aiState === 'CHASE' && this.lastTargetPos) {
            // 적의 마지막 목격 위치로 추격
            let chaseAngle = Math.atan2(this.lastTargetPos.y - this.y, this.lastTargetPos.x - this.x);
            this.angle = chaseAngle;
            this.moveInDirection(chaseAngle);

            if (Math.hypot(this.lastTargetPos.x - this.x, this.lastTargetPos.y - this.y) < 20) {
                this.lastTargetPos = null; // 해당 위치 수색 완료
            }
        } else {
            // 맵을 기억하며 정밀 탐색 (EXPLORE)
            this.executeSmartExplore();
        }

        this.resolveCollisions();
    }

    executeSmartExplore() {
        this.exploreTimer--;
        if (this.exploreTimer <= 0) {
            // 벽 및 안 가본 곳(방문 횟수가 적은 구역) 방향 탐색
            let bestAngle = this.exploreAngle;
            let minVisit = Infinity;

            for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                let testX = this.x + Math.cos(a) * 50;
                let testY = this.y + Math.sin(a) * 50;
                
                if (!checkObstacleCollision(testX, testY, this.radius)) {
                    let tgx = Math.floor(testX / MEMORY_GRID_SIZE);
                    let tgy = Math.floor(testY / MEMORY_GRID_SIZE);
                    let visits = (tgx >= 0 && tgx < mapCols && tgy >= 0 && tgy < mapRows) ? this.visitedMap[tgy][tgx] : 99;
                    
                    if (visits < minVisit) {
                        minVisit = visits;
                        bestAngle = a;
                    }
                }
            }
            this.exploreAngle = bestAngle;
            this.exploreTimer = 35 + Math.floor(Math.random() * 25);
        }

        this.angle = this.exploreAngle;
        this.moveInDirection(this.exploreAngle);
    }

    executeCover() {
        // 장애물 뒤로 숨기
        if (!this.coverTarget) {
            let bestObs = null;
            let maxDist = 0;
            for (let obs of obstacles) {
                let d = Math.hypot((obs.x + obs.w / 2) - this.x, (obs.y + obs.h / 2) - this.y);
                if (d > maxDist) {
                    maxDist = d;
                    bestObs = obs;
                }
            }
            this.coverTarget = bestObs;
        }

        if (this.coverTarget) {
            let coverX = this.coverTarget.x + this.coverTarget.w / 2;
            let coverY = this.coverTarget.y + this.coverTarget.h / 2;
            let coverAngle = Math.atan2(coverY - this.y, coverX - this.x);
            
            this.angle = coverAngle;
            this.moveInDirection(coverAngle);

            // 엄폐 중 체력 회복
            this.healTimer++;
            if (this.healTimer % 40 === 0 && this.hp < this.maxHp) {
                this.hp = Math.min(this.maxHp, this.hp + 12);
                showDamageText(this.x, this.y - 12, 12, false, true);
                if (this.hp >= this.maxHp * 0.9) {
                    this.aiState = 'EXPLORE';
                    this.coverTarget = null;
                }
            }
        }
    }

    moveInDirection(ang) {
        let vx = Math.cos(ang) * this.speed;
        let vy = Math.sin(ang) * this.speed;

        // 전방 벽 감지 우회
        if (checkObstacleCollision(this.x + vx * 12, this.y + vy * 12, this.radius)) {
            // 벽 인식 후 좌/우 우회 선택
            if (!checkObstacleCollision(this.x + Math.cos(ang + Math.PI/2)*15, this.y + Math.sin(ang + Math.PI/2)*15, this.radius)) {
                ang += Math.PI / 2;
            } else {
                ang -= Math.PI / 2;
            }
            vx = Math.cos(ang) * this.speed;
            vy = Math.sin(ang) * this.speed;
            this.exploreAngle = ang;
        }

        if (!checkObstacleCollision(this.x + vx, this.y, this.radius)) this.x += vx;
        if (!checkObstacleCollision(this.x, this.y + vy, this.radius)) this.y += vy;

        // 맵 탈출 완벽 방지 (Strict Bound Clamp)
        this.x = Math.max(this.radius + 2, Math.min(canvas.width - this.radius - 2, this.x));
        this.y = Math.max(this.radius + 2, Math.min(canvas.height - this.radius - 2, this.y));
    }

    resolveCollisions() {
        const allEntities = [...allies, ...enemies].filter(e => e !== this && e.hp > 0);
        for (let other of allEntities) {
            let dx = this.x - other.x;
            let dy = this.y - other.y;
            let dist = Math.hypot(dx, dy);
            let minDist = this.radius + other.radius + 2;

            if (dist < minDist && dist > 0) {
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;
                this.x += nx * overlap * 0.5;
                this.y += ny * overlap * 0.5;
            }
        }
    }

    shoot() {
        let handX = this.x + Math.cos(this.angle + 0.5) * 12;
        let handY = this.y + Math.sin(this.angle + 0.5) * 12;

        bullets.push(new Bullet(handX, handY, this.angle, this.gun, this.isEnemy));
        shakeTime = 3;
        playGunSound(this.gun.type);
    }

    draw() {
        if (this.hp <= 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.isEnemy) {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#922b21';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // 아군: 발로란트 제트 모델링 강화
            ctx.fillStyle = '#2980b9';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1b4f72';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 커진 제트의 백발 머리카락
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-1, 0, this.radius * 0.8, 0, Math.PI * 2);
            ctx.fill();

            // 민트 꽁지머리 연출
            ctx.fillStyle = '#a3e4d7';
            ctx.beginPath();
            ctx.moveTo(-this.radius * 0.9, -4);
            ctx.lineTo(-this.radius * 1.7, 0);
            ctx.lineTo(-this.radius * 0.9, 4);
            ctx.closePath();
            ctx.fill();
        }

        // 총기 착용 위치 (우측 손)
        ctx.save();
        ctx.translate(6, 6);
        ctx.fillStyle = '#2c3e50';
        if (this.gun === GUNS.CLASSIC) {
            ctx.fillRect(0, -2, 9, 4);
        } else if (this.gun === GUNS.GHOST) {
            ctx.fillRect(0, -2, 8, 4);
            ctx.fillStyle = '#111';
            ctx.fillRect(8, -2, 10, 4);
        } else if (this.gun === GUNS.SHERIFF) {
            ctx.fillRect(0, -2, 6, 4);
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(2, -3, 5, 6);
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(7, -2, 9, 4);
        }
        ctx.restore();

        ctx.restore();

        this.drawUI();
    }

    drawUI() {
        const barW = 30;
        const barH = 4;
        const barX = this.x - barW / 2;
        const barY = this.y - this.radius - 12;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX, barY, barW, barH);

        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = this.isEnemy ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(barX, barY, barW * hpPercent, barH);

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        ctx.fillStyle = '#111';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.gun.name, this.x, barY - 2);
    }
}

class Bullet {
    constructor(x, y, angle, gun, isEnemy) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.gun = gun;
        this.isEnemy = isEnemy;
        this.speed = gun.speed;
        this.active = true;
    }

    update() {
        if (!this.active) return;

        let nextX = this.x + Math.cos(this.angle) * this.speed;
        let nextY = this.y + Math.sin(this.angle) * this.speed;

        if (checkObstacleCollision(nextX, nextY, 2)) {
            this.active = false;
            return;
        }

        this.x = nextX;
        this.y = nextY;

        const targets = this.isEnemy ? allies : enemies;
        for (let target of targets) {
            if (target.hp > 0 && Math.hypot(target.x - this.x, target.y - this.y) < target.radius) {
                this.hit(target);
                this.active = false;
                break;
            }
        }

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.active = false;
        }
    }

    hit(target) {
        let prob = this.isEnemy ? enemyHeadshotProb : myHeadshotProb;
        let isHead = Math.random() < prob;
        let damage = isHead ? this.gun.headDmg : this.gun.bodyDmg;

        target.hp -= damage;
        showDamageText(target.x, target.y - 12, damage, isHead);

        if (target.hp <= 0) {
            explode(target.x, target.y, target.isEnemy);
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - Math.cos(this.angle) * 7, this.y - Math.sin(this.angle) * 7);
        ctx.stroke();
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.life = 20;
        this.maxLife = 20;
        this.size = Math.random() * 3 + 1.5;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- 보조 함수 ---

function checkObstacleCollision(x, y, r) {
    for (let obs of obstacles) {
        if (x + r > obs.x && x - r < obs.x + obs.w &&
            y + r > obs.y && y - r < obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

function hasLineOfSight(x1, y1, x2, y2) {
    let steps = 12;
    for (let i = 0; i <= steps; i++) {
        let px = x1 + (x2 - x1) * (i / steps);
        let py = y1 + (y2 - y1) * (i / steps);
        if (checkObstacleCollision(px, py, 2)) return false;
    }
    return true;
}

function initMap() {
    obstacles = [];
    const count = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < count; i++) {
        let w = 35 + Math.random() * 35;
        let h = 35 + Math.random() * 35;
        let x = 25 + Math.random() * (canvas.width - w - 50);
        let y = 100 + Math.random() * (canvas.height - h - 200);
        obstacles.push({ x, y, w, h });
    }

    grassDetails = [];
    for (let i = 0; i < 25; i++) {
        grassDetails.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
    }

    rockDetails = [];
    for (let i = 0; i < 15; i++) {
        rockDetails.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 2 + Math.random() * 2 });
    }
}

function drawEnvironment() {
    ctx.strokeStyle = '#8daa73';
    ctx.lineWidth = 1;
    for (let g of grassDetails) {
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x - 2, g.y - 4);
        ctx.stroke();
    }

    ctx.fillStyle = '#a1887f';
    for (let r of rockDetails) {
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let obs of obstacles) {
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }
}

function initRound() {
    stageNumEl.innerText = stage;
    bullets = [];
    particles = [];
    cardDrawn = false;
    deckArea.classList.remove('disabled');
    startBtn.disabled = true;
    cardContainer.innerHTML = '';
    gameState = 'PREPARE';

    initMap();
    enemyHeadshotProb = 0.10 + (stage - 1) * 0.03;

    if (allies.length === 0) {
        allies = [
            new Entity(100, 520, false, GUNS.CLASSIC),
            new Entity(260, 520, false, GUNS.CLASSIC)
        ];
    } else {
        let spacing = canvas.width / (allies.length + 1);
        allies.forEach((a, idx) => {
            a.hp = a.maxHp;
            a.x = spacing * (idx + 1);
            a.y = 520;
        });
    }

    enemies = [];
    const gunKeys = Object.keys(GUNS);
    let enemyCount = stage;
    let spacing = canvas.width / (enemyCount + 1);

    for (let i = 0; i < enemyCount; i++) {
        let randomGun = GUNS[gunKeys[Math.floor(Math.random() * gunKeys.length)]];
        enemies.push(new Entity(spacing * (i + 1), 60, true, randomGun));
    }
}

function showDamageText(x, y, damage, isHead, isHeal = false) {
    const el = document.createElement('div');
    el.className = `damage-text ${isHeal ? 'heal' : (isHead ? 'headshot' : 'normal')}`;
    el.innerText = isHeal ? `+${damage}` : (isHead ? `HEAD! -${damage}` : `-${damage}`);
    
    const rect = canvas.getBoundingClientRect();
    el.style.left = `${rect.left + x}px`;
    el.style.top = `${rect.top + y}px`;

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function explode(x, y, isEnemy) {
    const color = isEnemy ? '#e74c3c' : '#00e5ff';
    for (let i = 0; i < 20; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function drawCards() {
    if (cardDrawn || gameState !== 'PREPARE') return;
    cardDrawn = true;
    deckArea.classList.add('disabled');

    cardContainer.innerHTML = '';

    for (let i = 0; i < 3; i++) {
        let isSummonCard = Math.random() < 0.25;

        const card = document.createElement('div');
        card.className = 'card';

        if (isSummonCard) {
            card.innerHTML = `
                <div class="card-title">지원 요청</div>
                <div class="card-value" style="color: #2980b9;">+아군 1명</div>
            `;
            card.onclick = () => {
                let spawnX = 60 + Math.random() * 240;
                allies.push(new Entity(spawnX, 520, false, GUNS.CLASSIC));
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        } else {
            let boost = Math.floor(Math.random() * 10) + 1;
            card.innerHTML = `
                <div class="card-title">헤드샷 확률</div>
                <div class="card-value">+${boost}%</div>
            `;
            card.onclick = () => {
                myHeadshotProb += boost / 100;
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        }

        cardContainer.appendChild(card);
    }
}

// --- 이벤트 ---

deckArea.addEventListener('click', drawCards);

startBtn.addEventListener('click', () => {
    if (gameState === 'PREPARE' && cardDrawn) {
        gameState = 'BATTLE';
        startBtn.disabled = true;
    }
});

// --- 루프 ---

function gameLoop() {
    ctx.save();

    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * 4;
        let dy = (Math.random() - 0.5) * 4;
        ctx.translate(dx, dy);
        shakeTime--;
    }

    ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);

    drawEnvironment();

    if (gameState === 'BATTLE') {
        allies.forEach(a => a.update());
        enemies.forEach(e => e.update());
        bullets.forEach(b => b.update());
    }

    particles.forEach(p => p.update());

    bullets = bullets.filter(b => b.active);
    particles = particles.filter(p => p.life > 0);

    allies.forEach(a => a.draw());
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());

    ctx.restore();

    if (gameState === 'BATTLE') {
        const aliveAllies = allies.filter(a => a.hp > 0);
        const aliveEnemies = enemies.filter(e => e.hp > 0);

        if (aliveEnemies.length === 0) {
            stage++;
            setTimeout(() => {
                initRound();
            }, 1000);
            gameState = 'WAIT';
        } else if (aliveAllies.length === 0) {
            gameState = 'GAMEOVER';
            setTimeout(() => {
                alert('모든 아군이 전멸했습니다!');
                stage = 1;
                myHeadshotProb = 0.10;
                allies = [];
                initRound();
            }, 500);
        }
    }

    requestAnimationFrame(gameLoop);
}

// 구동
initRound();
gameLoop();
</script>
