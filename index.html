<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 화면 터치 및 스크롤 방지 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Web RPG</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #222;
    }
    /* 터치 UI 레이어 */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* 가상 조이스틱 */
    #joystick-zone {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: auto;
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }
    /* 공격 버튼 */
    #attack-btn {
      position: absolute;
      bottom: 50px;
      right: 40px;
      width: 80px;
      height: 80px;
      background: rgba(230, 60, 60, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }
    #attack-btn:active {
      background: rgba(255, 60, 60, 0.9);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <div id="joystick-zone">
      <div id="joystick-knob"></div>
    </div>
    <div id="attack-btn">공격</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 플레이어 객체
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 20,
      color: '#4CAF50',
      speed: 4,
      vx: 0,
      vy: 0,
      isAttacking: false,
      attackTimer: 0
    };

    // 조이스틱 조작 로직
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickActive = false;
    let joystickTouchId = null;
    const maxRadius = 35;

    joystickZone.addEventListener('touchstart', (e) => {
      const touch = e.changedTouches[0];
      joystickActive = true;
      joystickTouchId = touch.identifier;
      updateJoystick(touch);
    });

    window.addEventListener('touchmove', (e) => {
      if (!joystickActive) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) {
          updateJoystick(touch);
        }
      }
    });

    function endJoystick(e) {
      if (!joystickActive) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) {
          joystickActive = false;
          joystickTouchId = null;
          joystickKnob.style.transform = `translate(0px, 0px)`;
          player.vx = 0;
          player.vy = 0;
        }
      }
    }

    window.addEventListener('touchend', endJoystick);
    window.addEventListener('touchcancel', endJoystick);

    function updateJoystick(touch) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      let dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
        dist = maxRadius;
      }

      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

      if (dist > 0) {
        player.vx = (dx / maxRadius) * player.speed;
        player.vy = (dy / maxRadius) * player.speed;
      } else {
        player.vx = 0;
        player.vy = 0;
      }
    }

    // 공격 버튼 로직
    const attackBtn = document.getElementById('attack-btn');
    attackBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!player.isAttacking) {
        player.isAttacking = true;
        player.attackTimer = 10; // 공격 연출 프레임 수
      }
    });

    // 게임 루프
    function update() {
      // 이동 적용
      player.x += player.vx;
      player.y += player.vy;

      // 화면 경계 제한
      player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
      player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

      // 공격 타이머 업데이트
      if (player.isAttacking) {
        player.attackTimer--;
        if (player.attackTimer <= 0) {
          player.isAttacking = false;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 격자 배경 그려주기
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      const gridSize = 50;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 공격 상태 연출
      if (player.isAttacking) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.size + 25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 200, 50, 0.4)';
        ctx.fill();
      }

      // 플레이어 그리기
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
