<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            touch-action: none;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .currency-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
        }

        .diamond-icon {
            width: 12px;
            height: 12px;
            background-color: #00e5ff;
            transform: rotate(45deg);
            margin-right: 10px;
            box-shadow: 0 0 8px #00e5ff;
            flex-shrink: 0;
        }

        .plus-btn {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            outline: none;
        }

        .plus-btn:active {
            transform: scale(0.92);
            background: #333333;
        }

        .upgrade-panel {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 75%;
            background: rgba(15, 15, 15, 0.96);
            border-bottom: 2px solid #00e5ff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            transition: top 0.4s ease;
            z-index: 200;
            padding: 16px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .upgrade-panel.active {
            top: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #00e5ff;
        }

        .panel-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .upgrade-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .upgrade-card {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-info {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }

        .orange-ball-icon {
            width: 14px;
            height: 14px;
            background-color: orange;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.9);
        }

        .upgrade-cost-btn {
            background: #00e5ff;
            color: #000000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upgrade-cost-btn:active {
            transform: scale(0.96);
        }

        .toggle-arrow-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #444444;
            color: #aaaaaa;
            width: 100%;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .toggle-arrow-btn:active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .sub-upgrade-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .sub-upgrade-container.open {
            display: flex;
        }

        .section-title {
            font-size: 13px;
            color: #888888;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-layer">
            <div class="currency-box">
                <div class="diamond-icon"></div>
                <span class="gem-count-text">0</span>
            </div>
            <button class="plus-btn" id="openUpgradeBtn">+</button>
        </div>

        <div class="upgrade-panel" id="upgradePanel">
            <div class="panel-header">
                <div class="panel-title">UPGRADES</div>
                <div class="panel-header-right">
                    <div class="currency-box" style="padding: 4px 10px; font-size: 15px;">
                        <div class="diamond-icon" style="width: 10px; height: 10px; margin-right: 6px;"></div>
                        <span class="gem-count-text">0</span>
                    </div>
                    <button class="close-btn" id="closeUpgradeBtn">✕</button>
                </div>
            </div>

            <div class="upgrade-list">
                <div class="upgrade-card">
                    <div class="card-row">
                        <div class="upgrade-info">
                            +1 ball <span class="orange-ball-icon"></span>
                        </div>
                        <button class="upgrade-cost-btn" id="buyBallBtn">
                            <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                            <span id="ballCostText">10</span>
                        </button>
                    </div>
                    <button class="toggle-arrow-btn" id="toggleOrangeBallBtn">
                        <span id="arrowIcon">▼</span> 주황색 공 강화 옵션
                    </button>
                </div>

                <div class="sub-upgrade-container" id="orangeBallSubMenu">
                    <div class="section-title">
                        <span class="orange-ball-icon" style="margin-left:0;"></span> 주황색 공 전용 옵션
                    </div>

                    <div class="upgrade-card">
                        <div class="card-row">
                            <div class="upgrade-info">+1 Speed</div>
                            <button class="upgrade-cost-btn" id="buySpeedBtn">
                                <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                                <span id="speedCostText">20</span>
                            </button>
                        </div>
                    </div>

                    <div class="upgrade-card">
                        <div class="card-row">
                            <div class="upgrade-info">+0.5 size</div>
                            <button class="upgrade-cost-btn" id="buySizeBtn">
                                <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                                <span id="sizeCostText">50</span>
                            </button>
                        </div>
                    </div>

                    <div class="upgrade-card">
                        <div class="card-row">
                            <div class="upgrade-info">+1 Block</div>
                            <button class="upgrade-cost-btn" id="buyBlockBtn">
                                <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                                <span id="blockCostText">500</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountTexts = document.querySelectorAll('.gem-count-text');
        
        const upgradePanel = document.getElementById('upgradePanel');
        const openUpgradeBtn = document.getElementById('openUpgradeBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');
        const toggleOrangeBallBtn = document.getElementById('toggleOrangeBallBtn');
        const orangeBallSubMenu = document.getElementById('orangeBallSubMenu');
        const arrowIcon = document.getElementById('arrowIcon');

        const buyBallBtn = document.getElementById('buyBallBtn');
        const ballCostText = document.getElementById('ballCostText');
        const buySpeedBtn = document.getElementById('buySpeedBtn');
        const speedCostText = document.getElementById('speedCostText');
        const buySizeBtn = document.getElementById('buySizeBtn');
        const sizeCostText = document.getElementById('sizeCostText');
        const buyBlockBtn = document.getElementById('buyBlockBtn');
        const blockCostText = document.getElementById('blockCostText');

        let gems = 0;
        let ballCost = 10;
        let speedCost = 20;
        let sizeCost = 50;
        let blockCost = 500;

        let ballSpeedBonus = 0;
        let ballSizeBonus = 0;
        let gemsPerBlockBonus = 0;

        // 광물 레벨별 체력(hp)과 보상 재화 설정 (회색부터 보라색까지)
        const oreTiers = [
            { color: '#777777', hp: 1,  reward: 5 },   // 1. 회색
            { color: '#ffea00', hp: 2,  reward: 10 },  // 2. 노랑
            { color: '#ff9900', hp: 3,  reward: 15 },  // 3. 주황
            { color: '#ff3333', hp: 4,  reward: 20 },  // 4. 빨강
            { color: '#a6ff00', hp: 5,  reward: 25 },  // 5. 연두
            { color: '#00cc44', hp: 6,  reward: 30 },  // 6. 초록
            { color: '#0066ff', hp: 7,  reward: 35 },  // 7. 파랑
            { color: '#00e5ff', hp: 8,  reward: 40 },  // 8. 하늘
            { color: '#ff66cc', hp: 9,  reward: 45 },  // 9. 핑크
            { color: '#9933ff', hp: 10, reward: 50 }   // 10. 보라색
        ];

        function updateGemUI() {
            gemCountTexts.forEach(el => el.textContent = gems);
        }

        openUpgradeBtn.addEventListener('click', () => upgradePanel.classList.add('active'));
        closeUpgradeBtn.addEventListener('click', () => upgradePanel.classList.remove('active'));

        toggleOrangeBallBtn.addEventListener('click', () => {
            const isOpen = orangeBallSubMenu.classList.toggle('open');
            arrowIcon.textContent = isOpen ? '▲' : '▼';
        });

        const size = Math.min(window.innerWidth, window.innerHeight);
        canvas.width = size;
        canvas.height = size;

        const gridCount = 50;
        const pixelSize = size / gridCount;

        const emptyLights = [];

        const centerStart = Math.floor(gridCount / 2) - 1;
        const centerEnd = centerStart + 2;

        for (let r = centerStart; r <= centerEnd; r++) {
            for (let c = centerStart; c <= centerEnd; c++) {
                emptyLights.push({
                    x: (c + 0.5) * pixelSize,
                    y: (r + 0.5) * pixelSize
                });
            }
        }

        // 맵 및 광원 뭉침(클러스터) 스폰 로직
        let pixels = [];
        const particles = [];
        const balls = [];

        // 2D 그리드 배열 생성
        const gridMap = Array.from({ length: gridCount }, () => Array(gridCount).fill(null));

        // 1. 기반암 (파괴 불가능한 하얀색 블록) 무작위 생성
        const bedrockCount = Math.floor(gridCount * gridCount * 0.03); // 전체의 약 3%
        for (let i = 0; i < bedrockCount; i++) {
            const r = Math.floor(Math.random() * gridCount);
            const c = Math.floor(Math.random() * gridCount);
            if (!(r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd)) {
                gridMap[r][c] = { isBedrock: true };
            }
        }

        // 2. 마인크래프트 스타일 광물 클러스터(군집) 생성
        function generateOreVeins() {
            for (let tier = 1; tier < oreTiers.length; tier++) {
                const veinCount = Math.floor(Math.random() * 4) + 2; // 각 종류별 2~5개 군집
                for (let v = 0; v < veinCount; v++) {
                    let vr = Math.floor(Math.random() * gridCount);
                    let vc = Math.floor(Math.random() * gridCount);

                    const veinSize = Math.floor(Math.random() * 8) + 4; // 군집 크기
                    for (let s = 0; s < veinSize; s++) {
                        const nr = vr + Math.floor(Math.random() * 3) - 1;
                        const nc = vc + Math.floor(Math.random() * 3) - 1;

                        if (nr >= 0 && nr < gridCount && nc >= 0 && nc < gridCount) {
                            if (!(nr >= centerStart && nr <= centerEnd && nc >= centerStart && nc <= centerEnd)) {
                                if (!gridMap[nr][nc]) {
                                    gridMap[nr][nc] = { tier: tier };
                                }
                            }
                        }
                    }
                }
            }
        }

        generateOreVeins();

        // 3. 나머지 빈자리를 기본 회색(0단계) 광물로 채우기
        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                const cell = gridMap[r][c];
                if (cell && cell.isBedrock) {
                    pixels.push({
                        x: c * pixelSize,
                        y: r * pixelSize,
                        isBedrock: true,
                        color: '#ffffff'
                    });
                } else {
                    const tierIndex = cell ? cell.tier : 0;
                    const tierData = oreTiers[tierIndex];
                    pixels.push({
                        x: c * pixelSize,
                        y: r * pixelSize,
                        tier: tierIndex,
                        hp: tierData.hp,
                        maxHp: tierData.hp,
                        isBedrock: false
                    });
                }
            }
        }

        function createBall() {
            const angle = Math.random() * Math.PI * 2;
            const baseSpeed = pixelSize * 0.22 + (ballSpeedBonus * pixelSize * 0.12);
            const currentRadius = pixelSize * 0.35 + (ballSizeBonus * pixelSize * 0.12);

            balls.push({
                x: (centerStart + 1.5) * pixelSize,
                y: (centerStart + 1.5) * pixelSize,
                radius: currentRadius,
                dx: Math.cos(angle) * baseSpeed,
                dy: Math.sin(angle) * baseSpeed,
                color: '#ff9900',
                history: []
            });
        }

        createBall();

        buyBallBtn.addEventListener('click', () => {
            if (gems >= ballCost) {
                gems -= ballCost;
                ballCost += 10;
                ballCostText.textContent = ballCost;
                updateGemUI();
                createBall();
            }
        });

        buySpeedBtn.addEventListener('click', () => {
            if (gems >= speedCost) {
                gems -= speedCost;
                speedCost += 20;
                speedCostText.textContent = speedCost;
                ballSpeedBonus += 1;
                updateGemUI();

                balls.forEach(ball => {
                    const currentAngle = Math.atan2(ball.dy, ball.dx);
                    const newSpeed = pixelSize * 0.22 + (ballSpeedBonus * pixelSize * 0.12);
                    ball.dx = Math.cos(currentAngle) * newSpeed;
                    ball.dy = Math.sin(currentAngle) * newSpeed;
                });
            }
        });

        buySizeBtn.addEventListener('click', () => {
            if (gems >= sizeCost) {
                gems -= sizeCost;
                sizeCost += 50;
                sizeCostText.textContent = sizeCost;
                ballSizeBonus += 0.5;
                updateGemUI();

                balls.forEach(ball => {
                    ball.radius = pixelSize * 0.35 + (ballSizeBonus * pixelSize * 0.12);
                });
            }
        });

        buyBlockBtn.addEventListener('click', () => {
            if (gems >= blockCost) {
                gems -= blockCost;
                blockCost += 500;
                blockCostText.textContent = blockCost;
                gemsPerBlockBonus += 1;
                updateGemUI();
            }
        });

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: pixelSize * 0.3,
                    alpha: 1,
                    life: 0.05,
                    color: color
                });
            }
        }

        function update() {
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > 6) {
                    ball.history.shift();
                }

                let nextX = ball.x + ball.dx;
                let nextY = ball.y + ball.dy;

                if (nextX - ball.radius < 0 || nextX + ball.radius > canvas.width) {
                    ball.dx = -ball.dx;
                    nextX = ball.x + ball.dx;
                }
                if (nextY - ball.radius < 0 || nextY + ball.radius > canvas.height) {
                    ball.dy = -ball.dy;
                    nextY = ball.y + ball.dy;
                }

                for (let i = pixels.length - 1; i >= 0; i--) {
                    const p = pixels[i];

                    const closestX = Math.max(p.x, Math.min(nextX, p.x + pixelSize));
                    const closestY = Math.max(p.y, Math.min(nextY, p.y + pixelSize));

                    const distX = nextX - closestX;
                    const distY = nextY - closestY;
                    const distance = Math.hypot(distX, distY);

                    if (distance < ball.radius) {
                        const blockCenterX = p.x + pixelSize / 2;
                        const blockCenterY = p.y + pixelSize / 2;

                        if (p.isBedrock) {
                            // 부술 수 없는 흰색 기반암: 타격 시 파티클만 발생시키고 반사
                            createParticles(blockCenterX, blockCenterY, '#ffffff');
                        } else {
                            // 일반 광물 충돌 처리
                            const currentTierData = oreTiers[p.tier];
                            createParticles(blockCenterX, blockCenterY, currentTierData.color);

                            p.hp -= 1; // 체력 감소

                            if (p.hp <= 0) {
                                // 광물 최종 파괴 시 재화 지급 및 광원 생성
                                emptyLights.push({
                                    x: blockCenterX,
                                    y: blockCenterY
                                });

                                gems += currentTierData.reward + gemsPerBlockBonus;
                                updateGemUI();

                                pixels.splice(i, 1);
                            }
                        }

                        if (Math.abs(distX) > Math.abs(distY)) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        break;
                    }
                }

                ball.x += ball.dx;
                ball.y += ball.dy;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // 검은색 배경
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 광물 및 기반암 블록 렌더링
            for (let i = 0; i < pixels.length; i++) {
                const p = pixels[i];
                if (p.isBedrock) {
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = oreTiers[p.tier].color;
                }
                ctx.fillRect(p.x, p.y, pixelSize - 0.5, pixelSize - 0.5);

                // 체력이 남은 광물의 경우 내구도 표시 (어둡게 마스킹)
                if (!p.isBedrock && p.hp < p.maxHp) {
                    const damageRatio = 1 - (p.hp / p.maxHp);
                    ctx.fillStyle = `rgba(0, 0, 0, ${damageRatio * 0.5})`;
                    ctx.fillRect(p.x, p.y, pixelSize - 0.5, pixelSize - 0.5);
                }
            }

            // 2. 공백 광원 렌더링 (자연스러운 안개 연출, 눈부심 없음)
            ctx.save();
            ctx.globalCompositeOperation = 'source-over'; // 눈부신 가중치 현상 방지

            const lightRadius = pixelSize * 3.5;

            for (let i = 0; i < emptyLights.length; i++) {
                const light = emptyLights[i];
                const grad = ctx.createRadialGradient(
                    light.x, light.y, 0,
                    light.x, light.y, lightRadius
                );
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
                grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.03)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.beginPath();
                ctx.arc(light.x, light.y, lightRadius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.closePath();
            }

            // 3. 파티클 이펙트
            for (let i = 0; i < particles.length; i++) {
                const pt = particles[i];
                ctx.fillStyle = pt.color || `rgba(255, 165, 0, ${pt.alpha})`;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            }
            ctx.restore();

            // 4. 주황색 공 (하얀 테두리 제거 및 또렷한 본체만 렌더링)
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                // 잔상
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius * 0.85, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 153, 0, ${alpha * 0.35})`;
                    ctx.fill();
                    ctx.closePath();
                }

                // 주황색 공 본체 (깔끔하게 구현)
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
