<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }
        canvas {
            border: 1px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 작은 공 (크기 4분의 1: 반지름 2.5)
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 2.5,
            color: 'orange',
            dx: 4,
            dy: -4,
            history: [],
            maxHistory: 10,
            active: true
        };

        // 공보다 조금 큰 픽셀 여러 개 배치 (공 위치 제외, 빈틈 없이)
        const pixelSize = 8;
        const pixels = [];
        const cols = Math.floor(canvas.width / pixelSize);
        const rows = Math.floor(canvas.height / pixelSize);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const px = c * pixelSize;
                const py = r * pixelSize;
                
                // 공이 있는 자리 주변 제외
                const distToBall = Math.hypot((px + pixelSize / 2) - ball.x, (py + pixelSize / 2) - ball.y);
                if (distToBall > 25) {
                    pixels.push({ x: px, y: py });
                }
            }
        }

        // 벽 충돌 파티클 이펙트
        const particles = [];

        function createImpactParticles(x, y) {
            for (let i = 0; i < 25; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 1,
                    alpha: 1,
                    life: 0.04
                });
            }
        }

        function update() {
            if (ball.active) {
                // 잔상 기록
                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > ball.maxHistory) {
                    ball.history.shift();
                }

                ball.x += ball.dx;
                ball.y += ball.dy;

                // 벽 충돌 체크
                if (
                    ball.x - ball.radius <= 0 ||
                    ball.x + ball.radius >= canvas.width ||
                    ball.y - ball.radius <= 0 ||
                    ball.y + ball.radius >= canvas.height
                ) {
                    const impactX = Math.max(0, Math.min(canvas.width, ball.x));
                    const impactY = Math.max(0, Math.min(canvas.height, ball.y));
                    createImpactParticles(impactX, impactY);
                    ball.active = false;
                }
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.life;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // 배경 검은색
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 픽셀 격자 그리기
            ctx.fillStyle = '#222';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 1, pixelSize - 1);
            }

            if (ball.active) {
                // 잔상 그리기
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.
