<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Block Break Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #gameContainer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vmin;
            height: 100vmin;
            max-width: 600px;
            max-height: 600px;
            padding: 10px;
        }
        canvas {
            background-color: #000000;
            border: 2px solid #333333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.15);
            touch-action: none;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Square grid resolution configuration
        const gridCount = 50; 
        let canvasSize = 0;
        let pixelSize = 0;

        // Game Entities
        let blocks = [];
        let particles = [];
        let ball = {};

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const minDim = Math.min(container.clientWidth, container.clientHeight) - 20;
            canvasSize = Math.max(280, minDim);
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            pixelSize = canvasSize / gridCount;

            initGame();
        }

        function initGame() {
            blocks = [];
            particles = [];

            const centerStart = Math.floor(gridCount / 2) - 1; // Center 3x3 index start
            const centerEnd = centerStart + 2;                 // Center 3x3 index end

            // Generate pixel grid excluding center 3x3 empty space
            for (let r = 0; r < gridCount; r++) {
                for (let c = 0; c < gridCount; c++) {
                    if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                        continue; // Empty center space
                    }
                    blocks.push({
                        col: c,
                        row: r,
                        x: c * pixelSize,
                        y: r * pixelSize,
                        active: true
                    });
                }
            }

            // Ball starting at center of empty 3x3 space
            const centerX = (centerStart + 1.5) * pixelSize;
            const centerY = (centerStart + 1.5) * pixelSize;
            
            // Random initial direction angle
            const angle = Math.random() * Math.PI * 2;
            const speed = pixelSize * 0.25;

            ball = {
                x: centerX,
                y: centerY,
                radius: pixelSize * 0.4,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: '#FFA500',
                history: []
            };

            // Avoid perfectly vertical or horizontal directions
            if (Math.abs(ball.vx) < 0.5) ball.vx = speed * 0.7;
            if (Math.abs(ball.vy) < 0.5) ball.vy = speed * 0.7;
        }

        function createExplosion(x, y, color) {
            const particleCount = 18;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (pixelSize * 0.3) + (pixelSize * 0.1);
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * (pixelSize * 0.25) + 1,
                    color: color,
                    alpha: 1.0,
                    life: Math.random() * 0.04 + 0.02
                });
            }
        }

        function update() {
            // Ball position history for trail/afterimage
            ball.history.push({ x: ball.x, y: ball.y });
            if (ball.history.length > 8) {
                ball.history.shift();
            }

            // Next ball position
            let nextX = ball.x + ball.vx;
            let nextY = ball.y + ball.vy;

            // 1. Screen Borders Collision Handling
            if (nextX - ball.radius <= 0) {
                ball.vx = Math.abs(ball.vx);
                nextX = ball.radius;
                createExplosion(0, ball.y, '#FFA500');
            } else if (nextX + ball.radius >= canvas.width) {
                ball.vx = -Math.abs(ball.vx);
                nextX = canvas.width - ball.radius;
                createExplosion(canvas.width, ball.y, '#FFA500');
            }

            if (nextY - ball.radius <= 0) {
                ball.vy = Math.abs(ball.vy);
                nextY = ball.radius;
                createExplosion(ball.x, 0, '#FFA500');
            } else if (nextY + ball.radius >= canvas.height) {
                ball.vy = -Math.abs(ball.vy);
                nextY = canvas.height - ball.radius;
                createExplosion(ball.x, canvas.height, '#FFA500');
            }

            // 2. Block Collisions Handling
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                if (!b.active) continue;

                // Find closest point on block rectangle to ball center
                const closestX = Math.max(b.x, Math.min(nextX, b.x + pixelSize));
                const closestY = Math.max(b.y, Math.min(nextY, b.y + pixelSize));

                const distX = nextX - closestX;
                const distY = nextY - closestY;
                const distance = Math.hypot(distX, distY);

                // Collision detected
                if (distance < ball.radius) {
                    b.active = false; // Destroy block

                    // Collision particle effect
                    createExplosion(b.x + pixelSize / 2, b.y + pixelSize / 2, '#AAAAAA');

                    // Determine bounce direction based on overlap angle
                    const overlapX = (pixelSize / 2 + ball.radius) - Math.abs(nextX - (b.x + pixelSize / 2));
                    const overlapY = (pixelSize / 2 + ball.radius) - Math.abs(nextY - (b.y + pixelSize / 2));

                    if (overlapX < overlapY) {
                        ball.vx = -ball.vx;
                    } else {
                        ball.vy = -ball.vy;
                    }
                    break;
                }
            }

            // Apply ball velocity
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 3. Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.life;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // Black Background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grey Pixel Blocks
            ctx.fillStyle = '#888888';
            for (let i = 0; i < blocks.length; i++) {
                const b = blocks[i];
                if (b.active) {
                    ctx.fillRect(b.x, b.y, pixelSize - 0.5, pixelSize - 0.5);
                }
            }

            // Particles Explosion Render
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Ball Motion Trail
            for (let i = 0; i < ball.history.length; i++) {
                const pos = ball.history[i];
                const alpha = ((i + 1) / ball.history.length) * 0.4;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 165, 0, ${alpha})`;
                ctx.fill();
            }

            // Orange Ball
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            ctx.closePath();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', resizeCanvas);

        window.onload = function() {
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
