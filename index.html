<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 1. 공 설정 (기존 반지름 10의 4분의 1 크기인 2.5)
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 2.5,
            color: 'orange',
            dx: 5,
            dy: -4,
            history: [],
            maxHistory: 12,
            active: true
        };

        // 2. 맵에 공보다 조금 큰 픽셀을 빈틈없이 여러 개 배치 (공 위치 제외)
        const pixelSize = 6;
        const pixels = [];
        const cols = Math.floor(canvas.width / pixelSize);
        const rows = Math.floor(canvas.height / pixelSize);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const px = c * pixelSize;
                const py = r * pixelSize;
                
                // 공이 시작되는 위치에는 픽셀을 비워둠
                const distToBall = Math.hypot((px + pixelSize / 2) - ball.x, (py + pixelSize / 2) - ball.y);
                if (distToBall > 30) {
                    pixels.push({ x: px, y: py });
                }
            }
        }

        // 3. 공이 벽에 닿았을 때 나오는 파티클 이펙트
        const particles = [];

        function createImpactParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 1,
                    color: 'orange',
                    alpha: 1,
                    life: 0.03
                });
            }
        }

        function update() {
            if (ball.active) {
                // 뒤에 잔상이 남도록 현재 위치 기록
                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > ball.maxHistory) {
                    ball.history.shift();
                }

                // 공 이동
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 공이 벽에 닿으면 없어지면서 이펙트 발생
                if (
                    ball.x - ball.radius <= 0 ||
                    ball.x + ball.radius >= canvas.width ||
                    ball.y - ball.radius <= 0 ||
                    ball.y + ball.radius >= canvas.height
                ) {
                    const impactX = Math.max(0, Math.min(canvas.width, ball.x));
                    const impactY = Math.max(0, Math.min(canvas.height, ball.y));
                    createImpactParticles(impactX, impactY);
                    ball.active = false;
                }
            }

            // 이펙트 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.life;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // 배경 검은색
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 빈틈없이 배치된 픽셀 그리기
            ctx.fillStyle = '#222222';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 공 및 잔상 그리기
            if (ball.active) {
                // 잔상
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 165, 0, ${alpha * 0.5})`;
                    ctx.fill();
                    ctx.closePath();
                }

                // 주황색 공
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }

            // 벽 충돌 이펙트 그리기
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 165, 0, ${p.alpha})`;
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
