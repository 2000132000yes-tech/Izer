<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI FPS Match Spectator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      width: 90%;
      max-width: 400px;
    }
    .score-card {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      color: white;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
    }
    .red { background: rgba(220, 53, 69, 0.85); }
    .blue { background: rgba(13, 110, 253, 0.85); }
    .score { font-size: 20px; margin-top: 4px; }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }
    .btn:active { background: rgba(255, 255, 255, 0.5); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <div class="score-card red">
      <div>AI RED</div>
      <div id="hp-red">HP: 100</div>
      <div id="score-red" class="score">0 Kills</div>
    </div>
    <div class="score-card blue">
      <div>AI BLUE</div>
      <div id="hp-blue">HP: 100</div>
      <div id="score-blue" class="score">0 Kills</div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" onclick="setCamView('top')">탑뷰</button>
    <button class="btn" onclick="setCamView('red')">RED 시점</button>
    <button class="btn" onclick="setCamView('blue')">BLUE 시점</button>
  </div>

  <script>
    // 맵 및 게임 서포트 모듈
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);
    scene.fog = new THREE.FogExp2(0x1a1a24, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 조명
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(20, 40, 20);
    light.castShadow = true;
    light.shadow.mapSize.width = 1024;
    light.shadow.mapSize.height = 1024;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x666666));

    // 바닥
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 지형지물 (엄폐물)
    const obstacles = [];
    function createObstacle(x, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.5 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, h/2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      obstacles.push(mesh);
    }

    // 장애물배치
    createObstacle(0, 0, 8, 4, 8);
    createObstacle(-12, -10, 6, 3, 6);
    createObstacle(12, 10, 6, 3, 6);
    createObstacle(-10, 12, 4, 3, 10);
    createObstacle(10, -12, 4, 3, 10);

    // AI 봇 클래스
    class Bot {
      constructor(color, startX, startZ, name) {
        this.name = name;
        this.color = color;
        this.hp = 100;
        this.kills = 0;
        this.speed = 0.12;
        this.lastShot = 0;

        // 메시 생성
        const group = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.8, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        group.add(body);

        // 총기 표시
        const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 0.8);
        const gunMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0.4, 1.1, -0.5);
        group.add(gun);

        this.mesh = group;
        this.mesh.position.set(startX, 0, startZ);
        scene.add(this.mesh);
      }

      reset(x, z) {
        this.hp = 100;
        this.mesh.position.set(x, 0, z);
      }

      update(target) {
        if (this.hp <= 0) return;

        const myPos = this.mesh.position;
        const targetPos = target.mesh.position;

        // 타겟 방향 계산
        const dir = new THREE.Vector3().subVectors(targetPos, myPos);
        const dist = dir.length();
        dir.y = 0;
        dir.normalize();

        // 회전
        const angle = Math.atan2(dir.x, dir.z);
        this.mesh.rotation.y = angle + Math.PI;

        // 레이캐스팅으로 장애물 확인
        const raycaster = new THREE.Raycaster(
          new THREE.Vector3(myPos.x, 1, myPos.z),
          dir, 0, dist
        );
        const hits = raycaster.intersectObjects(obstacles);

        // 이동 및 시야 제어 AI
        if (hits.length === 0) {
          // 시야 확보됨: 거리를 두고 사격
          if (dist > 8) {
            this.mesh.position.addScaledVector(dir, this.speed);
          } else if (dist < 4) {
            this.mesh.position.addScaledVector(dir, -this.speed);
          }
          this.shoot(target);
        } else {
          // 장애물에 가려짐: 시회 이동 (돌아가기)
          const sideDir = new THREE.Vector3(-dir.z, 0, dir.x);
          this.mesh.position.addScaledVector(sideDir, this.speed);
        }

        // 맵 경계 제한
        this.mesh.position.x = Math.max(-28, Math.min(28, this.mesh.position.x));
        this.mesh.position.z = Math.max(-28, Math.min(28, this.mesh.position.z));
      }

      shoot(target) {
        const now = Date.now();
        if (now - this.lastShot < 350) return; // 연사 속도
        this.lastShot = now;

        // 궤적 생성
        const bulletGeo = new THREE.BufferGeometry().setFromPoints([
          this.mesh.position.clone().add(new THREE.Vector3(0, 1.1, 0)),
          target.mesh.position.clone().add(new THREE.Vector3(0, 0.9 + (Math.random()-0.5)*0.5, 0))
        ]);
        const bulletMat = new THREE.LineBasicMaterial({ color: this.color === 0xff3333 ? 0xffaaaa : 0xaaaaff });
        const line = new THREE.Line(bulletGeo, bulletMat);
        scene.add(line);
        setTimeout(() => scene.remove(line), 40);

        // 명중 및 데미지 판정 (거리 및 명중률 계산)
        if (Math.random() < 0.7) {
          target.takeDamage(12, this);
        }
      }

      takeDamage(amount, attacker) {
        this.hp -= amount;
        if (this.hp <= 0) {
          this.hp = 0;
          attacker.kills++;
          setTimeout(() => {
            redBot.reset(-20, -20);
            blueBot.reset(20, 20);
          }, 1000);
        }
      }
    }

    const redBot = new Bot(0xff3333, -20, -20, 'RED');
    const blueBot = new Bot(0x3388ff, 20, 20, 'BLUE');

    // 관전 카메라 상태
    let currentCamMode = 'top';

    window.setCamView = function(mode) {
      currentCamMode = mode;
    };

    function updateCamera() {
      if (currentCamMode === 'top') {
        camera.position.set(0, 45, 0);
        camera.lookAt(0, 0, 0);
      } else if (currentCamMode === 'red') {
        const p = redBot.mesh.position;
        const rot = redBot.mesh.rotation.y;
        camera.position.set(p.x + Math.sin(rot)*2, 2.2, p.z + Math.cos(rot)*2);
        camera.lookAt(p.x - Math.sin(rot)*10, 1.5, p.z - Math.cos(rot)*10);
      } else if (currentCamMode === 'blue') {
        const p = blueBot.mesh.position;
        const rot = blueBot.mesh.rotation.y;
        camera.position.set(p.x + Math.sin(rot)*2, 2.2, p.z + Math.cos(rot)*2);
        camera.lookAt(p.x - Math.sin(rot)*10, 1.5, p.z - Math.cos(rot)*10);
      }
    }

    // UI 업데이트
    function updateUI() {
      document.getElementById('hp-red').innerText = `HP: ${redBot.hp}`;
      document.getElementById('score-red').innerText = `${redBot.kills} Kills`;
      document.getElementById('hp-blue').innerText = `HP: ${blueBot.hp}`;
      document.getElementById('score-blue').innerText = `${blueBot.kills} Kills`;
    }

    // 메인 루프
    function animate() {
      requestAnimationFrame(animate);

      redBot.update(blueBot);
      blueBot.update(redBot);

      updateCamera();
      updateUI();

      renderer.render(scene, camera);
    }

    // 창 리사이즈
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
