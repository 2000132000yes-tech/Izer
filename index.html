<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세로형 카드 FPS 슈팅 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 450px;
            height: 700px;
            background-color: #d2b48c; /* 밝은 흙/모래 색상 */
            border: 4px solid #444;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background-color: #e4c49f;
        }
        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* 스테이지 마름모 표시 */
        .stage-diamond {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 40px;
            height: 40px;
            background: #fff;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .stage-number {
            transform: rotate(-45deg);
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
        /* 시작 버튼 */
        #start-btn {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            background: #27ae60;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        #start-btn:hover {
            background: #219150;
            transform: translateX(-50%) scale(1.05);
        }
        #start-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: translateX(-50%);
        }
        /* 카드 덱 영역 */
        #deck-area {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 80px;
            background: #fff;
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            font-weight: bold;
            color: #333;
        }
        #deck-area:hover {
            transform: translateX(-50%) scale(1.05);
        }
        #deck-area.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 카드 뽑기 팝업 영역 */
        #card-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .card {
            width: 100px;
            height: 145px;
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            animation: drawCard 0.3s ease-out forwards;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-8px);
        }
        .card-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }
        .card-value {
            font-size: 16px;
            font-weight: bold;
            color: #e67e22;
        }
        @keyframes drawCard {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        /* 데미지 텍스트 */
        .damage-text {
            position: absolute;
            font-weight: bold;
            font-size: 15px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        .damage-text.normal {
            color: #ffffff;
            text-shadow: 0 0 3px #000;
        }
        .damage-text.headshot {
            color: #ff2a2a;
            font-size: 20px;
            text-shadow: 0 0 5px #000;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -35px);
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="450" height="700"></canvas>
    
    <div id="ui-layer">
        <!-- 스테이지 표시 -->
        <div class="stage-diamond">
            <div class="stage-number" id="stage-num">1</div>
        </div>

        <!-- 시작 버튼 -->
        <button id="start-btn" disabled>시작</button>

        <!-- 카드 덱 -->
        <div id="deck-area">
            <span>DECK</span>
        </div>

        <!-- 카드가 뽑히는 중앙 영역 -->
        <div id="card-container"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 게임 상태 변수
let stage = 1;
let gameState = 'PREPARE'; // 'PREPARE', 'BATTLE', 'GAMEOVER'
let cardDrawn = false;
let myHeadshotProb = 0.10; // 기본 헤드샷 확률 10%
let enemyHeadshotProb = 0.10;

// 총기 데이터
const GUNS = {
    CLASSIC: { name: '클래식', bodyDmg: 20, headDmg: 60, speed: 12, cooldown: 45, barrelLen: 18 },
    GHOST: { name: '고스트', bodyDmg: 50, headDmg: 100, speed: 15, cooldown: 35, barrelLen: 24 },
    SHERIFF: { name: '셰리프', bodyDmg: 60, headDmg: 140, speed: 18, cooldown: 60, barrelLen: 22 }
};

// 지형 지물 (격자 기반)
const GRID_SIZE = 30;
const COLS = canvas.width / GRID_SIZE; // 15
const ROWS = canvas.height / GRID_SIZE; // 23.33 -> 23
let mapGrid = [];

// 객체 리스트
let allies = [];
let enemies = [];
let bullets = [];
let particles = [];

// UI 엘리먼트
const stageNumEl = document.getElementById('stage-num');
const startBtn = document.getElementById('start-btn');
const deckArea = document.getElementById('deck-area');
const cardContainer = document.getElementById('card-container');

// --- 클래스 정의 ---

class Entity {
    constructor(x, y, isEnemy, gun) {
        this.x = x;
        this.y = y;
        this.radius = 12;
        this.isEnemy = isEnemy;
        this.maxHp = isEnemy ? 150 + (stage - 1) * 30 : 150;
        this.hp = this.maxHp;
        this.gun = gun;
        this.angle = 0;
        this.shootCooldown = 0;
        this.speed = 1.5;
        this.path = [];
        this.pathTimer = 0;
    }

    update() {
        if (this.hp <= 0) return;

        if (this.shootCooldown > 0) this.shootCooldown--;

        const targets = this.isEnemy ? allies : enemies;
        const aliveTargets = targets.filter(t => t.hp > 0);

        if (aliveTargets.length > 0) {
            let nearest = aliveTargets[0];
            let minDist = Math.hypot(nearest.x - this.x, nearest.y - this.y);
            for (let t of aliveTargets) {
                let d = Math.hypot(t.x - this.x, t.y - this.y);
                if (d < minDist) {
                    minDist = d;
                    nearest = t;
                }
            }

            this.angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);

            // 사거리 밖이면 길찾기 이동
            if (minDist > 160) {
                this.pathTimer--;
                if (this.pathTimer <= 0 || this.path.length === 0) {
                    this.path = findPath(this.x, this.y, nearest.x, nearest.y);
                    this.pathTimer = 15;
                }

                if (this.path && this.path.length > 1) {
                    let nextGrid = this.path[1];
                    let targetX = nextGrid.x * GRID_SIZE + GRID_SIZE / 2;
                    let targetY = nextGrid.y * GRID_SIZE + GRID_SIZE / 2;
                    let moveAngle = Math.atan2(targetY - this.y, targetX - this.x);
                    
                    let nextX = this.x + Math.cos(moveAngle) * this.speed;
                    let nextY = this.y + Math.sin(moveAngle) * this.speed;

                    // 맵 탈출 및 장애물 충돌 방지
                    if (canMoveTo(nextX, nextY, this.radius)) {
                        this.x = nextX;
                        this.y = nextY;
                    }
                }
            } else {
                // 사거리 내 발사
                if (this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = this.gun.cooldown;
                }
            }
        }

        // 맵 탈출 방지 Clamp
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));
    }

    shoot() {
        // 총구 위치 계산해서 발사
        let muzzleX = this.x + Math.cos(this.angle) * this.gun.barrelLen;
        let muzzleY = this.y + Math.sin(this.angle) * this.gun.barrelLen;
        bullets.push(new Bullet(muzzleX, muzzleY, this.angle, this.gun, this.isEnemy));
    }

    draw() {
        if (this.hp <= 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.isEnemy) {
            // 적: 요청대로 단순한 빨간 원
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            // 아군: 발로란트 '제트' 탑다운 모델링 (하얀 머리 + 파란 의상)
            // 몸체 (파란 의상)
            ctx.fillStyle = '#2980b9';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1b4f72';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 신발/어깨 포인트
            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(-this.radius + 2, -this.radius, 4, 4);
            ctx.fillRect(-this.radius + 2, this.radius - 4, 4, 4);

            // 하얀 머리카락 (제트 상징)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-2, 0, this.radius * 0.65, 0, Math.PI * 2);
            ctx.fill();

            // 바람 흩날리는 민트/하얀 꽁지머리
            ctx.fillStyle = '#a3e4d7';
            ctx.beginPath();
            ctx.moveTo(-this.radius * 0.8, -3);
            ctx.lineTo(-this.radius * 1.4, 0);
            ctx.lineTo(-this.radius * 0.8, 3);
            ctx.closePath();
            ctx.fill();
        }

        // 총 모델링
        ctx.fillStyle = '#333';
        if (this.gun === GUNS.CLASSIC) { // 글록
            ctx.fillRect(6, -2, 10, 4);
        } else if (this.gun === GUNS.GHOST) { // 소음기 권총
            ctx.fillRect(6, -2, 8, 4);
            ctx.fillStyle = '#111';
            ctx.fillRect(14, -1.5, 10, 3);
        } else if (this.gun === GUNS.SHERIFF) { // 리볼버
            ctx.fillRect(4, -3, 6, 6);
            ctx.fillRect(10, -1.5, 12, 3);
        }

        ctx.restore();

        // 체력바 및 UI
        this.drawUI();
    }

    drawUI() {
        const barW = 34;
        const barH = 4;
        const barX = this.x - barW / 2;
        const barY = this.y - this.radius - 14;

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, barW, barH);

        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = this.isEnemy ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(barX, barY, barW * hpPercent, barH);

        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        // 총기 이름 표시 (아군, 적 둘 다)
        ctx.fillStyle = '#222';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.gun.name, this.x, barY - 3);
    }
}

class Bullet {
    constructor(x, y, angle, gun, isEnemy) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.gun = gun;
        this.isEnemy = isEnemy;
        this.speed = gun.speed;
        this.active = true;
    }

    update() {
        if (!this.active) return;

        let nextX = this.x + Math.cos(this.angle) * this.speed;
        let nextY = this.y + Math.sin(this.angle) * this.speed;

        // 벽 충돌 체크 (벽을 통과하지 못함)
        let gx = Math.floor(nextX / GRID_SIZE);
        let gy = Math.floor(nextY / GRID_SIZE);
        if (gx < 0 || gx >= COLS || gy < 0 || gy >= Math.floor(canvas.height / GRID_SIZE) || (mapGrid[gy] && mapGrid[gy][gx] === 1)) {
            this.active = false;
            return;
        }

        this.x = nextX;
        this.y = nextY;

        // 캐릭터 충돌 체크
        const targets = this.isEnemy ? allies : enemies;
        for (let target of targets) {
            if (target.hp > 0 && Math.hypot(target.x - this.x, target.y - this.y) < target.radius) {
                this.hit(target);
                this.active = false;
                break;
            }
        }
    }

    hit(target) {
        let prob = this.isEnemy ? enemyHeadshotProb : myHeadshotProb;
        let isHead = Math.random() < prob;
        let damage = isHead ? this.gun.headDmg : this.gun.bodyDmg;

        target.hp -= damage;
        showDamageText(target.x, target.y - 15, damage, isHead);

        if (target.hp <= 0) {
            explode(target.x, target.y, target.isEnemy);
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - Math.cos(this.angle) * 8, this.y - Math.sin(this.angle) * 8);
        ctx.stroke();
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 25;
        this.maxLife = 25;
        this.size = Math.random() * 3 + 2;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- 게임 보조 함수 ---

function canMoveTo(x, y, radius) {
    let gx = Math.floor(x / GRID_SIZE);
    let gy = Math.floor(y / GRID_SIZE);
    let maxRows = Math.floor(canvas.height / GRID_SIZE);

    if (gx < 0 || gx >= COLS || gy < 0 || gy >= maxRows) return false;
    if (mapGrid[gy] && mapGrid[gy][gx] === 1) return false;
    return true;
}

function initMap() {
    let rowsCount = Math.floor(canvas.height / GRID_SIZE);
    mapGrid = Array.from({ length: rowsCount }, () => Array(COLS).fill(0));
    
    // 무작위 장애물 배치
    const obstacleCount = 6 + Math.floor(Math.random() * 4);
    let placed = 0;
    while (placed < obstacleCount) {
        let rx = Math.floor(Math.random() * (COLS - 2)) + 1;
        let ry = Math.floor(Math.random() * (rowsCount - 6)) + 3;
        if (mapGrid[ry][rx] === 0) {
            mapGrid[ry][rx] = 1;
            placed++;
        }
    }
}

function drawMap() {
    let rowsCount = Math.floor(canvas.height / GRID_SIZE);
    // 격자 바닥 텍스처
    ctx.strokeStyle = '#d8b892';
    ctx.lineWidth = 1;
    for (let r = 0; r < rowsCount; r++) {
        for (let c = 0; c < COLS; c++) {
            ctx.strokeRect(c * GRID_SIZE, r * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            if (mapGrid[r][c] === 1) {
                // 벽 (바위/장애물 느낌)
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(c * GRID_SIZE, r * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                ctx.strokeStyle = '#2c3e50';
                ctx.strokeRect(c * GRID_SIZE, r * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            }
        }
    }
}

// A* 길찾기
function findPath(startX, startY, targetX, targetY) {
    let maxRows = Math.floor(canvas.height / GRID_SIZE);
    let startNode = { x: Math.floor(startX / GRID_SIZE), y: Math.floor(startY / GRID_SIZE) };
    let targetNode = { x: Math.floor(targetX / GRID_SIZE), y: Math.floor(targetY / GRID_SIZE) };

    startNode.x = Math.max(0, Math.min(COLS - 1, startNode.x));
    startNode.y = Math.max(0, Math.min(maxRows - 1, startNode.y));
    targetNode.x = Math.max(0, Math.min(COLS - 1, targetNode.x));
    targetNode.y = Math.max(0, Math.min(maxRows - 1, targetNode.y));

    let openSet = [ { ...startNode, g: 0, h: 0, f: 0, parent: null } ];
    let closedSet = [];

    while (openSet.length > 0) {
        openSet.sort((a, b) => a.f - b.f);
        let current = openSet.shift();
        closedSet.push(current);

        if (current.x === targetNode.x && current.y === targetNode.y) {
            let path = [];
            let curr = current;
            while (curr) {
                path.push({ x: curr.x, y: curr.y });
                curr = curr.parent;
            }
            return path.reverse();
        }

        const neighbors = [
            { x: current.x + 1, y: current.y },
            { x: current.x - 1, y: current.y },
            { x: current.x, y: current.y + 1 },
            { x: current.x, y: current.y - 1 }
        ];

        for (let n of neighbors) {
            if (n.x < 0 || n.x >= COLS || n.y < 0 || n.y >= maxRows) continue;
            if (mapGrid[n.y] && mapGrid[n.y][n.x] === 1) continue;
            if (closedSet.some(c => c.x === n.x && c.y === n.y)) continue;

            let g = current.g + 1;
            let h = Math.abs(n.x - targetNode.x) + Math.abs(n.y - targetNode.y);
            let f = g + h;

            let existing = openSet.find(o => o.x === n.x && o.y === n.y);
            if (!existing) {
                openSet.push({ ...n, g, h, f, parent: current });
            } else if (g < existing.g) {
                existing.g = g;
                existing.f = f;
                existing.parent = current;
            }
        }
    }
    return [];
}

function initRound() {
    stageNumEl.innerText = stage;
    bullets = [];
    particles = [];
    cardDrawn = false;
    deckArea.classList.remove('disabled');
    startBtn.disabled = true;
    cardContainer.innerHTML = '';
    gameState = 'PREPARE';

    initMap();

    enemyHeadshotProb = 0.10 + (stage - 1) * 0.03;

    // 아군 체력 회복 및 위치 정리
    if (allies.length === 0) {
        allies = [
            new Entity(150, 620, false, GUNS.CLASSIC),
            new Entity(300, 620, false, GUNS.CLASSIC)
        ];
    } else {
        let spacing = canvas.width / (allies.length + 1);
        allies.forEach((a, idx) => {
            a.hp = a.maxHp;
            a.x = spacing * (idx + 1);
            a.y = 620;
        });
    }

    // 라운드 수에 비례하여 적 수증가 (stage 수만큼 적 생성)
    enemies = [];
    const gunKeys = Object.keys(GUNS);
    let enemyCount = stage; 
    let spacing = canvas.width / (enemyCount + 1);

    for (let i = 0; i < enemyCount; i++) {
        let randomGun = GUNS[gunKeys[Math.floor(Math.random() * gunKeys.length)]];
        enemies.push(new Entity(spacing * (i + 1), 70, true, randomGun));
    }
}

function showDamageText(x, y, damage, isHead) {
    const el = document.createElement('div');
    el.className = `damage-text ${isHead ? 'headshot' : 'normal'}`;
    el.innerText = isHead ? `HEAD! -${damage}` : `-${damage}`;
    
    const rect = canvas.getBoundingClientRect();
    el.style.left = `${rect.left + x}px`;
    el.style.top = `${rect.top + y}px`;

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function explode(x, y, isEnemy) {
    const color = isEnemy ? '#e74c3c' : '#00e5ff';
    for (let i = 0; i < 25; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function drawCards() {
    if (cardDrawn || gameState !== 'PREPARE') return;
    cardDrawn = true;
    deckArea.classList.add('disabled');

    cardContainer.innerHTML = '';

    for (let i = 0; i < 3; i++) {
        // 확률적으로 카드 종류 선택 (아군 추가 소환 OR 헤드샷 확률)
        let isSummonCard = Math.random() < 0.25; // 25% 확률로 아군 추가 카드

        const card = document.createElement('div');
        card.className = 'card';

        if (isSummonCard) {
            card.innerHTML = `
                <div class="card-title">지원요청</div>
                <div class="card-value" style="color: #2980b9;">+아군 1명</div>
            `;
            card.onclick = () => {
                let spawnX = 100 + Math.random() * 250;
                allies.push(new Entity(spawnX, 620, false, GUNS.CLASSIC));
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        } else {
            let boost = Math.floor(Math.random() * 10) + 1; // 1~10%
            card.innerHTML = `
                <div class="card-title">헤드샷 확률</div>
                <div class="card-value">+${boost}%</div>
            `;
            card.onclick = () => {
                myHeadshotProb += boost / 100;
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        }

        cardContainer.appendChild(card);
    }
}

// --- 이벤트 리스너 ---

deckArea.addEventListener('click', drawCards);

startBtn.addEventListener('click', () => {
    if (gameState === 'PREPARE' && cardDrawn) {
        gameState = 'BATTLE';
        startBtn.disabled = true;
    }
});

// --- 게임 루프 ---

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawMap();

    if (gameState === 'BATTLE') {
        allies.forEach(a => a.update());
        enemies.forEach(e => e.update());
        bullets.forEach(b => b.update());
    }

    particles.forEach(p => p.update());

    bullets = bullets.filter(b => b.active);
    particles = particles.filter(p => p.life > 0);

    allies.forEach(a => a.draw());
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());

    if (gameState === 'BATTLE') {
        const aliveAllies = allies.filter(a => a.hp > 0);
        const aliveEnemies = enemies.filter(e => e.hp > 0);

        if (aliveEnemies.length === 0) {
            stage++;
            setTimeout(() => {
                initRound();
            }, 1000);
            gameState = 'WAIT';
        } else if (aliveAllies.length === 0) {
            gameState = 'GAMEOVER';
            setTimeout(() => {
                alert('모든 아군이 전멸했습니다!');
                stage = 1;
                myHeadshotProb = 0.10;
                allies = [];
                initRound();
            }, 500);
        }
    }

    requestAnimationFrame(gameLoop);
}

// 초기화 실행
initRound();
gameLoop();
</script>
