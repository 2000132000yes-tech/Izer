<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 1. 공 설정 (시작 지점: 화면 정가운데 / 크기: 기존의 4분의 1인 반지름 2.5)
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 2.5,
            color: 'orange',
            dx: 5,
            dy: -4,
            history: [],
            maxHistory: 15,
            active: true
        };

        // 2. 맵 전체에 공보다 조금 큰 픽셀을 빈틈없이 배치 (정가운데 공 위치만 비움)
        const pixelSize = 8;
        const pixels = [];
        const cols = Math.floor(canvas.width / pixelSize);
        const rows = Math.floor(canvas.height / pixelSize);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const px = c * pixelSize;
                const py = r * pixelSize;
                
                // 화면 정가운데(공 시작 위치) 주변만 픽셀 비움
                const distToCenter = Math.hypot((px + pixelSize / 2) - (canvas.width / 2), (py + pixelSize / 2) - (canvas.height / 2));
                if (distToCenter > 20) {
                    pixels.push({ x: px, y: py });
                }
            }
        }

        // 3. 벽 충돌 폭발 파티클 이펙트
        const particles = [];

        function createExplosion(x, y) {
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 2.5 + 1,
                    color: 'orange',
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function update() {
            if (ball.active) {
                // 공 이동 시 잔상 기록
                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > ball.maxHistory) {
                    ball.history.shift();
                }

                // 공 이동
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 벽 충돌 체크: 튕기지 않고 벽 위치에서 즉시 부서지며 소멸
                if (
                    ball.x - ball.radius <= 0 ||
                    ball.x + ball.radius >= canvas.width ||
                    ball.y - ball.radius <= 0 ||
                    ball.y + ball.radius >= canvas.height
                ) {
                    // 정확한 벽 위치에 파티클 생성
                    const impactX = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
                    const impactY = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
                    
                    createExplosion(impactX, impactY);
                    ball.active = false; // 공 제거
                }
            }

            // 파티클 이펙트 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // 배경: 검은색
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 빈틈없는 픽셀 격자
            ctx.fillStyle = '#222222';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 공 및 잔상 그리기
            if (ball.active) {
                // 잔상
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 165, 0, ${alpha * 0.4})`;
                    ctx.fill();
                    ctx.closePath();
                }

                // 작은 주황색 공
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }

            // 벽 충돌 파티클 이펙트 그리기
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 165, 0, ${p.alpha})`;
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
