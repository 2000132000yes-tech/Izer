<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dungeon Survivor Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      touch-action: none;
      position: fixed;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    
    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      z-index: 5;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }
    .stats-panel {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid #3a3a55;
      border-radius: 8px;
      padding: 8px 12px;
      width: 160px;
    }
    .bar-container {
      width: 100%;
      height: 10px;
      background: #222;
      border-radius: 5px;
      margin: 3px 0 6px 0;
      overflow: hidden;
    }
    .bar-fill-hp {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff2a2a, #ff6b6b);
    }
    .bar-fill-exp {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2a8bff, #6bc5ff);
    }
    .hud-text {
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }
    .inventory-panel {
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid #3a3a55;
      border-radius: 8px;
      padding: 6px 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
    }
    .inv-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .inv-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .icon-coin { background: #ffd700; }
    .icon-key { background: #00e5ff; }

    /* Controls Overlay */
    #touch-controls {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .joystick-zone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    .joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .action-btn-zone {
      position: absolute;
      bottom: 25px;
      right: 25px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .btn-action {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(255, 60, 60, 0.5);
      border: 2px solid rgba(255, 120, 120, 0.9);
      color: white;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    .btn-action:active {
      background: rgba(255, 60, 60, 0.8);
      transform: scale(0.92);
    }
    .btn-dash {
      width: 52px;
      height: 52px;
      background: rgba(60, 160, 255, 0.5);
      border-color: rgba(120, 200, 255, 0.9);
      font-size: 12px;
    }
    .btn-dash:active {
      background: rgba(60, 160, 255, 0.8);
    }

    /* Modals */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 10, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(45deg, #ff4e50, #f9d423);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .modal-sub {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
    }
    .btn-start {
      padding: 12px 36px;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 25px;
      color: white;
      cursor: pointer;
    }
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 280px;
    }
    .upgrade-card {
      background: #181824;
      border: 1px solid #33334d;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .upgrade-card:active {
      border-color: #ff416c;
      background: #252538;
    }
    .card-icon { font-size: 24px; }
    .card-title { font-weight: bold; font-size: 14px; }
    .card-desc { font-size: 11px; color: #aaa; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
      <div class="hud-top">
        <div class="stats-panel">
          <div class="hud-text">
            <span>HP</span>
            <span id="hp-text">100 / 100</span>
          </div>
          <div class="bar-container">
            <div id="hp-bar" class="bar-fill-hp"></div>
          </div>
          <div class="hud-text">
            <span>EXP - Lv.<span id="level-text">1</span></span>
            <span id="exp-text">0 / 50</span>
          </div>
          <div class="bar-container">
            <div id="exp-bar" class="bar-fill-exp"></div>
          </div>
        </div>

        <div class="inventory-panel">
          <div class="inv-item">
            <span class="inv-icon icon-coin"></span>
            <span id="coin-text">0</span>
          </div>
          <div class="inv-item">
            <span class="inv-icon icon-key"></span>
            <span id="key-text">0</span>
          </div>
          <div class="inv-item" style="color: #ff8800; margin-left: 4px;">
            <span><span id="floor-text">1</span>F</span>
          </div>
        </div>
      </div>
    </div>

    <div id="touch-controls">
      <div id="joystick-zone" class="joystick-zone">
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
      <div class="action-btn-zone">
        <div id="btn-dash" class="btn-action btn-dash">대시</div>
        <div id="btn-attack" class="btn-action">공격</div>
      </div>
    </div>

    <div id="start-modal" class="modal">
      <div class="modal-title">DUNGEON SURVIVOR</div>
      <div class="modal-sub">
        조이스틱으로 이동하고 버튼으로 공격하세요.<br>
        상자를 열어 열쇠와 코인을 얻고 던전을 탈출하세요!
      </div>
      <button id="btn-start-game" class="btn-start">게임 시작</button>
    </div>

    <div id="upgrade-modal" class="modal hidden">
      <div class="modal-title" style="font-size: 24px;">LEVEL UP!</div>
      <div class="modal-sub">강화할 능력을 선택하세요.</div>
      <div class="cards-container" id="cards-container"></div>
    </div>

    <div id="gameover-modal" class="modal hidden">
      <div class="modal-title" style="background: linear-gradient(45deg, #ff2a2a, #880000); -webkit-background-clip: text;">YOU DIED</div>
      <div class="modal-sub" id="gameover-stats">도달 층수: 1층</div>
      <button id="btn-restart-game" class="btn-start">다시 도전</button>
    </div>
  </div>

  <script>
    // Global Mobile Scroll Block
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    const TILE_SIZE = 48;
    const MAP_COLS = 30;
    const MAP_ROWS = 30;

    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, type, duration, vol = 0.1) {
        if (!this.ctx || this.ctx.state !== 'running') return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playSwing() { this.playTone(350, 'sine', 0.08, 0.1); }
      playHit() { this.playTone(120, 'sawtooth', 0.12, 0.15); }
      playCoin() { this.playTone(987, 'sine', 0.08, 0.08); }
      playDash() { this.playTone(180, 'triangle', 0.1, 0.1); }
      playLevelUp() { this.playTone(523, 'sine', 0.2, 0.12); }
    }
    const soundEngine = new SoundEngine();

    class Vector2 {
      constructor(x = 0, y = 0) { this.x = x; this.y = y; }
      set(x, y) { this.x = x; this.y = y; return this; }
      clone() { return new Vector2(this.x, this.y); }
      add(v) { this.x += v.x; this.y += v.y; return this; }
      sub(v) { this.x -= v.x; this.y -= v.y; return this; }
      mult(n) { this.x *= n; this.y *= n; return this; }
      div(n) { this.x /= n; this.y /= n; return this; }
      mag() { return Math.sqrt(this.x * this.x + this.y * this.y); }
      normalize() {
        let m = this.mag();
        if (m !== 0) this.div(m);
        return this;
      }
      dist(v) { return Math.sqrt((this.x - v.x)**2 + (this.y - v.y)**2); }
    }

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    class Camera {
      constructor() {
        this.pos = new Vector2(0, 0);
        this.w = window.innerWidth;
        this.h = window.innerHeight;
      }
      follow(target) {
        this.pos.x = target.pos.x - this.w / 2;
        this.pos.y = target.pos.y - this.h / 2;
      }
      getRenderPos(v) {
        return new Vector2(v.x - this.pos.x, v.y - this.pos.y);
      }
    }

    class DungeonMap {
      constructor(cols, rows) {
        this.cols = cols;
        this.rows = rows;
        this.grid = [];
        this.spawnPos = new Vector2();
        this.exitPos = new Vector2();
      }
      generate() {
        this.grid = Array(this.rows).fill(0).map(() => Array(this.cols).fill(1));
        let rooms = [];
        for (let i = 0; i < 8; i++) {
          let w = randomInt(5, 8);
          let h = randomInt(5, 8);
          let x = randomInt(1, this.cols - w - 1);
          let y = randomInt(1, this.rows - h - 1);
          rooms.push({ x, y, w, h, cx: Math.floor(x + w / 2), cy: Math.floor(y + h / 2) });
          for (let ry = y; ry < y + h; ry++) {
            for (let rx = x; rx < x + w; rx++) {
              this.grid[ry][rx] = 0;
            }
          }
        }
        for (let i = 0; i < rooms.length - 1; i++) {
          let r1 = rooms[i], r2 = rooms[i + 1];
          let cx = r1.cx, cy = r1.cy;
          while (cx !== r2.cx) { this.grid[cy][cx] = 0; cx += (r2.cx > cx) ? 1 : -1; }
          while (cy !== r2.cy) { this.grid[cy][cx] = 0; cy += (r2.cy > cy) ? 1 : -1; }
        }
        this.spawnPos.set(rooms[0].cx * TILE_SIZE, rooms[0].cy * TILE_SIZE);
        this.exitPos.set(rooms[rooms.length - 1].cx * TILE_SIZE, rooms[rooms.length - 1].cy * TILE_SIZE);
      }
      isWall(x, y) {
        let c = Math.floor(x / TILE_SIZE);
        let r = Math.floor(y / TILE_SIZE);
        if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return true;
        return this.grid[r][c] === 1;
      }
      draw(ctx, camera) {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            let rPos = camera.getRenderPos(new Vector2(c * TILE_SIZE, r * TILE_SIZE));
            if (this.grid[r][c] === 1) {
              ctx.fillStyle = "#1e1e2f";
              ctx.fillRect(rPos.x, rPos.y, TILE_SIZE, TILE_SIZE);
            } else {
              ctx.fillStyle = "#151520";
              ctx.fillRect(rPos.x, rPos.y, TILE_SIZE, TILE_SIZE);
            }
          }
        }
        let exitR = camera.getRenderPos(this.exitPos);
        ctx.fillStyle = "#00e5ff";
        ctx.beginPath();
        ctx.arc(exitR.x, exitR.y, 16, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Player {
      constructor(x, y) {
        this.pos = new Vector2(x, y);
        this.radius = 16;
        this.speed = 3.8;
        this.maxHp = 100;
        this.hp = 100;
        this.level = 1;
        this.exp = 0;
        this.nextExp = 50;
        this.coins = 0;
        this.keys = 1;
        this.damage = 25;
        this.facingAngle = 0;
      }
      move(dir, map) {
        if (dir.mag() > 0) {
          dir.normalize();
          this.facingAngle = Math.atan2(dir.y, dir.x);
          let nx = this.pos.x + dir.x * this.speed;
          let ny = this.pos.y + dir.y * this.speed;
          if (!map.isWall(nx, this.pos.y)) this.pos.x = nx;
          if (!map.isWall(this.pos.x, ny)) this.pos.y = ny;
        }
      }
      attack(enemies) {
        soundEngine.playSwing();
        for (let e of enemies) {
          if (this.pos.dist(e.pos) < 60) {
            e.hp -= this.damage;
            soundEngine.playHit();
          }
        }
      }
      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        ctx.fillStyle = "#ff416c";
        ctx.beginPath();
        ctx.arc(rPos.x, rPos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Enemy {
      constructor(x, y) {
        this.pos = new Vector2(x, y);
        this.radius = 14;
        this.speed = 1.8;
        this.hp = 40;
        this.maxHp = 40;
      }
      update(player, map) {
        let d = this.pos.dist(player.pos);
        if (d < 300) {
          let dir = player.pos.clone().sub(this.pos).normalize();
          let nx = this.pos.x + dir.x * this.speed;
          let ny = this.pos.y + dir.y * this.speed;
          if (!map.isWall(nx, this.pos.y)) this.pos.x = nx;
          if (!map.isWall(this.pos.x, ny)) this.pos.y = ny;
          if (d < this.radius + player.radius) {
            player.hp -= 0.3;
          }
        }
      }
      draw(ctx, camera) {
        let rPos = camera.getRenderPos(this.pos);
        ctx.fillStyle = "#33ff77";
        ctx.beginPath();
        ctx.arc(rPos.x, rPos.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();

        this.camera = new Camera();
        this.map = new DungeonMap(MAP_COLS, MAP_ROWS);
        this.player = null;
        this.enemies = [];
        this.floor = 1;
        this.joystickVector = new Vector2(0, 0);

        this.setupEvents();
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        if (this.camera) {
          this.camera.w = this.canvas.width;
          this.camera.h = this.canvas.height;
        }
      }

      start() {
        this.player = new Player(0, 0);
        this.loadFloor();
        document.getElementById('start-modal').classList.add('hidden');
        document.getElementById('gameover-modal').classList.add('hidden');
      }

      loadFloor() {
        this.map.generate();
        this.player.pos = this.map.spawnPos.clone();
        this.enemies = [];
        for (let i = 0; i < 6; i++) {
          this.enemies.push(new Enemy(this.player.pos.x + randomInt(-150, 150), this.player.pos.y + randomInt(-150, 150)));
        }
      }

      setupEvents() {
        window.addEventListener('resize', () => this.resize());

        document.getElementById('btn-start-game').addEventListener('click', () => {
          soundEngine.init();
          this.start();
        });
        document.getElementById('btn-restart-game').addEventListener('click', () => {
          soundEngine.init();
          this.start();
        });

        // Touch Joystick
        const zone = document.getElementById('joystick-zone');
        const knob = document.getElementById('joystick-knob');
        let touchId = null;

        zone.addEventListener('touchstart', (e) => {
          soundEngine.init();
          let t = e.changedTouches[0];
          touchId = t.identifier;
          this.updateJoystick(t, zone, knob);
        }, { passive: false });

        zone.addEventListener('touchmove', (e) => {
          for (let t of e.changedTouches) {
            if (t.identifier === touchId) this.updateJoystick(t, zone, knob);
          }
        }, { passive: false });

        const endJoystick = (e) => {
          for (let t of e.changedTouches) {
            if (t.identifier === touchId) {
              touchId = null;
              knob.style.left = '50%';
              knob.style.top = '50%';
              this.joystickVector.set(0, 0);
            }
          }
        };
        zone.addEventListener('touchend', endJoystick);
        zone.addEventListener('touchcancel', endJoystick);

        // Buttons
        document.getElementById('btn-attack').addEventListener('touchstart', (e) => {
          e.preventDefault();
          soundEngine.init();
          if (this.player) this.player.attack(this.enemies);
        }, { passive: false });

        document.getElementById('btn-dash').addEventListener('touchstart', (e) => {
          e.preventDefault();
          soundEngine.init();
          if (this.player) {
            this.player.pos.add(new Vector2(Math.cos(this.player.facingAngle)*40, Math.sin(this.player.facingAngle)*40));
            soundEngine.playDash();
          }
        }, { passive: false });
      }

      updateJoystick(touch, zone, knob) {
        let rect = zone.getBoundingClientRect();
        let cx = rect.left + rect.width / 2;
        let cy = rect.top + rect.height / 2;
        let dx = touch.clientX - cx;
        let dy = touch.clientY - cy;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let maxR = 40;
        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        knob.style.left = `calc(50% + ${dx}px)`;
        knob.style.top = `calc(50% + ${dy}px)`;
        this.joystickVector.set(dx / maxR, dy / maxR);
      }

      update() {
        if (!this.player) return;
        this.player.move(this.joystickVector, this.map);
        this.camera.follow(this.player);

        for (let i = this.enemies.length - 1; i >= 0; i--) {
          let e = this.enemies[i];
          e.update(this.player, this.map);
          if (e.hp <= 0) {
            this.player.exp += 20;
            if (this.player.exp >= this.player.nextExp) {
              this.player.level++;
              this.player.exp = 0;
              soundEngine.playLevelUp();
            }
            this.enemies.splice(i, 1);
          }
        }

        if (this.player.pos.dist(this.map.exitPos) < 20) {
          this.floor++;
          this.loadFloor();
        }

        if (this.player.hp <= 0) {
          document.getElementById('gameover-stats').innerText = `도달 층수: ${this.floor}층`;
          document.getElementById('gameover-modal').classList.remove('hidden');
          this.player = null;
        }

        // UI
        if (this.player) {
          document.getElementById('hp-text').innerText = `${Math.max(0, Math.ceil(this.player.hp))} / ${this.player.maxHp}`;
          document.getElementById('hp-bar').style.width = `${Math.max(0, (this.player.hp / this.player.maxHp) * 100)}%`;
          document.getElementById('level-text').innerText = this.player.level;
          document.getElementById('exp-text').innerText = `${this.player.exp} / ${this.player.nextExp}`;
          document.getElementById('exp-bar').style.width = `${(this.player.exp / this.player.nextExp) * 100}%`;
          document.getElementById('floor-text').innerText = this.floor;
        }
      }

      render() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        if (this.player) {
          this.map.draw(this.ctx, this.camera);
          for (let e of this.enemies) e.draw(this.ctx, this.camera);
          this.player.draw(this.ctx, this.camera);
        }
      }

      loop() {
        this.update();
        this.render();
        requestAnimationFrame(() => this.loop());
      }
    }

    window.onload = () => {
      const g = new Game();
      g.loop();
    };
  </script>
</body>
</html>
