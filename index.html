<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luninmaia Castle - Action RPG</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Apple SD Gothic Neo', sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw; height: 100vh;
    }

    .ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* 좌측 상단 체력 / 마나 바 */
    #stat-bars {
      position: absolute;
      top: 15px; left: 15px;
      width: 180px;
      background: rgba(10, 10, 15, 0.8);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .bar-wrapper {
      position: relative;
      width: 100%; height: 14px;
      background: #222;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .bar-wrapper:last-child { margin-bottom: 0; }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c); transition: width 0.1s; }
    #mp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #2980b9, #3498db); transition: width 0.1s; }
    .bar-text {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000;
    }

    /* 우측 상단 퀘스트 & 아이템 UI */
    #right-ui-container {
      position: absolute;
      top: 15px; right: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }
    .panel-box {
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 11px;
      min-width: 170px;
      max-width: 210px;
    }
    .panel-box h4 { margin: 0 0 6px 0; color: #ffd700; font-size: 12px; }

    #inventory-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 120px;
      overflow-y: auto;
    }
    .item-tag {
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
    }

    /* 대화창 & NPC 초상화 */
    #dialogue-box {
      position: absolute;
      bottom: 135px; left: 50%;
      transform: translateX(-50%);
      width: 90%; max-width: 500px;
      background: rgba(15, 15, 25, 0.95);
      border: 2px solid #5577aa;
      border-radius: 10px;
      padding: 12px;
      color: white;
      display: none;
      pointer-events: auto;
      z-index: 10;
    }
    .dialogue-content-wrapper { display: flex; gap: 12px; align-items: center; }
    #npc-portrait {
      width: 48px; height: 48px;
      background: #445577;
      border: 2px solid #88aaff;
      border-radius: 6px;
      flex-shrink: 0;
      display: flex; justify-content: center; align-items: center;
    }
    .dialogue-body { flex-grow: 1; }
    #dialogue-speaker { font-weight: bold; color: #88ccff; font-size: 13px; margin-bottom: 4px; }
    #dialogue-text { font-size: 12px; line-height: 1.4; margin-bottom: 8px; }
    .dialogue-btns { display: flex; justify-content: flex-end; gap: 6px; }
    .dialogue-btn { background: #335588; border: none; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .skip-btn { background: #555; }

    /* 조이스틱 */
    #joystick-zone {
      position: absolute;
      bottom: 25px; left: 25px;
      width: 100px; height: 100px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      pointer-events: auto;
    }
    #joystick-knob {
      position: absolute;
      top: 30px; left: 30px;
      width: 40px; height: 40px;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 50%;
    }

    /* 액션 버튼 & 스킬 아이콘 */
    .btn-container {
      position: absolute;
      bottom: 25px; right: 20px;
      display: flex; gap: 10px;
      align-items: flex-end;
      pointer-events: auto;
    }
    .action-btn {
      border-radius: 50%;
      color: white; font-weight: bold;
      display: flex; justify-content: center; align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.4);
      position: relative; overflow: hidden;
    }
    #attack-btn { width: 65px; height: 65px; background: #444; font-size: 14px; }
    .skill-btn { width: 48px; height: 48px; background: #2980b9; font-size: 11px; flex-direction: column; }
    .skill-btn.locked { background: #333; color: #888; }
    .skill-btn.locked::after { content: '🔒'; font-size: 12px; }
    .cooldown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      display: flex; justify-content: center; align-items: center;
      font-size: 10px; color: #ffeb3b; font-weight: bold;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div class="ui-layer">
    <!-- 체력 / 마나 바 -->
    <div id="stat-bars">
      <div class="bar-wrapper">
        <div id="hp-bar"></div>
        <div class="bar-text" id="hp-text">100 / 100</div>
      </div>
      <div class="bar-wrapper">
        <div id="mp-bar"></div>
        <div class="bar-text" id="mp-text">100 / 100</div>
      </div>
    </div>

    <!-- 우측 상단 UI (퀘스트 & 인벤토리) -->
    <div id="right-ui-container">
      <div class="panel-box" id="quest-ui">
        <h4>📜 [ 메인 퀘스트 ]</h4>
        <div id="quest-text">아리엘과 대화하기</div>
      </div>
      <div class="panel-box" id="inventory-ui">
        <h4>🎒 [획득한 아이템]</h4>
        <div id="inventory-list">
          <span style="color:#888; font-style:italic;">획득한 아이템 없음</span>
        </div>
      </div>
    </div>

    <!-- 대화창 -->
    <div id="dialogue-box">
      <div class="dialogue-content-wrapper">
        <div id="npc-portrait">
          <canvas id="portraitCanvas" width="40" height="40"></canvas>
        </div>
        <div class="dialogue-body">
          <div id="dialogue-speaker">NPC 이름</div>
          <div id="dialogue-text">대화 내용이 들어갑니다.</div>
          <div class="dialogue-btns">
            <button class="dialogue-btn skip-btn" onclick="skipDialogue()">스킵</button>
            <button class="dialogue-btn" onclick="advanceDialogue()">다음</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 조이스틱 -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <!-- 공격 및 스킬 버튼 -->
    <div class="btn-container">
      <div class="action-btn skill-btn" id="skill-btn-1">
        <span>스매시</span>
        <div class="cooldown-overlay" id="skill-cd-1" style="display:none;">0.00</div>
      </div>
      <div class="action-btn skill-btn locked" id="skill-btn-2"></div>
      <div class="action-btn skill-btn locked" id="skill-btn-3"></div>
      <div class="action-btn" id="attack-btn">
        <canvas id="fistIconCanvas" width="40" height="40"></canvas>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let dpr = window.devicePixelRatio || 1;
    function resize() {
      dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    const viewWidth = () => window.innerWidth;
    const viewHeight = () => window.innerHeight;

    // 아이템 일반(회색) 등급
    const COLOR_COMMON = '#95a5a6';

    // 게임 상태
    let gameState = {
      currentZone: "루니마이아 성",
      fadeInAlpha: 1.0,
      fadeTransitionAlpha: 0,
      isTransitioning: false,
      zoneTitleAlpha: 1.0,
      zoneTitleTimer: 120,
      storyStage: 0,
      questProgress: 0,
      questGoal: 3,
      inventory: {}
    };

    const MAP_SIZE = 1600;

    // 플레이어
    const player = {
      x: 800, y: 900, size: 16, color: '#3498db', speed: 3.6, angle: -Math.PI / 2,
      vx: 0, vy: 0, hp: 100, maxHp: 100, mp: 100, maxMp: 100,
      lastHitTime: Date.now(), lastMpUseTime: Date.now(),
      isAttacking: false, attackProgress: 0, attackSide: 0,
      skill1Cooldown: 0, maxSkill1Cd: 5.0
    };

    // 충돌체 (집, 성벽, 나무)
    const buildings = [
      { x: 550, y: 700, w: 90, h: 80 },
      { x: 960, y: 700, w: 90, h: 80 },
      { x: 550, y: 1000, w: 90, h: 80 },
      { x: 960, y: 1000, w: 90, h: 80 }
    ];

    const trees = [
      { x: 400, y: 400, r: 22 }, { x: 1200, y: 400, r: 22 },
      { x: 400, y: 1200, r: 22 }, { x: 1200, y: 1200, r: 22 },
      { x: 300, y: 800, r: 22 }, { x: 1300, y: 800, r: 22 }
    ];

    // 성벽 충돌 박스 (성문 통로 제외)
    const castleWalls = [
      { x: 100, y: 100, w: 650, h: 20 },
      { x: 850, y: 100, w: 650, h: 20 },
      { x: 100, y: MAP_SIZE - 120, w: 1400, h: 20 },
      { x: 100, y: 100, w: 20, h: MAP_SIZE - 220 },
      { x: MAP_SIZE - 120, y: 100, w: 20, h: MAP_SIZE - 220 }
    ];

    const meadowWalls = [
      { x: 100, y: 1480, w: 650, h: 20 },
      { x: 850, y: 1480, w: 650, h: 20 }
    ];

    // 성문 (Door) 위치
    const gates = {
      castleNorth: { x: 750, y: 90, w: 100, h: 30 },
      meadowSouth: { x: 750, y: 1475, w: 100, h: 30 }
    };

    // NPC
    const npcs = [
      {
        id: 'ariel', name: '수호자 아리엘', zone: "루니마이아 성", x: 800, y: 750, size: 18, color: '#f1c40f',
        dialogues: [
          "성문 밖 푸른 초원에 슬라임들이 급증했네.",
          "북쪽 성문을 지나 슬라임 3마리를 처치하고 슬라임 결정을 모아오게!"
        ]
      }
    ];

    // 드롭 아이템, 이펙트, Floating UI 텍스트
    let droppedItems = [];
    let smashEffects = [];
    let damageTexts = [];
    let pickupTexts = [];

    // 움직이는 적 (슬라임)
    let enemies = [];
    function spawnEnemies() {
      enemies = [];
      for (let i = 0; i < 7; i++) {
        enemies.push({
          id: i, zone: "푸른 초원",
          x: 300 + Math.random() * 1000, y: 300 + Math.random() * 1000,
          radius: 14, color: '#2ecc71', hp: 30, maxHp: 30, isDead: false,
          attackTimer: 0, vx: 0, vy: 0, moveTimer: 0, targetAngle: 0
        });
      }
    }
    spawnEnemies();

    function drawIcons() {
      const fCanvas = document.getElementById('fistIconCanvas');
      const fCtx = fCanvas.getContext('2d');
      fCtx.fillStyle = '#bbb';
      fCtx.beginPath(); fCtx.arc(20, 20, 15, 0, Math.PI*2); fCtx.fill();
      fCtx.fillStyle = '#333'; fCtx.fillRect(14, 14, 12, 12);

      const pCanvas = document.getElementById('portraitCanvas');
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = '#f1c40f'; pCtx.fillRect(10, 10, 20, 20);
      pCtx.fillStyle = '#fff'; pCtx.fillRect(14, 14, 4, 4); pCtx.fillRect(22, 14, 4, 4);
    }
    drawIcons();

    // 조이스틱
    const joystickZone = document.getElementById('joystick-zone');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickActive = false, joystickTouchId = null;
    const maxRadius = 30;

    joystickZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joystickActive = true; joystickTouchId = touch.identifier;
      updateJoystick(touch);
    });

    window.addEventListener('touchmove', (e) => {
      if (!joystickActive) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) updateJoystick(touch);
      }
    });

    function endJoystick(e) {
      if (!joystickActive) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) {
          joystickActive = false; joystickTouchId = null;
          joystickKnob.style.transform = `translate(0px, 0px)`;
          player.vx = 0; player.vy = 0;
        }
      }
    }
    window.addEventListener('touchend', endJoystick);
    window.addEventListener('touchcancel', endJoystick);

    function updateJoystick(touch) {
      const rect = joystickZone.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
      let dist = Math.hypot(dx, dy);

      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius;
        dist = maxRadius;
      }
      joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

      if (dist > 4) {
        player.vx = (dx / maxRadius) * player.speed;
        player.vy = (dy / maxRadius) * player.speed;
        player.angle = Math.atan2(dy, dx);
      } else { player.vx = 0; player.vy = 0; }
    }

    // 충돌 처리
    function applyCollisions(newX, newY) {
      let resX = newX, resY = newY;
      const r = player.size / 2;

      if (gameState.currentZone === "루니마이아 성") {
        buildings.forEach(b => {
          if (resX + r > b.x && resX - r < b.x + b.w && resY + r > b.y && resY - r < b.y + b.h) {
            resX = player.x; resY = player.y;
          }
        });
        castleWalls.forEach(w => {
          if (resX + r > w.x && resX - r < w.x + w.w && resY + r > w.y && resY - r < w.y + w.h) {
            resX = player.x; resY = player.y;
          }
        });
      } else if (gameState.currentZone === "푸른 초원") {
        meadowWalls.forEach(w => {
          if (resX + r > w.x && resX - r < w.x + w.w && resY + r > w.y && resY - r < w.y + w.h) {
            resX = player.x; resY = player.y;
          }
        });
      }

      trees.forEach(t => {
        if (Math.hypot(resX - t.x, resY - t.y) < r + t.r - 5) {
          resX = player.x; resY = player.y;
        }
      });

      return { x: resX, y: resY };
    }

    // 공격 및 스킬
    document.getElementById('attack-btn').addEventListener('touchstart', (e) => {
      e.preventDefault(); triggerAttack('normal');
    });

    document.getElementById('skill-btn-1').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (player.skill1Cooldown <= 0 && player.mp >= 10) {
        player.mp -= 10;
        player.lastMpUseTime = Date.now();
        player.skill1Cooldown = player.maxSkill1Cd;
        triggerAttack('smash');
      }
    });

    function triggerAttack(type) {
      if (player.isAttacking && type === 'normal') return;

      player.isAttacking = true;
      player.attackProgress = 0;
      player.attackSide = (player.attackSide === 0) ? 1 : 0;

      const hitDist = type === 'smash' ? 50 : 32;
      const hitRadius = type === 'smash' ? 45 : 25;
      const hitX = player.x + Math.cos(player.angle) * hitDist;
      const hitY = player.y + Math.sin(player.angle) * hitDist;

      if (type === 'smash') {
        smashEffects.push({ x: hitX, y: hitY, radius: 10, alpha: 1.0, life: 25 });
      }

      npcs.forEach(npc => {
        if (npc.zone === gameState.currentZone && Math.hypot(player.x - npc.x, player.y - npc.y) < 45) {
          openDialogue(npc);
        }
      });

      enemies.forEach(enemy => {
        if (enemy.isDead || enemy.zone !== gameState.currentZone) return;
        const dist = Math.hypot(hitX - enemy.x, hitY - enemy.y);

        if (dist < enemy.radius + hitRadius) {
          const isCrit = Math.random() < 0.3 || type === 'smash';
          let dmg = type === 'smash' ? 35 : 3; // 평타 데미지 3
          if (isCrit) dmg = Math.floor(dmg * 1.5);

          enemy.hp -= dmg;
          damageTexts.push({
            x: enemy.x + (Math.random() * 10 - 5), y: enemy.y - 15,
            text: dmg, isCrit: isCrit, alpha: 1.0, life: 35
          });

          if (enemy.hp <= 0) {
            enemy.isDead = true;
            if (gameState.storyStage === 1) {
              gameState.questProgress++;
              updateQuestUI();
            }

            // 무조건 슬라임 결정 (일반) 1~3개 드롭
            if (Math.random() < 0.5) {
              const count = Math.floor(Math.random() * 3) + 1;
              for (let c = 0; c < count; c++) {
                droppedItems.push({
                  x: enemy.x + (Math.random() * 24 - 12),
                  y: enemy.y + (Math.random() * 24 - 12),
                  name: "슬라임 결정 (일반)",
                  zone: enemy.zone
                });
              }
            }
          }
        }
      });
    }

    // 대화
    let currentDialogueIdx = 0, activeNpc = null;
    function openDialogue(npc) {
      activeNpc = npc; currentDialogueIdx = 0;
      document.getElementById('dialogue-speaker').innerText = npc.name;
      document.getElementById('dialogue-text').innerText = npc.dialogues[0];
      document.getElementById('dialogue-box').style.display = 'block';
    }

    function advanceDialogue() {
      if (!activeNpc) return;
      currentDialogueIdx++;
      if (currentDialogueIdx < activeNpc.dialogues.length) {
        document.getElementById('dialogue-text').innerText = activeNpc.dialogues[currentDialogueIdx];
      } else { closeDialogue(); }
    }
    function skipDialogue() { closeDialogue(); }

    function closeDialogue() {
      document.getElementById('dialogue-box').style.display = 'none';
      if (gameState.storyStage === 0) {
        gameState.storyStage = 1;
        updateQuestUI();
      }
    }

    function updateQuestUI() {
      const qText = document.getElementById('quest-text');
      if (gameState.storyStage === 0) {
        qText.innerText = "아리엘과 대화하기";
      } else if (gameState.storyStage === 1) {
        qText.innerText = `슬라임 처치 (${gameState.questProgress}/${gameState.questGoal})`;
        if (gameState.questProgress >= gameState.questGoal) {
          qText.innerText = "슬라임 처치 완료! 아리엘에게 돌아가세요.";
        }
      }
    }

    // 아이템 습득 시 "따따닥" 텍스트 연출
    function checkItemPickup() {
      droppedItems.forEach((item, index) => {
        if (item.zone === gameState.currentZone) {
          if (Math.hypot(player.x - item.x, player.y - item.y) < 22) {
            const key = item.name;
            if (!gameState.inventory[key]) {
              gameState.inventory[key] = { name: item.name, count: 0 };
            }
            gameState.inventory[key].count++;

            // 먹는 순간 텍스트 상승 연출
            pickupTexts.push({
              x: player.x + (Math.random() * 20 - 10),
              y: player.y - 20 - (pickupTexts.length * 8),
              text: `+ ${item.name}`,
              alpha: 1.0, life: 40
            });

            droppedItems.splice(index, 1);
            renderInventoryUI();
          }
        }
      });
    }

    function renderInventoryUI() {
      const listEl = document.getElementById('inventory-list');
      listEl.innerHTML = '';
      const keys = Object.keys(gameState.inventory);
      if (keys.length === 0) {
        listEl.innerHTML = '<span style="color:#888; font-style:italic;">획득한 아이템 없음</span>';
        return;
      }
      keys.forEach(k => {
        const item = gameState.inventory[k];
        const div = document.createElement('div');
        div.className = 'item-tag';
        div.style.color = COLOR_COMMON;
        div.innerHTML = `<span>${item.name}</span> <span>x${item.count}</span>`;
        listEl.appendChild(div);
      });
    }

    // 성문 통과 및 맵 전환
    function checkGateTransition() {
      if (gameState.isTransitioning) return;

      if (gameState.currentZone === "루니마이아 성" && player.y < 110 && Math.abs(player.x - 800) < 40) {
        startZoneTransition("푸른 초원", 800, 1430);
      } else if (gameState.currentZone === "푸른 초원" && player.y > 1450 && Math.abs(player.x - 800) < 40) {
        startZoneTransition("루니마이아 성", 800, 140);
      }
    }

    function startZoneTransition(nextZone, targetX, targetY) {
      gameState.isTransitioning = true;
      let fadeOut = setInterval(() => {
        gameState.fadeTransitionAlpha += 0.08;
        if (gameState.fadeTransitionAlpha >= 1) {
          clearInterval(fadeOut);
          player.x = targetX; player.y = targetY;
          gameState.currentZone = nextZone;
          gameState.zoneTitleAlpha = 1.0; gameState.zoneTitleTimer = 120;

          let fadeIn = setInterval(() => {
            gameState.fadeTransitionAlpha -= 0.08;
            if (gameState.fadeTransitionAlpha <= 0) {
              gameState.fadeTransitionAlpha = 0;
              gameState.isTransitioning = false;
              clearInterval(fadeIn);
            }
          }, 30);
        }
      }, 30);
    }

    // 적 배회 & 추적 AI 업데이트
    function updateEnemies(dt) {
      enemies.forEach(enemy => {
        if (enemy.isDead || enemy.zone !== gameState.currentZone) return;

        const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);

        if (distToPlayer < 200) {
          // 플레이어 추적
          const angle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
          enemy.x += Math.cos(angle) * 1.2;
          enemy.y += Math.sin(angle) * 1.2;

          // 근접 시 공격 (10 데미지)
          if (distToPlayer < enemy.radius + player.size/2 + 4) {
            enemy.attackTimer += dt;
            if (enemy.attackTimer >= 1.0) {
              enemy.attackTimer = 0;
              player.hp -= 10;
              player.lastHitTime = Date.now();
              damageTexts.push({ x: player.x, y: player.y - 12, text: 10, isCrit: true, alpha: 1.0, life: 30 });
            }
          }
        } else {
          // 자연스러운 임의 배회
          enemy.moveTimer -= dt;
          if (enemy.moveTimer <= 0) {
            enemy.moveTimer = 2 + Math.random() * 3;
            enemy.targetAngle = Math.random() * Math.PI * 2;
          }
          enemy.x += Math.cos(enemy.targetAngle) * 0.5;
          enemy.y += Math.sin(enemy.targetAngle) * 0.5;
        }
      });
    }

    // 메인 루프
    let lastTime = Date.now();
    function update() {
      const now = Date.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      if (gameState.fadeInAlpha > 0) gameState.fadeInAlpha -= 0.02;
      if (gameState.zoneTitleTimer > 0) gameState.zoneTitleTimer--;
      else if (gameState.zoneTitleAlpha > 0) gameState.zoneTitleAlpha -= 0.02;

      // 스킬 쿨타임
      if (player.skill1Cooldown > 0) {
        player.skill1Cooldown -= dt;
        if (player.skill1Cooldown < 0) player.skill1Cooldown = 0;
        const cdOverlay = document.getElementById('skill-cd-1');
        if (player.skill1Cooldown > 0) {
          cdOverlay.style.display = 'flex';
          cdOverlay.innerText = player.skill1Cooldown.toFixed(2);
        } else { cdOverlay.style.display = 'none'; }
      }

      // HP/MP 자연회복
      if (now - player.lastMpUseTime >= 2000 && player.mp < player.maxMp) {
        player.mp = Math.min(player.maxMp, player.mp + 0.2);
      }
      if (now - player.lastHitTime >= 5000 && player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + 0.1);
      }

      document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
      document.getElementById('hp-text').innerText = `${Math.max(0, Math.floor(player.hp))} / ${player.maxHp}`;
      document.getElementById('mp-bar').style.width = `${(player.mp / player.maxMp) * 100}%`;
      document.getElementById('mp-text').innerText = `${Math.floor(player.mp)} / ${player.maxMp}`;

      const nextPos = applyCollisions(player.x + player.vx, player.y + player.vy);
      player.x = Math.max(player.size, Math.min(MAP_SIZE - player.size, nextPos.x));
      player.y = Math.max(player.size, Math.min(MAP_SIZE - player.size, nextPos.y));

      checkGateTransition();
      checkItemPickup();
      updateEnemies(dt);

      if (player.isAttacking) {
        player.attackProgress += 0.2;
        if (player.attackProgress >= 1) player.isAttacking = false;
      }

      smashEffects.forEach((se, i) => {
        se.radius += 2; se.alpha -= 0.04; se.life--;
        if (se.life <= 0) smashEffects.splice(i, 1);
      });
      damageTexts.forEach((dt, i) => {
        dt.y -= 0.5; dt.alpha -= 0.03; dt.life--;
        if (dt.life <= 0) damageTexts.splice(i, 1);
      });
      pickupTexts.forEach((pt, i) => {
        pt.y -= 0.8; pt.alpha -= 0.025; pt.life--;
        if (pt.life <= 0) pickupTexts.splice(i, 1);
      });
    }

    // 렌더링
    function render() {
      ctx.clearRect(0, 0, viewWidth(), viewHeight());
      const camX = player.x - viewWidth() / 2;
      const camY = player.y - viewHeight() / 2;

      ctx.save();
      ctx.translate(-camX, -camY);

      // 필드 배경
      ctx.fillStyle = gameState.currentZone === "루니마이아 성" ? '#275822' : '#1c451b';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      if (gameState.currentZone === "루니마이아 성") {
        ctx.fillStyle = '#636e72';
        ctx.fillRect(750, 0, 100, MAP_SIZE); ctx.fillRect(0, 750, MAP_SIZE, 100);

        // 건물 & 그림자
        buildings.forEach(b => {
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.fillRect(b.x + 8, b.y + 8, b.w, b.h);
          ctx.fillStyle = '#c0392b';
          ctx.fillRect(b.x, b.y, b.w, b.h);
          ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        });

        // 성벽
        ctx.fillStyle = '#4a5568';
        castleWalls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

        // 성문 복구 (나무문)
        ctx.fillStyle = '#8e44ad';
        ctx.fillStyle = '#795548';
        ctx.fillRect(gates.castleNorth.x, gates.castleNorth.y, gates.castleNorth.w, gates.castleNorth.h);
        ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2;
        ctx.strokeRect(gates.castleNorth.x, gates.castleNorth.y, gates.castleNorth.w, gates.castleNorth.h);
      } else {
        // 초원 남쪽 성벽 및 성문 복구
        ctx.fillStyle = '#4a5568';
        meadowWalls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

        ctx.fillStyle = '#795548';
        ctx.fillRect(gates.meadowSouth.x, gates.meadowSouth.y, gates.meadowSouth.w, gates.meadowSouth.h);
        ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2;
        ctx.strokeRect(gates.meadowSouth.x, gates.meadowSouth.y, gates.meadowSouth.w, gates.meadowSouth.h);
      }

      // 나무
      trees.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath(); ctx.arc(t.x + 4, t.y + 4, t.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2e7d32';
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI*2); ctx.fill();
      });

      // 바닥 드롭 아이템 (텍스트 없이 구체 아이콘 형태)
      droppedItems.forEach(item => {
        if (item.zone !== gameState.currentZone) return;
        ctx.fillStyle = COLOR_COMMON;
        ctx.beginPath(); ctx.arc(item.x, item.y, 5, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
      });

      // NPC
      npcs.forEach(npc => {
        if (npc.zone === gameState.currentZone) {
          ctx.fillStyle = npc.color;
          ctx.fillRect(npc.x - npc.size/2, npc.y - npc.size/2, npc.size, npc.size);
          ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(npc.name, npc.x, npc.y - 12);
        }
      });

      // 적 (체력바 포함)
      enemies.forEach(enemy => {
        if (enemy.isDead || enemy.zone !== gameState.currentZone) return;

        // 슬라임 몸체
        ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI*2);
        ctx.fillStyle = enemy.color; ctx.fill();

        // 적 체력바 (HP Bar)
        const barW = 24, barH = 4;
        const barX = enemy.x - barW / 2;
        const barY = enemy.y - enemy.radius - 8;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(barX, barY, (barW * Math.max(0, enemy.hp)) / enemy.maxHp, barH);
      });

      // 플레이어 및 쨉
      ctx.save();
      ctx.translate(player.x, player.y); ctx.rotate(player.angle);
      ctx.fillStyle = player.color;
      ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);

      if (player.isAttacking) {
        const swing = Math.sin(player.attackProgress * Math.PI) * 12;
        ctx.fillStyle = '#f39c12';
        if (player.attackSide === 0) ctx.fillRect(player.size/2 + swing, -6, 5, 5);
        else ctx.fillRect(player.size/2 + swing, 1, 5, 5);
      }
      ctx.restore();

      // 스매시 스킬 화염 연출
      smashEffects.forEach(se => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, se.alpha);
        ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(se.x, se.y, se.radius, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      });

      // 데미지 텍스트
      damageTexts.forEach(dt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, dt.alpha);
        ctx.fillStyle = dt.isCrit ? '#ff2222' : '#ffffff';
        ctx.font = dt.isCrit ? 'bold 14px sans-serif' : '11px sans-serif';
        ctx.textAlign = 'center'; ctx.fillText(dt.text, dt.x, dt.y);
        ctx.restore();
      });

      // 아이템 먹었을 때 뜨는 "따따닥" 텍스트 연출
      pickupTexts.forEach(pt => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pt.text, pt.x, pt.y);
        ctx.restore();
      });

      ctx.restore();

      // 화면 타이틀
      if (gameState.zoneTitleAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = gameState.zoneTitleAlpha;
        ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        ctx.shadowColor = 'black'; ctx.shadowBlur = 6;
        ctx.fillText(gameState.currentZone, viewWidth() / 2, viewHeight() / 3);
        ctx.restore();
      }

      // 전환 오버레이
      if (gameState.fadeInAlpha > 0 || gameState.fadeTransitionAlpha > 0) {
        const a = Math.max(gameState.fadeInAlpha, gameState.fadeTransitionAlpha);
        ctx.fillStyle = `rgba(0, 0, 0, ${a})`; ctx.fillRect(0, 0, viewWidth(), viewHeight());
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
