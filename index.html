<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            touch-action: none;
            z-index: 1;
        }

        /* 상단 UI 레이어 */
        .ui-layer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .currency-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
        }

        .diamond-icon {
            width: 12px;
            height: 12px;
            background-color: #00e5ff;
            transform: rotate(45deg);
            margin-right: 10px;
            box-shadow: 0 0 8px #00e5ff;
            flex-shrink: 0;
        }

        .plus-btn {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            outline: none;
        }

        .plus-btn:active {
            transform: scale(0.92);
            background: #333333;
        }

        /* 슬라이드 업그레이드 창 */
        .upgrade-panel {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 75%;
            background: rgba(15, 15, 15, 0.96);
            border-bottom: 2px solid #00e5ff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            transition: top 0.5s cubic-bezier(0, 0, 0.2, 1);
            z-index: 200;
            padding: 16px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .upgrade-panel.active {
            top: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #00e5ff;
        }

        .panel-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .upgrade-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            padding-right: 4px;
        }

        /* 업그레이드 카드 디자인 */
        .upgrade-card {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-info {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }

        .orange-ball-icon {
            width: 14px;
            height: 14px;
            background-color: orange;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            box-shadow: 0 0 6px rgba(255, 165, 0, 0.8);
        }

        .upgrade-cost-btn {
            background: #00e5ff;
            color: #000000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upgrade-cost-btn:active {
            transform: scale(0.96);
        }

        .down-arrow-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #444444;
            color: #aaaaaa;
            width: 100%;
            padding: 6px 0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .down-arrow-btn:active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .section-title {
            font-size: 14px;
            color: #888888;
            font-weight: bold;
            margin-top: 4px;
            margin-bottom: -4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- 메인 화면 상단 UI -->
        <div class="ui-layer">
            <div class="currency-box">
                <div class="diamond-icon"></div>
                <span class="gem-count-text">0</span>
            </div>
            <button class="plus-btn" id="openUpgradeBtn">+</button>
        </div>

        <!-- 슬라이드 업그레이드 창 -->
        <div class="upgrade-panel" id="upgradePanel">
            <div class="panel-header">
                <div class="panel-title">UPGRADES</div>
                <div class="panel-header-right">
                    <div class="currency-box" style="padding: 4px 10px; font-size: 15px;">
                        <div class="diamond-icon" style="width: 10px; height: 10px; margin-right: 6px;"></div>
                        <span class="gem-count-text">0</span>
                    </div>
                    <button class="close-btn" id="closeUpgradeBtn">✕</button>
                </div>
            </div>

            <div class="upgrade-list" id="upgradeList">
                <!-- 메인 개수 업그레이드 -->
                <div class="upgrade-card">
                    <div class="card-row">
                        <div class="upgrade-info">
                            +1 ball <span class="orange-ball-icon"></span>
                        </div>
                        <button class="upgrade-cost-btn" id="buyBallBtn">
                            <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                            <span id="ballCostText">10</span>
                        </button>
                    </div>
                    <button class="down-arrow-btn" id="scrollToBallSectionBtn">▼ 주황색 공 상세 업그레이드</button>
                </div>

                <!-- 주황색 공 개별 업그레이드 섹션 -->
                <div class="section-title" id="orangeBallSection">
                    <span class="orange-ball-icon" style="margin-left:0;"></span> 주황색 공 강화
                </div>

                <!-- 속도 업그레이드 -->
                <div class="upgrade-card">
                    <div class="card-row">
                        <div class="upgrade-info">+1 Speed</div>
                        <button class="upgrade-cost-btn" id="buySpeedBtn">
                            <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                            <span id="speedCostText">20</span>
                        </button>
                    </div>
                </div>

                <!-- 크기 업그레이드 -->
                <div class="upgrade-card">
                    <div class="card-row">
                        <div class="upgrade-info">+0.5 size</div>
                        <button class="upgrade-cost-btn" id="buySizeBtn">
                            <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                            <span id="sizeCostText">50</span>
                        </button>
                    </div>
                </div>

                <!-- 블록 파괴 재화 추가 업그레이드 -->
                <div class="upgrade-card">
                    <div class="card-row">
                        <div class="upgrade-info">+1 Block</div>
                        <button class="upgrade-cost-btn" id="buyBlockBtn">
                            <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                            <span id="blockCostText">500</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountTexts = document.querySelectorAll('.gem-count-text');
        
        const upgradePanel = document.getElementById('upgradePanel');
        const openUpgradeBtn = document.getElementById('openUpgradeBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');
        const scrollToBallSectionBtn = document.getElementById('scrollToBallSectionBtn');
        const orangeBallSection = document.getElementById('orangeBallSection');

        // 버튼 및 가격 엘리먼트
        const buyBallBtn = document.getElementById('buyBallBtn');
        const ballCostText = document.getElementById('ballCostText');
        const buySpeedBtn = document.getElementById('buySpeedBtn');
        const speedCostText = document.getElementById('speedCostText');
        const buySizeBtn = document.getElementById('buySizeBtn');
        const sizeCostText = document.getElementById('sizeCostText');
        const buyBlockBtn = document.getElementById('buyBlockBtn');
        const blockCostText = document.getElementById('blockCostText');

        // 게임 상태 변수
        let gems = 0;
        let ballCost = 10;
        let speedCost = 20;
        let sizeCost = 50;
        let blockCost = 500;

        let ballSpeedBonus = 0;
        let ballSizeBonus = 0;
        let gemsPerBlock = 1;

        // 재화 UI 업데이트
        function updateGemUI() {
            gemCountTexts.forEach(el => el.textContent = gems);
        }

        // UI 이벤트
        openUpgradeBtn.addEventListener('click', () => {
            upgradePanel.classList.add('active');
        });

        closeUpgradeBtn.addEventListener('click', () => {
            upgradePanel.classList.remove('active');
        });

        scrollToBallSectionBtn.addEventListener('click', () => {
            orangeBallSection.scrollIntoView({ behavior: 'smooth' });
        });

        // 캔버스 맞춤
        const size = Math.min(window.innerWidth, window.innerHeight);
        canvas.width = size;
        canvas.height = size;

        const gridCount = 50;
        const pixelSize = size / gridCount;

        let pixels = [];
        const particles = [];
        const balls = [];

        // 3x3 공백
        const centerStart = Math.floor(gridCount / 2) - 1;
        const centerEnd = centerStart + 2;

        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                pixels.push({
                    x: c * pixelSize,
                    y: r * pixelSize
                });
            }
        }

        // 공 생성 함수
        function createBall() {
            const angle = Math.random() * Math.PI * 2;
            const baseSpeed = pixelSize * 0.18 + (ballSpeedBonus * pixelSize * 0.03);
            const currentRadius = pixelSize * 0.35 + (ballSizeBonus * pixelSize * 0.05);

            balls.push({
                x: (centerStart + 1.5) * pixelSize,
                y: (centerStart + 1.5) * pixelSize,
                radius: currentRadius,
                dx: Math.cos(angle) * baseSpeed,
                dy: Math.sin(angle) * baseSpeed,
                color: 'orange',
                history: []
            });
        }

        // 첫 번째 공 생성
        createBall();

        // 1. +1 ball 구매
        buyBallBtn.addEventListener('click', () => {
            if (gems >= ballCost) {
                gems -= ballCost;
                ballCost += 10;
                ballCostText.textContent = ballCost;
                updateGemUI();
                createBall();
            }
        });

        // 2. +1 Speed 구매
        buySpeedBtn.addEventListener('click', () => {
            if (gems >= speedCost) {
                gems -= speedCost;
                speedCost += 20;
                speedCostText.textContent = speedCost;
                ballSpeedBonus += 1;
                updateGemUI();

                // 기존 모든 공의 속도 업데이트
                balls.forEach(ball => {
                    const currentAngle = Math.atan2(ball.dy, ball.dx);
                    const newSpeed = pixelSize * 0.18 + (ballSpeedBonus * pixelSize * 0.03);
                    ball.dx = Math.cos(currentAngle) * newSpeed;
                    ball.dy = Math.sin(currentAngle) * newSpeed;
                });
            }
        });

        // 3. +0.5 size 구매
        buySizeBtn.addEventListener('click', () => {
            if (gems >= sizeCost) {
                gems -= sizeCost;
                sizeCost += 50;
                sizeCostText.textContent = sizeCost;
                ballSizeBonus += 0.5;
                updateGemUI();

                // 기존 모든 공의 크기 업데이트
                balls.forEach(ball => {
                    ball.radius = pixelSize * 0.35 + (ballSizeBonus * pixelSize * 0.05);
                });
            }
        });

        // 4. +1 Block 구매
        buyBlockBtn.addEventListener('click', () => {
            if (gems >= blockCost) {
                gems -= blockCost;
                blockCost += 500;
                blockCostText.textContent = blockCost;
                gemsPerBlock += 1;
                updateGemUI();
            }
        });

        // 파티클 생성
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: pixelSize * 0.3,
                    alpha: 1,
                    life: 0.05
                });
            }
        }

        function update() {
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > 8) {
                    ball.history.shift();
                }

                let nextX = ball.x + ball.dx;
                let nextY = ball.y + ball.dy;

                // 벽 충돌
                if (nextX - ball.radius < 0 || nextX + ball.radius > canvas.width) {
                    ball.dx = -ball.dx;
                    nextX = ball.x + ball.dx;
                }
                if (nextY - ball.radius < 0 || nextY + ball.radius > canvas.height) {
                    ball.dy = -ball.dy;
                    nextY = ball.y + ball.dy;
                }

                // 블록 충돌
                for (let i = pixels.length - 1; i >= 0; i--) {
                    const p = pixels[i];

                    const closestX = Math.max(p.x, Math.min(nextX, p.x + pixelSize));
                    const closestY = Math.max(p.y, Math.min(nextY, p.y + pixelSize));

                    const distX = nextX - closestX;
                    const distY = nextY - closestY;
                    const distance = Math.hypot(distX, distY);

                    if (distance < ball.radius) {
                        createParticles(p.x + pixelSize / 2, p.y + pixelSize / 2);
                        pixels.splice(i, 1);

                        gems += gemsPerBlock;
                        updateGemUI();

                        if (Math.abs(distX) > Math.abs(distY)) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        break;
                    }
                }

                ball.x += ball.dx;
                ball.y += ball.dy;
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 회색 블록
            ctx.fillStyle = '#888888';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 파티클
            for (let i = 0; i < particles.length; i++) {
                const pt = particles[i];
                ctx.fillStyle = `rgba(136, 136, 136, ${pt.alpha})`;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            }

            // 공 및 잔상
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 165, 0, ${alpha * 0.4})`;
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
