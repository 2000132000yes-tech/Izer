<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            touch-action: none;
            z-index: 1;
        }

        /* 상단 UI 레이어 */
        .ui-layer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .currency-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
        }

        .diamond-icon {
            width: 12px;
            height: 12px;
            background-color: #00e5ff;
            transform: rotate(45deg);
            margin-right: 10px;
            box-shadow: 0 0 8px #00e5ff;
            flex-shrink: 0;
        }

        #gemCount {
            color: #ffffff;
            text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        .plus-btn {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            outline: none;
        }

        .plus-btn:active {
            transform: scale(0.92);
            background: #333333;
        }

        /* 슬라이드 업그레이드 창 (빠르다가 점점 느리게 내려옴) */
        .upgrade-panel {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 65%;
            background: rgba(15, 15, 15, 0.95);
            border-bottom: 2px solid #00e5ff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            transition: top 0.5s cubic-bezier(0, 0, 0.2, 1);
            z-index: 200;
            padding: 20px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .upgrade-panel.active {
            top: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #00e5ff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .upgrade-list {
            flex: 1;
            overflow-y: auto;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222222;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #333333;
        }

        .upgrade-info {
            font-size: 16px;
            font-weight: bold;
        }

        .upgrade-cost-btn {
            background: #00e5ff;
            color: #000000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .upgrade-cost-btn:disabled {
            background: #555555;
            color: #888888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- 상단 UI -->
        <div class="ui-layer">
            <div class="currency-box">
                <div class="diamond-icon"></div>
                <span id="gemCount">0</span>
            </div>
            <button class="plus-btn" id="openUpgradeBtn">+</button>
        </div>

        <!-- 슬라이드 업그레이드 창 -->
        <div class="upgrade-panel" id="upgradePanel">
            <div class="panel-header">
                <div class="panel-title">UPGRADES</div>
                <button class="close-btn" id="closeUpgradeBtn">✕</button>
            </div>
            <div class="upgrade-list">
                <div class="upgrade-item">
                    <div class="upgrade-info">+1 ball</div>
                    <button class="upgrade-cost-btn" id="buyBallBtn">💎 10</button>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountEl = document.getElementById('gemCount');
        const upgradePanel = document.getElementById('upgradePanel');
        const openUpgradeBtn = document.getElementById('openUpgradeBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');
        const buyBallBtn = document.getElementById('buyBallBtn');

        let gems = 0;
        let ballCost = 10;

        // UI 이벤트 처리
        openUpgradeBtn.addEventListener('click', () => {
            upgradePanel.classList.add('active');
        });

        closeUpgradeBtn.addEventListener('click', () => {
            upgradePanel.classList.remove('active');
        });

        // 캔버스 크기 맞춤
        const size = Math.min(window.innerWidth, window.innerHeight);
        canvas.width = size;
        canvas.height = size;

        const gridCount = 50;
        const pixelSize = size / gridCount;

        let pixels = [];
        const particles = [];
        const balls = [];

        // 가운데 3x3 공백
        const centerStart = Math.floor(gridCount / 2) - 1;
        const centerEnd = centerStart + 2;

        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                pixels.push({
                    x: c * pixelSize,
                    y: r * pixelSize
                });
            }
        }

        // 공 생성 함수
        function createBall() {
            const angle = Math.random() * Math.PI * 2;
            const speed = pixelSize * 0.18;
            balls.push({
                x: (centerStart + 1.5) * pixelSize,
                y: (centerStart + 1.5) * pixelSize,
                radius: pixelSize * 0.35,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                color: 'orange',
                history: []
            });
        }

        // 기본 첫 번째 공 추가
        createBall();

        // +1 ball 구매 클릭 이벤트
        buyBallBtn.addEventListener('click', () => {
            if (gems >= ballCost) {
                gems -= ballCost;
                ballCost += 10;
                gemCountEl.textContent = gems;
                buyBallBtn.textContent = `💎 ${ballCost}`;
                createBall();
            }
        });

        // 파티클 생성
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: pixelSize * 0.3,
                    alpha: 1,
                    life: 0.05
                });
            }
        }

        function update() {
            // 모든 공 업데이트
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > 8) {
                    ball.history.shift();
                }

                let nextX = ball.x + ball.dx;
                let nextY = ball.y + ball.dy;

                // 벽 충돌
                if (nextX - ball.radius < 0 || nextX + ball.radius > canvas.width) {
                    ball.dx = -ball.dx;
                    nextX = ball.x + ball.dx;
                }
                if (nextY - ball.radius < 0 || nextY + ball.radius > canvas.height) {
                    ball.dy = -ball.dy;
                    nextY = ball.y + ball.dy;
                }

                // 블록 충돌
                for (let i = pixels.length - 1; i >= 0; i--) {
                    const p = pixels[i];

                    const closestX = Math.max(p.x, Math.min(nextX, p.x + pixelSize));
                    const closestY = Math.max(p.y, Math.min(nextY, p.y + pixelSize));

                    const distX = nextX - closestX;
                    const distY = nextY - closestY;
                    const distance = Math.hypot(distX, distY);

                    if (distance < ball.radius) {
                        createParticles(p.x + pixelSize / 2, p.y + pixelSize / 2);
                        pixels.splice(i, 1);

                        gems += 1;
                        gemCountEl.textContent = gems;

                        if (Math.abs(distX) > Math.abs(distY)) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        break;
                    }
                }

                ball.x += ball.dx;
                ball.y += ball.dy;
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 회색 블록
            ctx.fillStyle = '#888888';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 파티클
            for (let i = 0; i < particles.length; i++) {
                const pt = particles[i];
                ctx.fillStyle = `rgba(136, 136, 136, ${pt.alpha})`;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            }

            // 공 및 잔상 그리기
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 165, 0, ${alpha * 0.4})`;
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
