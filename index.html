<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 1. 공 설정 (시작 지점을 정가운데로 설정)
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 2.5,
            color: 'orange',
            dx: 5,
            dy: -4,
            history: [],
            maxHistory: 12,
            active: true
        };

        // 2. 맵에 픽셀 배치 (중앙 공 시작 위치 비움)
        const pixelSize = 6;
        const pixels = [];
        const cols = Math.floor(canvas.width / pixelSize);
        const rows = Math.floor(canvas.height / pixelSize);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const px = c * pixelSize;
                const py = r * pixelSize;
                
                // 정가운데 공의 위치 주변에는 픽셀을 배치하지 않음
                const distToBall = Math.hypot((px + pixelSize / 2) - (canvas.width / 2), (py + pixelSize / 2) - (canvas.height / 2));
                if (distToBall > 30) {
                    pixels.push({ x: px, y: py });
                }
            }
        }

        // 3. 파티클 이펙트
        const particles = [];

        function createImpactParticles(x, y) {
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 2 + 1,
                    alpha: 1,
                    life: 0.03
                });
            }
        }

        function update() {
            if (ball.active) {
                // 잔상 기록
                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > ball.maxHistory) {
                    ball.history.shift();
                }

                // 공 이동
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 벽 충돌 감지: 닿는 즉시 정지하고 부서지는 이펙트 발생 후 공 제거
                let hit = false;
                let impactX = ball.x;
                let impactY = ball.y;

                if (ball.x - ball.radius <= 0) {
                    impactX = 0;
                    hit = true;
                } else if (ball.x + ball.radius >= canvas.width) {
                    impactX = canvas.width;
                    hit = true;
                }

                if (ball.y - ball.radius <= 0) {
                    impactY = 0;
                    hit = true;
                } else if (ball.y + ball.radius >= canvas.height) {
                    impactY = canvas.height;
                    hit = true;
                }

                if (hit) {
                    createImpactParticles(impactX, impactY);
                    ball.active = false; // 튕기지 않고 소멸
                }
            }

            // 파티클 업데이트
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.life;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // 검은색 배경
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 픽셀 격자
            ctx.fillStyle = '#222222';
            for (let i = 0; i < pixels.length; i++) {
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 공 및 잔상
            if (ball.active) {
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 165, 0, ${alpha * 0.5})`;
                    ctx.fill();
                    ctx.closePath();
                }

                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = ball.color;
                ctx.fill();
                ctx.closePath();
            }

            // 충돌 파티클 이펙트
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 165, 0, ${p.alpha})`;
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
