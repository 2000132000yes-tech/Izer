<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Break Game - Complete Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0b0b;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 800px;
            max-height: 800px;
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #000000;
            border: 2px solid #222;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            touch-action: none;
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }
        .ui-group {
            display: flex;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
        }
        .stat-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(20, 20, 20, 0.85);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
        }
        .diamond-icon {
            width: 12px;
            height: 12px;
            background-color: #f39c12;
            transform: rotate(45deg);
        }
        .btn-top {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-top:hover {
            background: #3a3a3a;
        }
        #upgrade-panel {
            position: absolute;
            top: -450px;
            left: 0;
            width: 100%;
            height: 420px;
            background: rgba(15, 15, 18, 0.95);
            border-bottom: 2px solid #333;
            border-radius: 0 0 16px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        #upgrade-panel.open {
            top: 0;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .panel-header h2 {
            margin: 0;
            font-size: 18px;
            color: #f39c12;
        }
        .close-btn {
            background: #e74c3c;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .upgrade-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
        }
        .upgrade-card {
            background: rgba(30, 30, 35, 0.8);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-weight: bold;
            font-size: 14px;
            color: #ddd;
        }
        .buy-btn {
            background: #27ae60;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .buy-btn:hover:not(:disabled) {
            background: #2ecc71;
        }
        .buy-btn:disabled {
            background: #555 !important;
            color: #888 !important;
            cursor: not-allowed;
        }
        .card-stats {
            font-size: 11px;
            color: #aaa;
            line-height: 1.3;
        }
        .sub-label {
            font-size: 10px;
            color: #888;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="ui-layer">
            <div class="ui-group">
                <div class="stat-box">
                    <div class="diamond-icon"></div>
                    <span id="gemCount">0</span>
                </div>
                <div class="stat-box" id="floorDisplay" style="color: #3498db;">1F</div>
            </div>
            <div class="ui-group">
                <button class="btn-top" id="devBtn" style="background: #8e44ad;">DEV</button>
                <button class="btn-top" id="upgradeToggleBtn">⚙️ Upgrade</button>
            </div>
        </div>

        <div id="upgrade-panel">
            <div class="panel-header">
                <h2>Upgrades & Ball Shop</h2>
                <button class="close-btn" id="closePanelBtn">✕</button>
            </div>
            <div class="upgrade-content" id="upgradeList"></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gems = 0;
        let currentFloor = 1;
        let totalBlocksInFloor = 0;
        let destroyedBlocksInFloor = 0;

        const tierConfig = [
            { color: '#888888', hp: 1, reward: 1 },
            { color: '#f1c40f', hp: 2, reward: 5 },
            { color: '#e67e22', hp: 3, reward: 10 },
            { color: '#e74c3c', hp: 4, reward: 15 },
            { color: '#2ecc71', hp: 5, reward: 20 },
            { color: '#1abc9c', hp: 6, reward: 25 },
            { color: '#3498db', hp: 7, reward: 30 },
            { color: '#2980b9', hp: 8, reward: 35 },
            { color: '#e056fd', hp: 9, reward: 40 },
            { color: '#9b59b6', hp: 10, reward: 50 }
        ];

        let balls = [];

        function spawnOrgBall() {
            balls.push({
                type: 'org',
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 2.5,
                color: 'orange',
                dx: 4,
                dy: -3.5,
                history: [],
                maxHistory: 12,
                active: true,
                dmg: 1,
                speedLv: 0,
                sizeLv: 0
            });
        }
        spawnOrgBall();

        const upgrades = [
            {
                id: 'org_speed',
                name: 'Org Ball: +1 Speed',
                category: 'org',
                cost: 50,
                costInc: 50,
                maxLevel: 5,
                level: 0,
                buy() {
                    if (gems >= this.cost && this.level < this.maxLevel) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'org') { b.dx *= 1.25; b.dy *= 1.25; b.speedLv = this.level; } });
                    }
                }
            },
            {
                id: 'org_size',
                name: 'Org Ball: Size',
                category: 'org',
                cost: 80,
                costInc: 80,
                maxLevel: 10,
                level: 0,
                buy() {
                    const maxRadius = pixelSize * 0.75;
                    if (gems >= this.cost && this.level < this.maxLevel) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { 
                            if(b.type === 'org') { 
                                b.radius = Math.min(maxRadius, 2.5 + (this.level * 0.3));
                                b.sizeLv = this.level;
                            } 
                        });
                    }
                }
            },
            {
                id: 'org_dmg',
                name: 'Org Ball: +1 DMG',
                category: 'org',
                cost: 100,
                costInc: 100,
                maxLevel: 20,
                level: 0,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'org') { b.dmg += 1; } });
                    }
                }
            },
            {
                id: 'buy_ert',
                name: 'Buy Ert Ball',
                category: 'unlock',
                cost: 50,
                costInc: 50,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        balls.push({
                            type: 'ert',
                            x: canvas.width / 2,
                            y: canvas.height / 2,
                            radius: 2.5 * (2/3),
                            color: '#f1c40f',
                            dx: 3.5,
                            dy: -3,
                            history: [],
                            maxHistory: 10,
                            active: true,
                            dpsBonus: 0,
                            maxTargets: 1,
                            speedLv: 0
                        });
                    }
                }
            },
            {
                id: 'ert_dmg',
                name: 'Ert Ball: +0.5 DMG',
                category: 'ert',
                cost: 100,
                costInc: 100,
                level: 0,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'ert') { b.dpsBonus += 0.5; } });
                    }
                }
            },
            {
                id: 'ert_targets',
                name: 'Ert Ball: 피격대상 추가',
                category: 'ert',
                cost: 500,
                costInc: 500,
                maxLevel: 9,
                level: 0,
                buy() {
                    if (gems >= this.cost && this.level < this.maxLevel) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'ert' && b.maxTargets < 10) { b.maxTargets++; } });
                    }
                }
            },
            {
                id: 'buy_cbl',
                name: 'Buy CBL Ball',
                category: 'unlock',
                cost: 100,
                costInc: 150,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        balls.push({
                            type: 'cbl',
                            x: canvas.width / 2,
                            y: canvas.height / 2,
                            radius: 3,
                            color: '#9b59b6',
                            dx: 3,
                            dy: -3,
                            history: [],
                            maxHistory: 10,
                            active: true,
                            gearsCount: 1,
                            gearDmg: 1,
                            gearDist: 25,
                            gearSize: 6,
                            gearAngle: 0,
                            gearSpeed: 0.05
                        });
                    }
                }
            },
            {
                id: 'cbl_gears',
                name: 'CBL: +1 톱니 (Max 6)',
                category: 'cbl',
                cost: 100,
                costInc: 100,
                level: 0,
                maxLevel: 5,
                buy() {
                    if (gems >= this.cost && this.level < this.maxLevel) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'cbl' && b.gearsCount < 6) { b.gearsCount++; } });
                    }
                }
            },
            {
                id: 'cbl_dmg',
                name: 'CBL: +1 DMG',
                category: 'cbl',
                cost: 100,
                costInc: 100,
                level: 0,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'cbl') { b.gearDmg += 1; } });
                    }
                }
            },
            {
                id: 'cbl_dist',
                name: 'CBL: 톱니 범위 증가',
                category: 'cbl',
                cost: 100,
                costInc: 100,
                level: 0,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'cbl') { b.gearDist += pixelSize; b.gearSize += 0.3; } });
                    }
                }
            },
            {
                id: 'cbl_gspeed',
                name: 'CBL: 톱니 속도 증가',
                category: 'cbl',
                cost: 150,
                costInc: 200,
                level: 0,
                buy() {
                    if (gems >= this.cost) {
                        gems -= this.cost;
                        this.cost += this.costInc;
                        this.level++;
                        balls.forEach(b => { if(b.type === 'cbl') { b.gearSpeed += 0.04; } });
                    }
                }
            }
        ];

        const pixelSize = 6;
        let pixels = [];
        let emptyLights = [];

        function initMap() {
            pixels = [];
            emptyLights = [];
            const cols = Math.floor(canvas.width / pixelSize);
            const rows = Math.floor(canvas.height / pixelSize);
            let grid = Array(rows).fill(0).map(() => Array(cols).fill(-1));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const px = c * pixelSize;
                    const py = r * pixelSize;
                    if (Math.hypot((px + pixelSize/2) - canvas.width/2, (py + pixelSize/2) - canvas.height/2) < 40) continue;

                    if (Math.random() < 0.008) {
                        grid[r][c] = 99;
                        continue;
                    }

                    let cumulative = 0;
                    for(let t = 0; t < tierConfig.length; t++) {
                        cumulative += (0.1 + (tierConfig.length - t) * 0.05);
                    }
                    let pickRand = Math.random() * cumulative;
                    let currentSum = 0;
                    let tier = 0;
                    for(let t = 0; t < tierConfig.length; t++) {
                        let weight = 0.1 + (tierConfig.length - t) * 0.05;
                        currentSum += weight;
                        if(pickRand <= currentSum) { tier = t; break; }
                    }
                    grid[r][c] = tier;
                }
            }

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let val = grid[r][c];
                    if (val === -1) continue;
                    let isBedrock = (val === 99);
                    let tier = isBedrock ? 0 : val;
                    let maxHp = isBedrock ? 99999 : (tierConfig[tier].hp + (currentFloor - 1));

                    pixels.push({
                        x: c * pixelSize,
                        y: r * pixelSize,
                        tier: tier,
                        hp: maxHp,
                        maxHp: maxHp,
                        isBedrock: isBedrock,
                        active: true
                    });
                }
            }
            totalBlocksInFloor = pixels.filter(p => !p.isBedrock).length;
            destroyedBlocksInFloor = 0;
        }

        initMap();

        let particles = [];
        function createParticles(x, y, color) {
            let count = Math.floor(Math.random() * 6) + 5;
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 1.5 + 1,
                    color: color,
                    alpha: 1,
                    decay: 0.05
                });
            }
        }

        function update() {
            balls.forEach(ball => {
                if (!ball.active) return;

                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > ball.maxHistory) ball.history.shift();

                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.x - ball.radius <= 0) { ball.x = ball.radius; ball.dx *= -1; }
                if (ball.x + ball.radius >= canvas.width) { ball.x = canvas.width - ball.radius; ball.dx *= -1; }
                if (ball.y - ball.radius <= 0) { ball.y = ball.radius; ball.dy *= -1; }
                if (ball.y + ball.radius >= canvas.height) { ball.y = canvas.height - ball.radius; ball.dy *= -1; }

                for (let i = 0; i < pixels.length; i++) {
                    let p = pixels[i];
                    if (!p.active) continue;

                    let bx = p.x, by = p.y, bw = pixelSize - 0.5, bh = pixelSize - 0.5;
                    let closestX = Math.max(bx, Math.min(ball.x, bx + bw));
                    let closestY = Math.max(by, Math.min(ball.y, by + bh));

                    if (Math.hypot(ball.x - closestX, ball.y - closestY) < ball.radius) {
                        let overlapX = ball.radius - Math.abs(ball.x - (bx + bw/2));
                        let overlapY = ball.radius - Math.abs(ball.y - (by + bh/2));
                        if (overlapX < overlapY) ball.dx *= -1; else ball.dy *= -1;

                        if (!p.isBedrock) {
                            let dmg = ball.type === 'org' ? ball.dmg : 1;
                            p.hp -= dmg;
                            if (p.hp <= 0) {
                                p.active = false;
                                destroyedBlocksInFloor++;
                                emptyLights.push({ x: bx + bw/2, y: by + bh/2 });
                                createParticles(bx + bw/2, by + bh/2, tierConfig[p.tier].color);
                                gems += tierConfig[p.tier].reward;
                            }
                        }
                        break;
                    }
                }

                // 노란공(ert) 레이저 공격 및 지속 데미지 (초당 0.1 틱당 0.1)
                if (ball.type === 'ert') {
                    let range = pixelSize * 5;
                    let validBlocks = pixels.filter(p => p.active && !p.isBedrock && Math.hypot(ball.x - (p.x + pixelSize/2), ball.y - (p.y + pixelSize/2)) <= range);
                    validBlocks.sort((a, b) => Math.hypot(ball.x - (a.x + pixelSize/2), ball.y - (a.y + pixelSize/2)) - Math.hypot(ball.x - (b.x + pixelSize/2), ball.y - (b.y + pixelSize/2)));

                    ball.activeTargets = validBlocks.slice(0, ball.maxTargets);
                    ball.activeTargets.forEach(p => {
                        p.hp -= (0.1 + ball.dpsBonus);
                        if (p.hp <= 0) {
                            p.active = false;
                            destroyedBlocksInFloor++;
