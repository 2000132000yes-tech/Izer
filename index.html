<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
        }
        canvas {
            background-color: #000000;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 모바일 전용 화면크기 처리 (화면의 폭과 높이 중 작은 쪽에 맞춘 정사각형)
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
        canvas.width = size;
        canvas.height = size;

        // 엄청 작은 픽셀 격자 설정 (예: 50x50 격자)
        const gridCount = 50; 
        const pixelSize = size / gridCount;

        const pixels = [];

        // 가운데 3x3 영역의 그리드 좌표 범위 계산
        const centerStart = Math.floor(gridCount / 2) - 1; // 가운데 3개 중 첫 번째 index
        const centerEnd = centerStart + 2;                 // 가운데 3개 중 마지막 index

        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                // 가운데 3x3 영역은 제외 (공백 처리)
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                pixels.push({
                    x: c * pixelSize,
                    y: r * pixelSize
                });
            }
        }

        function draw() {
            // 배경: 검은색
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 블록: 회색
            ctx.fillStyle = '#888888';
            for (let i = 0; i < pixels.length; i++) {
                // 픽셀 간 구분을 위해 약간의 간격(0.5px) 부여
                ctx.fillRect(pixels[i].x, pixels[i].y, pixelSize - 0.5, pixelSize - 0.5);
            }
        }

        draw();
    </script>
</body>
</html>
