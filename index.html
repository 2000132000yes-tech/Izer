<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            touch-action: none;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            pointer-events: none;
        }

        .currency-box {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
        }

        .diamond-icon {
            width: 12px;
            height: 12px;
            background-color: #00e5ff;
            transform: rotate(45deg);
            margin-right: 10px;
            box-shadow: 0 0 8px #00e5ff;
            flex-shrink: 0;
        }

        .plus-btn {
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: auto;
            outline: none;
        }

        .plus-btn:active {
            transform: scale(0.92);
            background: #333333;
        }

        .upgrade-panel {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 75%;
            background: rgba(15, 15, 15, 0.96);
            border-bottom: 2px solid #00e5ff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9);
            transition: top 0.4s ease;
            z-index: 200;
            padding: 16px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .upgrade-panel.active {
            top: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333333;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #00e5ff;
        }

        .panel-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .upgrade-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .upgrade-card {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-info {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }

        .orange-ball-icon {
            width: 14px;
            height: 14px;
            background-color: orange;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.9);
        }

        .upgrade-cost-btn {
            background: #00e5ff;
            color: #000000;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .upgrade-cost-btn:active {
            transform: scale(0.96);
        }

        .toggle-arrow-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #444444;
            color: #aaaaaa;
            width: 100%;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .toggle-arrow-btn:active {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* 접기/펼치기 서브 패널 레벨 */
        .sub-upgrade-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .sub-upgrade-container.open {
            display: flex;
        }

        .section-title {
            font-size: 13px;
            color: #888888;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- UI -->
        <div class="ui-layer">
            <div class="currency-box">
                <div class="diamond-icon"></div>
                <span class="gem-count-text">0</span>
            </div>
            <button class="plus-btn" id="openUpgradeBtn">+</button>
        </div>

        <!-- 슬라이드 업그레이드 창 -->
        <div class="upgrade-panel" id="upgradePanel">
            <div class="panel-header">
                <div class="panel-title">UPGRADES</div>
                <div class="panel-header-right">
                    <div class="currency-box" style="padding: 4px 10px; font-size: 15px;">
                        <div class="diamond-icon" style="width: 10px; height: 10px; margin-right: 6px;"></div>
                        <span class="gem-count-text">0</span>
                    </div>
                    <button class="close-btn" id="closeUpgradeBtn">✕</button>
                </div>
            </div>

            <div class="upgrade-list">
                <!-- 메인 개수 업그레이드 -->
                <div class="upgrade-card">
                    <div class="card-row">
                        <div class="upgrade-info">
                            +1 ball <span class="orange-ball-icon"></span>
                        </div>
                        <button class="upgrade-cost-btn" id="buyBallBtn">
                            <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                            <span id="ballCostText">10</span>
                        </button>
                    </div>
                    <button class="toggle-arrow-btn" id="toggleOrangeBallBtn">
                        <span id="arrowIcon">▼</span> 주황색 공 강화 옵션
                    </button>
                </div>

                <!-- 주황공 서브 강화 목록 (기본은 토글되어 안보임) -->
                <div class="sub-upgrade-container" id="orangeBallSubMenu">
                    <div class="section-title">
                        <span class="orange-ball-icon" style="margin-left:0;"></span> 주황색 공 전용 옵션
                    </div>

                    <!-- 속도 업그레이드 -->
                    <div class="upgrade-card">
                        <div class="card-row">
                            <div class="upgrade-info">+1 Speed</div>
                            <button class="upgrade-cost-btn" id="buySpeedBtn">
                                <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                                <span id="speedCostText">20</span>
                            </button>
                        </div>
                    </div>

                    <!-- 크기 업그레이드 -->
                    <div class="upgrade-card">
                        <div class="card-row">
                            <div class="upgrade-info">+0.5 size</div>
                            <button class="upgrade-cost-btn" id="buySizeBtn">
                                <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                                <span id="sizeCostText">50</span>
                            </button>
                        </div>
                    </div>

                    <!-- 블록 파괴 재화 증가 업그레이드 -->
                    <div class="upgrade-card">
                        <div class="card-row">
                            <div class="upgrade-info">+1 Block</div>
                            <button class="upgrade-cost-btn" id="buyBlockBtn">
                                <div class="diamond-icon" style="background:#000; box-shadow:none;"></div>
                                <span id="blockCostText">500</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gemCountTexts = document.querySelectorAll('.gem-count-text');
        
        const upgradePanel = document.getElementById('upgradePanel');
        const openUpgradeBtn = document.getElementById('openUpgradeBtn');
        const closeUpgradeBtn = document.getElementById('closeUpgradeBtn');
        const toggleOrangeBallBtn = document.getElementById('toggleOrangeBallBtn');
        const orangeBallSubMenu = document.getElementById('orangeBallSubMenu');
        const arrowIcon = document.getElementById('arrowIcon');

        const buyBallBtn = document.getElementById('buyBallBtn');
        const ballCostText = document.getElementById('ballCostText');
        const buySpeedBtn = document.getElementById('buySpeedBtn');
        const speedCostText = document.getElementById('speedCostText');
        const buySizeBtn = document.getElementById('buySizeBtn');
        const sizeCostText = document.getElementById('sizeCostText');
        const buyBlockBtn = document.getElementById('buyBlockBtn');
        const blockCostText = document.getElementById('blockCostText');

        let gems = 0;
        let ballCost = 10;
        let speedCost = 20;
        let sizeCost = 50;
        let blockCost = 500;

        let ballSpeedBonus = 0;
        let ballSizeBonus = 0;
        let gemsPerBlock = 1;

        function updateGemUI() {
            gemCountTexts.forEach(el => el.textContent = gems);
        }

        openUpgradeBtn.addEventListener('click', () => upgradePanel.classList.add('active'));
        closeUpgradeBtn.addEventListener('click', () => upgradePanel.classList.remove('active'));

        // 주황색 공 강화 옵션 토글 버튼 (화살표 눌렀을 때만 보이기/안보이기)
        toggleOrangeBallBtn.addEventListener('click', () => {
            const isOpen = orangeBallSubMenu.classList.toggle('open');
            arrowIcon.textContent = isOpen ? '▲' : '▼';
        });

        // Canvas 설정
        const size = Math.min(window.innerWidth, window.innerHeight);
        canvas.width = size;
        canvas.height = size;

        const gridCount = 50;
        const pixelSize = size / gridCount;

        // 시야/밝기 맵 (Light Map Array) - 초기엔 중앙만 밝음
        let lightMap = Array.from({ length: gridCount }, () => Array(gridCount).fill(false));

        const centerStart = Math.floor(gridCount / 2) - 1;
        const centerEnd = centerStart + 2;

        // 중앙 공백 및 시야 확보
        for (let r = centerStart - 1; r <= centerEnd + 1; r++) {
            for (let c = centerStart - 1; c <= centerEnd + 1; c++) {
                if (r >= 0 && r < gridCount && c >= 0 && c < gridCount) {
                    lightMap[r][c] = true;
                }
            }
        }

        let pixels = [];
        const particles = [];
        const balls = [];

        for (let r = 0; r < gridCount; r++) {
            for (let c = 0; c < gridCount; c++) {
                if (r >= centerStart && r <= centerEnd && c >= centerStart && c <= centerEnd) {
                    continue;
                }
                pixels.push({
                    r: r,
                    c: c,
                    x: c * pixelSize,
                    y: r * pixelSize
                });
            }
        }

        function createBall() {
            const angle = Math.random() * Math.PI * 2;
            // 속도와 크기 증가 폭 수정
            const baseSpeed = pixelSize * 0.22 + (ballSpeedBonus * pixelSize * 0.12);
            const currentRadius = pixelSize * 0.35 + (ballSizeBonus * pixelSize * 0.12);

            balls.push({
                x: (centerStart + 1.5) * pixelSize,
                y: (centerStart + 1.5) * pixelSize,
                radius: currentRadius,
                dx: Math.cos(angle) * baseSpeed,
                dy: Math.sin(angle) * baseSpeed,
                color: 'orange',
                history: []
            });
        }

        createBall();

        // 1. +1 ball
        buyBallBtn.addEventListener('click', () => {
            if (gems >= ballCost) {
                gems -= ballCost;
                ballCost += 10;
                ballCostText.textContent = ballCost;
                updateGemUI();
                createBall();
            }
        });

        // 2. +1 Speed (속도 대폭 체감 증가)
        buySpeedBtn.addEventListener('click', () => {
            if (gems >= speedCost) {
                gems -= speedCost;
                speedCost += 20;
                speedCostText.textContent = speedCost;
                ballSpeedBonus += 1;
                updateGemUI();

                balls.forEach(ball => {
                    const currentAngle = Math.atan2(ball.dy, ball.dx);
                    const newSpeed = pixelSize * 0.22 + (ballSpeedBonus * pixelSize * 0.12);
                    ball.dx = Math.cos(currentAngle) * newSpeed;
                    ball.dy = Math.sin(currentAngle) * newSpeed;
                });
            }
        });

        // 3. +0.5 size (크기 증가폭 적절 보정)
        buySizeBtn.addEventListener('click', () => {
            if (gems >= sizeCost) {
                gems -= sizeCost;
                sizeCost += 50;
                sizeCostText.textContent = sizeCost;
                ballSizeBonus += 0.5;
                updateGemUI();

                balls.forEach(ball => {
                    ball.radius = pixelSize * 0.35 + (ballSizeBonus * pixelSize * 0.12);
                });
            }
        });

        // 4. +1 Block
        buyBlockBtn.addEventListener('click', () => {
            if (gems >= blockCost) {
                gems -= blockCost;
                blockCost += 500;
                blockCostText.textContent = blockCost;
                gemsPerBlock += 1;
                updateGemUI();
            }
        });

        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    size: pixelSize * 0.3,
                    alpha: 1,
                    life: 0.05
                });
            }
        }

        // 블록 부술 때 주변 빛(밝아짐) 시야 전개 함수
        function revealLight(row, col) {
            const revealRadius = 2; // 파괴 시 주변 2칸 시야 밝힘
            for (let r = row - revealRadius; r <= row + revealRadius; r++) {
                for (let c = col - revealRadius; c <= col + revealRadius; c++) {
                    if (r >= 0 && r < gridCount && c >= 0 && c < gridCount) {
                        lightMap[r][c] = true;
                    }
                }
            }
        }

        function update() {
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                ball.history.push({ x: ball.x, y: ball.y });
                if (ball.history.length > 8) {
                    ball.history.shift();
                }

                let nextX = ball.x + ball.dx;
                let nextY = ball.y + ball.dy;

                if (nextX - ball.radius < 0 || nextX + ball.radius > canvas.width) {
                    ball.dx = -ball.dx;
                    nextX = ball.x + ball.dx;
                }
                if (nextY - ball.radius < 0 || nextY + ball.radius > canvas.height) {
                    ball.dy = -ball.dy;
                    nextY = ball.y + ball.dy;
                }

                for (let i = pixels.length - 1; i >= 0; i--) {
                    const p = pixels[i];

                    const closestX = Math.max(p.x, Math.min(nextX, p.x + pixelSize));
                    const closestY = Math.max(p.y, Math.min(nextY, p.y + pixelSize));

                    const distX = nextX - closestX;
                    const distY = nextY - closestY;
                    const distance = Math.hypot(distX, distY);

                    if (distance < ball.radius) {
                        createParticles(p.x + pixelSize / 2, p.y + pixelSize / 2);
                        
                        // 부순 위치 주변 시야(빛) 확보
                        revealLight(p.r, p.c);

                        pixels.splice(i, 1);

                        gems += gemsPerBlock;
                        updateGemUI();

                        if (Math.abs(distX) > Math.abs(distY)) {
                            ball.dx = -ball.dx;
                        } else {
                            ball.dy = -ball.dy;
                        }
                        break;
                    }
                }

                ball.x += ball.dx;
                ball.y += ball.dy;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.x += pt.dx;
                pt.y += pt.dy;
                pt.alpha -= pt.life;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            // 바탕 칠하기
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 회색 블록 그리기 (시야 내부/외부 다르게 렌더링)
            for (let i = 0; i < pixels.length; i++) {
                const p = pixels[i];
                if (lightMap[p.r][p.c]) {
                    ctx.fillStyle = '#777777'; // 부숴진 시야 근처의 그려질 블록 (밝음)
                } else {
                    ctx.fillStyle = '#181818'; // 시야 확보 전 캄캄한 상태의 블록
                }
                ctx.fillRect(p.x, p.y, pixelSize - 0.5, pixelSize - 0.5);
            }

            // 2. 파티클
            for (let i = 0; i < particles.length; i++) {
                const pt = particles[i];
                ctx.fillStyle = `rgba(255, 165, 0, ${pt.alpha})`;
                ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
            }

            // 3. 공 & 광원(Glow) 및 잔상
            for (let b = 0; b < balls.length; b++) {
                const ball = balls[b];

                // 잔상
                for (let i = 0; i < ball.history.length; i++) {
                    const pos = ball.history[i];
                    const alpha = (i + 1) / ball.history.length;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 140, 0, ${alpha * 0.35})`;
                    ctx.fill();
                    ctx.closePath();
                }

                // 공 주변 광원 효과 (Glow)
                const glowGradient = ctx.createRadialGradient(
                    ball.x, ball.y, ball.radius * 0.2,
                    ball.x, ball.y, ball.radius * 3.5
                );
                glowGradient.addColorStop(0, 'rgba(255, 165, 0, 0.8)');
                glowGradient.addColorStop(0.4, 'rgba(255, 140, 0, 0.25)');
                glowGradient.addColorStop(1, 'rgba(255, 140, 0, 0)');

                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius * 3.5, 0, Math.PI * 2);
                ctx.fillStyle = glowGradient;
                ctx.fill();
                ctx.closePath();

                // 실제 공
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffaa00';
                ctx.fill();
                ctx.closePath();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
