<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>발로란트 스타일 탑다운 슈팅 게임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 600px;
            background-color: #bda07b;
            border: 3px solid #222;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        canvas {
            display: block;
        }
        /* UI 레이어 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        /* 상단 스테이지 및 크레딧 바 */
        #top-bar {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }
        .stage-diamond {
            width: 34px;
            height: 34px;
            background: #fff;
            border: 2px solid #111;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .stage-number {
            transform: rotate(-45deg);
            font-size: 15px;
            font-weight: bold;
            color: #111;
        }
        #credit-display {
            background: rgba(15, 25, 35, 0.85);
            border: 1px solid #ff4655;
            color: #ece8e1;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        /* 시작 버튼 */
        #start-btn {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 24px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            background: #ff4655;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 10px rgba(255,70,85,0.4);
            transition: background 0.2s;
        }
        #start-btn:hover { background: #e03e4d; }
        #start-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        /* 카드 덱 */
        #deck-area {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 65px;
            height: 70px;
            background: #0f1923;
            border: 2px solid #ff4655;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            font-weight: bold;
            font-size: 12px;
            color: #ece8e1;
        }
        #deck-area.disabled { opacity: 0.4; cursor: not-allowed; }

        /* 카드 선택 팝업 */
        #card-container {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }
        .card {
            width: 92px;
            height: 130px;
            background: #0f1923;
            border: 2px solid #ece8e1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            animation: drawCard 0.25s ease-out forwards;
            color: #ece8e1;
        }
        .card:hover { border-color: #ff4655; }
        .card-title { font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #ff4655; }
        .card-value { font-size: 14px; font-weight: bold; }
        @keyframes drawCard {
            0% { opacity: 0; transform: translateY(30px) scale(0.7); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 발로란트 승리/패배 메인 배너 UI */
        #result-banner {
            position: absolute;
            top: 70px;
            left: 0;
            width: 100%;
            padding: 12px 0;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 25, 35, 0.92);
            border-top: 2px solid #ff4655;
            border-bottom: 2px solid #ff4655;
            animation: bannerSlide 0.4s ease-out forwards;
        }
        .banner-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .banner-title.won { color: #00f0ff; }
        .banner-title.lost { color: #ff4655; }
        .banner-reward {
            font-size: 13px;
            font-weight: bold;
            color: #2ecc71;
            margin-top: 4px;
        }
        @keyframes bannerSlide {
            0% { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 플로팅 데미지/회복 텍스트 */
        .damage-text {
            position: absolute;
            font-weight: bold;
            font-size: 13px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        .damage-text.normal { color: #ffffff; text-shadow: 0 0 3px #000; }
        .damage-text.headshot { color: #ff4655; font-size: 17px; text-shadow: 0 0 5px #000; }
        .damage-text.heal { color: #2ecc71; font-size: 12px; text-shadow: 0 0 3px #000; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -28px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="360" height="600"></canvas>
    
    <div id="ui-layer">
        <div id="top-bar">
            <div class="stage-diamond">
                <div class="stage-number" id="stage-num">1</div>
            </div>
            <div id="credit-display">크레딧: 0원</div>
        </div>

        <button id="start-btn" disabled>라운드 시작</button>
        <div id="deck-area"><span>DECK</span></div>
        <div id="card-container"></div>

        <!-- 발로란트 승패 알림 배너 -->
        <div id="result-banner">
            <div class="banner-title" id="banner-title">ROUND WON</div>
            <div class="banner-reward" id="banner-reward">+3200 크레딧</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 사운드 시스템
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playGunSound(gunType) {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    if (gunType === 'SHERIFF') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.22);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
    } else if (gunType === 'GHOST') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    } else {
        osc.type = 'square';
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.14);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
    }

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.22);
}

// 게임 상태 및 자금 관련 변수
let stage = 1;
let credits = 0;
let roundKills = 0;
let gameState = 'PREPARE';
let cardDrawn = false;
let myHeadshotProb = 0.10;
let enemyHeadshotProb = 0.10;
let shakeTime = 0;

// 총기 설정
const GUNS = {
    CLASSIC: { name: '클래식', bodyDmg: 22, headDmg: 65, speed: 12, cooldown: 40, type: 'CLASSIC' },
    GHOST: { name: '고스트', bodyDmg: 45, headDmg: 95, speed: 15, cooldown: 30, type: 'GHOST' },
    SHERIFF: { name: '셰리프', bodyDmg: 65, headDmg: 145, speed: 17, cooldown: 52, type: 'SHERIFF' }
};

// 개체 및 지형
let obstacles = [];
let grassDetails = [];
let rockDetails = [];
let allies = [];
let enemies = [];
let bullets = [];
let particles = [];

// UI
const stageNumEl = document.getElementById('stage-num');
const creditDisplayEl = document.getElementById('credit-display');
const startBtn = document.getElementById('start-btn');
const deckArea = document.getElementById('deck-area');
const cardContainer = document.getElementById('card-container');
const resultBanner = document.getElementById('result-banner');
const bannerTitle = document.getElementById('banner-title');
const bannerReward = document.getElementById('banner-reward');

// --- Entity 클래스 ---

class Entity {
    constructor(x, y, isEnemy, gun) {
        this.x = x;
        this.y = y;
        this.radius = 9; // 유닛 크기 축소 (기존 13 -> 9)
        this.isEnemy = isEnemy;
        this.maxHp = isEnemy ? 140 + (stage - 1) * 25 : 150;
        this.hp = this.maxHp;
        this.gun = gun;
        
        // 이동 및 각도 (사람처럼 부드러운 가속도)
        this.vx = 0;
        this.vy = 0;
        this.angle = 0;
        this.targetAngle = 0;
        this.maxSpeed = 1.45;
        this.shootCooldown = 0;

        // AI 행동 상태 및 탐색
        this.aiState = 'SEARCH';
        this.target = null;
        this.lastEnemyPos = null;
        this.sightRange = 220;

        // 지능형 엄폐 및 회복
        this.coverPoint = null;
        this.healTimer = 0;
        this.patrolAngle = Math.random() * Math.PI * 2;
        this.patrolTimer = 0;
    }

    update() {
        if (this.hp <= 0) return;
        if (this.shootCooldown > 0) this.shootCooldown--;

        const myTeam = this.isEnemy ? enemies : allies;
        const opponentTeam = this.isEnemy ? allies : enemies;

        const aliveOpponents = opponentTeam.filter(e => e.hp > 0);
        const aliveTeammates = myTeam.filter(e => e.hp > 0);

        // 팀 체력 비율 계산 (지능형 교전 판단)
        const teamTotalHp = aliveTeammates.reduce((acc, cur) => acc + cur.hp, 0);
        const opponentTotalHp = aliveOpponents.reduce((acc, cur) => acc + cur.hp, 0);

        // 시야 내 적 감지
        let visibleTarget = null;
        let minDist = Infinity;

        for (let opp of aliveOpponents) {
            let d = Math.hypot(opp.x - this.x, opp.y - this.y);
            if (d < this.sightRange && d < minDist) {
                if (hasLineOfSight(this.x, this.y, opp.x, opp.y)) {
                    minDist = d;
                    visibleTarget = opp;
                }
            }
        }

        // 지능형 전략 상태 판단
        if (this.hp < this.maxHp * 0.35 && (teamTotalHp < opponentTotalHp || aliveTeammates.length < aliveOpponents.length)) {
            // 체력이 낮고 팀 상황이 불리하면 엄폐 및 후퇴 회복
            this.aiState = 'RETREAT_HEAL';
        } else if (visibleTarget) {
            this.aiState = 'ENGAGE';
            this.target = visibleTarget;
            this.lastEnemyPos = { x: visibleTarget.x, y: visibleTarget.y };

            // 주변 아군에게 적 위치 전파 (협동 공격)
            aliveTeammates.forEach(mate => {
                if (mate !== this && mate.aiState === 'SEARCH') {
                    mate.aiState = 'CHASE';
                    mate.lastEnemyPos = { x: visibleTarget.x, y: visibleTarget.y };
                }
            });
        } else if (this.lastEnemyPos) {
            this.aiState = 'CHASE';
        } else {
            this.aiState = 'SEARCH';
        }

        // 상태별 실행
        if (this.aiState === 'RETREAT_HEAL') {
            this.executeRetreatAndHeal();
        } else if (this.aiState === 'ENGAGE' && this.target) {
            this.targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);

            if (minDist > 100) {
                this.moveInAngle(this.targetAngle);
            } else {
                // 부드러운 교전 스트레이핑
                let strafe = this.targetAngle + (Math.sin(Date.now() / 200) > 0 ? 1.2 : -1.2);
                this.moveInAngle(strafe);

                if (this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = this.gun.cooldown;
                }
            }
        } else if (this.aiState === 'CHASE' && this.lastEnemyPos) {
            let chaseAng = Math.atan2(this.lastEnemyPos.y - this.y, this.lastEnemyPos.x - this.x);
            this.targetAngle = chaseAng;
            this.moveInAngle(chaseAng);

            if (Math.hypot(this.lastEnemyPos.x - this.x, this.lastEnemyPos.y - this.y) < 25) {
                this.lastEnemyPos = null;
            }
        } else {
            // 자연스러운 탐색
            this.patrolTimer--;
            if (this.patrolTimer <= 0) {
                this.patrolAngle += (Math.random() - 0.5) * 1.5;
                this.patrolTimer = 30 + Math.floor(Math.random() * 40);
            }
            this.targetAngle = this.patrolAngle;
            this.moveInAngle(this.patrolAngle);
        }

        // 부드러운 회전 보간
        this.angle += (this.targetAngle - this.angle) * 0.15;

        // 관성 이동 업데이트
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.82;
        this.vy *= 0.82;

        // 벽 및 개체 간 완벽 밀림 처리 (끼임 해결)
        this.resolveWallAndUnitCollisions();
    }

    executeRetreatAndHeal() {
        if (!this.coverPoint) {
            let bestObs = null;
            let maxDist = 0;
            for (let obs of obstacles) {
                let d = Math.hypot((obs.x + obs.w/2) - this.x, (obs.y + obs.h/2) - this.y);
                if (d > maxDist) {
                    maxDist = d;
                    bestObs = obs;
                }
            }
            if (bestObs) {
                this.coverPoint = { x: bestObs.x + bestObs.w/2, y: bestObs.y + bestObs.h/2 };
            }
        }

        if (this.coverPoint) {
            let ang = Math.atan2(this.coverPoint.y - this.y, this.coverPoint.x - this.x);
            this.targetAngle = ang;
            this.moveInAngle(ang);

            // 엄폐 구역 도착 시 회복
            if (Math.hypot(this.coverPoint.x - this.x, this.coverPoint.y - this.y) < 35) {
                this.healTimer++;
                if (this.healTimer % 35 === 0 && this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + 15);
                    showDamageText(this.x, this.y - 10, 15, false, true);
                    if (this.hp >= this.maxHp * 0.85) {
                        this.aiState = 'SEARCH';
                        this.coverPoint = null;
                    }
                }
            }
        }
    }

    moveInAngle(ang) {
        let desiredVx = Math.cos(ang) * this.maxSpeed;
        let desiredVy = Math.sin(ang) * this.maxSpeed;

        this.vx += (desiredVx - this.vx) * 0.2;
        this.vy += (desiredVy - this.vy) * 0.2;
    }

    resolveWallAndUnitCollisions() {
        // 벽 슬라이딩 및 밀림 (끼임 완전 방지)
        for (let obs of obstacles) {
            let closestX = Math.max(obs.x, Math.min(this.x, obs.x + obs.w));
            let closestY = Math.max(obs.y, Math.min(this.y, obs.y + obs.h));

            let dx = this.x - closestX;
            let dy = this.y - closestY;
            let dist = Math.hypot(dx, dy);

            if (dist < this.radius + 1) {
                let overlap = (this.radius + 1) - dist;
                if (dist === 0) { dx = 1; dy = 0; dist = 1; }
                
                this.x += (dx / dist) * overlap;
                this.y += (dy / dist) * overlap;
                
                this.vx *= 0.5;
                this.vy *= 0.5;
            }
        }

        // 유닛 상호 밀림
        const allEntities = [...allies, ...enemies].filter(e => e !== this && e.hp > 0);
        for (let other of allEntities) {
            let dx = this.x - other.x;
            let dy = this.y - other.y;
            let dist = Math.hypot(dx, dy);
            let minDist = this.radius + other.radius + 2;

            if (dist < minDist && dist > 0) {
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;
                this.x += nx * overlap * 0.5;
                this.y += ny * overlap * 0.5;
            }
        }

        // 맵 화면 경계 제한
        this.x = Math.max(this.radius + 3, Math.min(canvas.width - this.radius - 3, this.x));
        this.y = Math.max(this.radius + 3, Math.min(canvas.height - this.radius - 3, this.y));
    }

    shoot() {
        let handX = this.x + Math.cos(this.angle + 0.4) * 10;
        let handY = this.y + Math.sin(this.angle + 0.4) * 10;

        bullets.push(new Bullet(handX, handY, this.angle, this.gun, this.isEnemy));
        shakeTime = 3;
        playGunSound(this.gun.type);
    }

    draw() {
        if (this.hp <= 0) return;

        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (this.isEnemy) {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#922b21';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        } else {
            // 아군 제트 (개선된 백발 머리카락 연출)
            ctx.fillStyle = '#2980b9';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1b4f72';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 백발
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-1, 0, this.radius * 0.75, 0, Math.PI * 2);
            ctx.fill();

            // 민트색 꽁지
            ctx.fillStyle = '#a3e4d7';
            ctx.beginPath();
            ctx.moveTo(-this.radius * 0.8, -3);
            ctx.lineTo(-this.radius * 1.5, 0);
            ctx.lineTo(-this.radius * 0.8, 3);
            ctx.closePath();
            ctx.fill();
        }

        // 우측 손 총기
        ctx.save();
        ctx.translate(5, 5);
        ctx.fillStyle = '#2c3e50';
        if (this.gun === GUNS.CLASSIC) {
            ctx.fillRect(0, -1.5, 7, 3);
        } else if (this.gun === GUNS.GHOST) {
            ctx.fillRect(0, -1.5, 6, 3);
            ctx.fillStyle = '#111';
            ctx.fillRect(6, -1.5, 8, 3);
        } else if (this.gun === GUNS.SHERIFF) {
            ctx.fillRect(0, -1.5, 5, 3);
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(1, -2.5, 4, 5);
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(5, -1.5, 7, 3);
        }
        ctx.restore();

        ctx.restore();

        this.drawUI();
    }

    drawUI() {
        const barW = 26;
        const barH = 3.5;
        const barX = this.x - barW / 2;
        const barY = this.y - this.radius - 10;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(barX, barY, barW, barH);

        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = this.isEnemy ? '#e74c3c' : '#2ecc71';
        ctx.fillRect(barX, barY, barW * hpPercent, barH);

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(barX, barY, barW, barH);
    }
}

class Bullet {
    constructor(x, y, angle, gun, isEnemy) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.gun = gun;
        this.isEnemy = isEnemy;
        this.speed = gun.speed;
        this.active = true;
    }

    update() {
        if (!this.active) return;

        let nextX = this.x + Math.cos(this.angle) * this.speed;
        let nextY = this.y + Math.sin(this.angle) * this.speed;

        if (checkObstacleCollision(nextX, nextY, 1.5)) {
            this.active = false;
            return;
        }

        this.x = nextX;
        this.y = nextY;

        const targets = this.isEnemy ? allies : enemies;
        for (let target of targets) {
            if (target.hp > 0 && Math.hypot(target.x - this.x, target.y - this.y) < target.radius) {
                this.hit(target);
                this.active = false;
                break;
            }
        }

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
            this.active = false;
        }
    }

    hit(target) {
        let prob = this.isEnemy ? enemyHeadshotProb : myHeadshotProb;
        let isHead = Math.random() < prob;
        let damage = isHead ? this.gun.headDmg : this.gun.bodyDmg;

        target.hp -= damage;
        showDamageText(target.x, target.y - 10, damage, isHead);

        if (target.hp <= 0) {
            if (!this.isEnemy) roundKills++; // 처치 수 카운트
            explode(target.x, target.y, target.isEnemy);
        }
    }

    draw() {
        if (!this.active) return;
        ctx.save();
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - Math.cos(this.angle) * 6, this.y - Math.sin(this.angle) * 6);
        ctx.stroke();
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = (Math.random() - 0.5) * 4;
        this.life = 18;
        this.maxLife = 18;
        this.size = Math.random() * 2.5 + 1;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// --- 보조 함수 ---

function checkObstacleCollision(x, y, r) {
    for (let obs of obstacles) {
        if (x + r > obs.x && x - r < obs.x + obs.w &&
            y + r > obs.y && y - r < obs.y + obs.h) {
            return true;
        }
    }
    return false;
}

function hasLineOfSight(x1, y1, x2, y2) {
    let steps = 10;
    for (let i = 0; i <= steps; i++) {
        let px = x1 + (x2 - x1) * (i / steps);
        let py = y1 + (y2 - y1) * (i / steps);
        if (checkObstacleCollision(px, py, 1.5)) return false;
    }
    return true;
}

function initMap() {
    obstacles = [];
    const count = 4 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
        let w = 40 + Math.random() * 30;
        let h = 40 + Math.random() * 30;
        let x = 25 + Math.random() * (canvas.width - w - 50);
        let y = 110 + Math.random() * (canvas.height - h - 220);
        obstacles.push({ x, y, w, h });
    }

    grassDetails = [];
    for (let i = 0; i < 20; i++) {
        grassDetails.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height });
    }

    rockDetails = [];
    for (let i = 0; i < 12; i++) {
        rockDetails.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: 2 + Math.random() * 2 });
    }
}

function drawEnvironment() {
    ctx.strokeStyle = '#8daa73';
    ctx.lineWidth = 1;
    for (let g of grassDetails) {
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.lineTo(g.x - 2, g.y - 4);
        ctx.stroke();
    }

    ctx.fillStyle = '#9e8579';
    for (let r of rockDetails) {
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fill();
    }

    for (let obs of obstacles) {
        ctx.fillStyle = '#6d4c41';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#4e342e';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }
}

function updateCreditDisplay() {
    creditDisplayEl.innerText = `크레딧: ${credits.toLocaleString()}원`;
}

function initRound() {
    stageNumEl.innerText = stage;
    updateCreditDisplay();

    bullets = [];
    particles = [];
    roundKills = 0;
    cardDrawn = false;
    deckArea.classList.remove('disabled');
    startBtn.disabled = true;
    cardContainer.innerHTML = '';
    resultBanner.style.display = 'none';
    gameState = 'PREPARE';

    initMap();
    enemyHeadshotProb = 0.10 + (stage - 1) * 0.025;

    // 아군 세팅
    if (allies.length === 0) {
        allies = [
            new Entity(100, 520, false, GUNS.CLASSIC),
            new Entity(260, 520, false, GUNS.CLASSIC)
        ];
    } else {
        let spacing = canvas.width / (allies.length + 1);
        allies.forEach((a, idx) => {
            a.hp = a.maxHp;
            a.x = spacing * (idx + 1);
            a.y = 520;
            a.vx = 0; a.vy = 0;
        });
    }

    // 적 세팅
    enemies = [];
    const gunKeys = Object.keys(GUNS);
    let enemyCount = stage;
    let spacing = canvas.width / (enemyCount + 1);

    for (let i = 0; i < enemyCount; i++) {
        let randomGun = GUNS[gunKeys[Math.floor(Math.random() * gunKeys.length)]];
        enemies.push(new Entity(spacing * (i + 1), 60, true, randomGun));
    }
}

function showDamageText(x, y, damage, isHead, isHeal = false) {
    const el = document.createElement('div');
    el.className = `damage-text ${isHeal ? 'heal' : (isHead ? 'headshot' : 'normal')}`;
    el.innerText = isHeal ? `+${damage}` : (isHead ? `HEAD! -${damage}` : `-${damage}`);
    
    const rect = canvas.getBoundingClientRect();
    el.style.left = `${rect.left + x}px`;
    el.style.top = `${rect.top + y}px`;

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function explode(x, y, isEnemy) {
    const color = isEnemy ? '#e74c3c' : '#00e5ff';
    for (let i = 0; i < 18; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function drawCards() {
    if (cardDrawn || gameState !== 'PREPARE') return;
    cardDrawn = true;
    deckArea.classList.add('disabled');

    cardContainer.innerHTML = '';

    for (let i = 0; i < 3; i++) {
        let isSummonCard = Math.random() < 0.25;

        const card = document.createElement('div');
        card.className = 'card';

        if (isSummonCard) {
            card.innerHTML = `
                <div class="card-title">지원 요청</div>
                <div class="card-value" style="color: #00f0ff;">+아군 1명</div>
            `;
            card.onclick = () => {
                let spawnX = 60 + Math.random() * 240;
                allies.push(new Entity(spawnX, 520, false, GUNS.CLASSIC));
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        } else {
            let boost = Math.floor(Math.random() * 10) + 1;
            card.innerHTML = `
                <div class="card-title">헤드샷 강화</div>
                <div class="card-value">+${boost}%</div>
            `;
            card.onclick = () => {
                myHeadshotProb += boost / 100;
                cardContainer.innerHTML = '';
                startBtn.disabled = false;
            };
        }

        cardContainer.appendChild(card);
    }
}

// --- 이벤트 ---

deckArea.addEventListener('click', drawCards);

startBtn.addEventListener('click', () => {
    if (gameState === 'PREPARE' && cardDrawn) {
        gameState = 'BATTLE';
        startBtn.disabled = true;
    }
});

// --- 루프 ---

function gameLoop() {
    ctx.save();

    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * 4;
        let dy = (Math.random() - 0.5) * 4;
        ctx.translate(dx, dy);
        shakeTime--;
    }

    ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);

    drawEnvironment();

    if (gameState === 'BATTLE') {
        allies.forEach(a => a.update());
        enemies.forEach(e => e.update());
        bullets.forEach(b => b.update());
    }

    particles.forEach(p => p.update());

    bullets = bullets.filter(b => b.active);
    particles = particles.filter(p => p.life > 0);

    allies.forEach(a => a.draw());
    enemies.forEach(e => e.draw());
    bullets.forEach(b => b.draw());
    particles.forEach(p => p.draw());

    ctx.restore();

    if (gameState === 'BATTLE') {
        const aliveAllies = allies.filter(a => a.hp > 0);
        const aliveEnemies = enemies.filter(e => e.hp > 0);

        if (aliveEnemies.length === 0) {
            // 승리
            gameState = 'WAIT';

            // 크레딧 상금 계산: 최소 2900원 + 라운드 비례(100원*라운드) + 처치수 * 300원
            let baseReward = 2900 + (stage * 100);
            let killReward = roundKills * 300;
            let totalReward = baseReward + killReward;
            credits += totalReward;

            bannerTitle.innerText = "ROUND WON";
            bannerTitle.className = "banner-title won";
            bannerReward.innerText = `라운드 승리 +${totalReward.toLocaleString()}원`;
            resultBanner.style.display = "flex";

            stage++;
            setTimeout(() => {
                initRound();
            }, 2200);
        } else if (aliveAllies.length === 0) {
            // 패배
            gameState = 'WAIT';

            // 패배 위로금 (최소 1900원 + 처치 수 상금)
            let totalReward = 1900 + (roundKills * 300);
            credits += totalReward;

            bannerTitle.innerText = "ROUND LOST";
            bannerTitle.className = "banner-title lost";
            bannerReward.innerText = `라운드 패배 +${totalReward.toLocaleString()}원`;
            resultBanner.style.display = "flex";

            // 이전 라운드로 하강 (최하 1라운드)
            stage = Math.max(1, stage - 1);
            allies = [];

            setTimeout(() => {
                initRound();
            }, 2200);
        }
    }

    requestAnimationFrame(gameLoop);
}

// 초기 구동
initRound();
gameLoop();
</script>
