<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Tactical AI FPS Spectator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
      width: 92%;
      max-width: 400px;
    }
    .score-card {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      color: white;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }
    .red { background: rgba(220, 53, 69, 0.9); }
    .blue { background: rgba(13, 110, 253, 0.9); }
    .status { font-size: 11px; margin-top: 2px; opacity: 0.95; }
    .score { font-size: 16px; margin-top: 2px; }
    #controls {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.85);
      border: none;
      color: #111;
      font-weight: bold;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .btn:active { background: rgba(255, 255, 255, 1); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <div class="score-card red">
      <div>AI RED</div>
      <div id="hp-red">HP: 100</div>
      <div id="state-red" class="status">상태: 탐색 중</div>
      <div id="score-red" class="score">0 Kills</div>
    </div>
    <div class="score-card blue">
      <div>AI BLUE</div>
      <div id="hp-blue">HP: 100</div>
      <div id="state-blue" class="status">상태: 탐색 중</div>
      <div id="score-blue" class="score">0 Kills</div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" onclick="setCamView('top')">전체 관전</button>
    <button class="btn" onclick="setCamView('red')">RED 시점</button>
    <button class="btn" onclick="setCamView('blue')">BLUE 시점</button>
  </div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // 밝은 하늘색 배경

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 밝은 조명 설정
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(15, 30, 15);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); // 전체적으로 화사하게
    scene.add(ambientLight);

    // 맵 크기 축소 (32x32 크기로 줄여 한눈에 들어오도록 조정)
    const MAP_SIZE = 32;
    const GRID_SIZE = 16;
    const CELL_SIZE = MAP_SIZE / GRID_SIZE;
    const BOT_RADIUS = 0.6; // AI 충돌 반지름

    // 밝은 톤의 바닥
    const floorGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 바닥 테두리 벽 (AI가 맵 밖으로 나가거나 카메라 벗어나는 것 방지)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x999999 });
    function createBoundaryWall(x, z, w, d) {
      const geo = new THREE.BoxGeometry(w, 2, d);
      const mesh = new THREE.Mesh(geo, wallMat);
      mesh.position.set(x, 1, z);
      scene.add(mesh);
    }
    createBoundaryWall(0, -MAP_SIZE / 2, MAP_SIZE, 0.5);
    createBoundaryWall(0, MAP_SIZE / 2, MAP_SIZE, 0.5);
    createBoundaryWall(-MAP_SIZE / 2, 0, 0.5, MAP_SIZE);
    createBoundaryWall(MAP_SIZE / 2, 0, 0.5, MAP_SIZE);

    function worldToGrid(x, z) {
      const gx = Math.floor((x + MAP_SIZE / 2) / CELL_SIZE);
      const gz = Math.floor((z + MAP_SIZE / 2) / CELL_SIZE);
      return {
        x: Math.max(0, Math.min(GRID_SIZE - 1, gx)),
        z: Math.max(0, Math.min(GRID_SIZE - 1, gz))
      };
    }

    function gridToWorld(gx, gz) {
      return {
        x: (gx + 0.5) * CELL_SIZE - MAP_SIZE / 2,
        z: (gz + 0.5) * CELL_SIZE - MAP_SIZE / 2
      };
    }

    // 장애물 (엄폐물) 및 정확한 AABB 충돌 데이터 박스 생성
    const obstacles = [];
    const obstacleBoxes = [];

    function createObstacle(x, z, w, h, d) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: 0x4a6b82, roughness: 0.4 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      obstacles.push(mesh);
      // 충돌 바운딩 박스 보정
      obstacleBoxes.push({
        minX: x - w / 2 - BOT_RADIUS,
        maxX: x + w / 2 + BOT_RADIUS,
        minZ: z - d / 2 - BOT_RADIUS,
        maxZ: z + d / 2 + BOT_RADIUS
      });
    }

    // 콤팩트한 지형 배치
    createObstacle(0, 0, 6, 3, 6);
    createObstacle(-7, -6, 4, 2.5, 4);
    createObstacle(7, 6, 4, 2.5, 4);
    createObstacle(-6, 7, 3, 2.5, 6);
    createObstacle(6, -7, 3, 2.5, 6);

    // A* 길찾기
    function findPath(startPos, targetPos, memoryGrid) {
      const start = worldToGrid(startPos.x, startPos.z);
      const target = worldToGrid(targetPos.x, targetPos.z);

      const openList = [];
      const closedList = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
      const parent = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));

      const gScore = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(Infinity));
      const fScore = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(Infinity));

      gScore[start.x][start.z] = 0;
      fScore[start.x][start.z] = Math.hypot(target.x - start.x, target.z - start.z);

      openList.push(start);

      while (openList.length > 0) {
        openList.sort((a, b) => fScore[a.x][a.z] - fScore[b.x][b.z]);
        const current = openList.shift();

        if (current.x === target.x && current.z === target.z) {
          const path = [];
          let curr = current;
          while (curr) {
            path.push(gridToWorld(curr.x, curr.z));
            curr = parent[curr.x][curr.z];
          }
          return path.reverse();
        }

        closedList[current.x][current.z] = true;

        const neighbors = [
          { x: current.x + 1, z: current.z }, { x: current.x - 1, z: current.z },
          { x: current.x, z: current.z + 1 }, { x: current.x, z: current.z - 1 }
        ];

        for (const n of neighbors) {
          if (n.x < 0 || n.x >= GRID_SIZE || n.z < 0 || n.z >= GRID_SIZE) continue;
          if (memoryGrid[n.x][n.z] === 1 || closedList[n.x][n.z]) continue;

          const tentativeG = gScore[current.x][current.z] + 1;
          if (tentativeG < gScore[n.x][n.z]) {
            parent[n.x][n.z] = current;
            gScore[n.x][n.z] = tentativeG;
            fScore[n.x][n.z] = tentativeG + Math.hypot(target.x - n.x, target.z - n.z);

            if (!openList.some(o => o.x === n.x && o.z === n.z)) {
              openList.push(n);
            }
          }
        }
      }
      return null;
    }

    class TacticalBot {
      constructor(color, startX, startZ, name) {
        this.name = name;
        this.color = color;
        this.hp = 100;
        this.kills = 0;
        this.speed = 0.11;
        this.lastShot = 0;

        this.state = 'EXPLORE'; 
        this.targetWaypoint = null;
        this.path = [];

        this.memoryGrid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(-1));

        const group = new THREE.Group();
        const bodyGeo = new THREE.CylinderGeometry(BOT_RADIUS, BOT_RADIUS, 1.6, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: color });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.8;
        body.castShadow = true;
        group.add(body);

        const gunGeo = new THREE.BoxGeometry(0.18, 0.18, 0.7);
        const gunMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const gun = new THREE.Mesh(gunGeo, gunMat);
        gun.position.set(0.35, 1.0, -0.4);
        group.add(gun);

        this.mesh = group;
        this.mesh.position.set(startX, 0, startZ);
        scene.add(this.mesh);
      }

      reset(x, z) {
        this.hp = 100;
        this.state = 'EXPLORE';
        this.mesh.position.set(x, 0, z);
        this.path = [];
        this.targetWaypoint = null;
      }

      // 지형 레이캐스트 매핑
      scanEnvironment() {
        const myPos = this.mesh.position;
        const rays = 12;
        for (let i = 0; i < rays; i++) {
          const angle = (i / rays) * Math.PI * 2;
          const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
          const raycaster = new THREE.Raycaster(new THREE.Vector3(myPos.x, 0.8, myPos.z), dir, 0, 10);
          const hits = raycaster.intersectObjects(obstacles);

          if (hits.length > 0) {
            const hitPoint = hits[0].point;
            const g = worldToGrid(hitPoint.x, hitPoint.z);
            this.memoryGrid[g.x][g.z] = 1;
          }
        }
        const currentG = worldToGrid(myPos.x, myPos.z);
        this.memoryGrid[currentG.x][currentG.z] = 0;
      }

      // 안전 엄폐 포인트 찾기
      findSafeCoverPoint(enemyPos) {
        let bestPoint = null;
        let maxCoverScore = -Infinity;

        for (let gx = 1; gx < GRID_SIZE - 1; gx++) {
          for (let gz = 1; gz < GRID_SIZE - 1; gz++) {
            if (this.memoryGrid[gx][gz] === 0) {
              const worldP = gridToWorld(gx, gz);
              const dirFromEnemy = new THREE.Vector3().subVectors(worldP, enemyPos);
              const distFromEnemy = dirFromEnemy.length();
              dirFromEnemy.y = 0;
              dirFromEnemy.normalize();

              const ray = new THREE.Raycaster(new THREE.Vector3(enemyPos.x, 0.8, enemyPos.z), dirFromEnemy, 0, distFromEnemy);
              const hits = ray.intersectObjects(obstacles);

              if (hits.length > 0) {
                const distFromMe = new THREE.Vector3(worldP.x, 0, worldP.z).distanceTo(this.mesh.position);
                const score = distFromEnemy * 2 - distFromMe;
                if (score > maxCoverScore) {
                  maxCoverScore = score;
                  bestPoint = worldP;
                }
              }
            }
          }
        }
        return bestPoint;
      }

      // 하드웨어 충돌 검사 (벽 통과 물리적 원천 차단)
      resolveObstacleCollisions(newX, newZ) {
        let resX = newX;
        let resZ = newZ;

        // 맵 경계 제한 (판 안에만 머물도록)
        const bound = MAP_SIZE / 2 - BOT_RADIUS - 0.3;
        resX = Math.max(-bound, Math.min(bound, resX));
        resZ = Math.max(-bound, Math.min(bound, resZ));

        // 지형지물 슬라이딩 충돌 보정
        for (const box of obstacleBoxes) {
          if (resX > box.minX && resX < box.maxX && resZ > box.minZ && resZ < box.maxZ) {
            // 벽 상자 중심과의 가깝기 비교 후 가장 가까운 외곽으로 되밀침
            const overlapL = resX - box.minX;
            const overlapR = box.maxX - resX;
            const overlapT = resZ - box.minZ;
            const overlapB = box.maxZ - resZ;

            const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);

            if (minOverlap === overlapL) resX = box.minX;
            else if (minOverlap === overlapR) resX = box.maxX;
            else if (minOverlap === overlapT) resZ = box.minZ;
            else if (minOverlap === overlapB) resZ = box.maxZ;
          }
        }

        return { x: resX, z: resZ };
      }

      // 위치 이동 수행 함수
      move(dirVector) {
        const nextX = this.mesh.position.x + dirVector.x * this.speed;
        const nextZ = this.mesh.position.z + dirVector.z * this.speed;

        const corrected = this.resolveObstacleCollisions(nextX, nextZ);
        this.mesh.position.x = corrected.x;
        this.mesh.position.z = corrected.z;
      }

      update(enemy) {
        if (this.hp <= 0) return;

        this.scanEnvironment();

        const myPos = this.mesh.position;
        const enemyPos = enemy.mesh.position;

        const dirToEnemy = new THREE.Vector3().subVectors(enemyPos, myPos);
        const distToEnemy = dirToEnemy.length();
        dirToEnemy.y = 0;
        dirToEnemy.normalize();

        const raycaster = new THREE.Raycaster(new THREE.Vector3(myPos.x, 0.8, myPos.z), dirToEnemy, 0, distToEnemy);
        const hits = raycaster.intersectObjects(obstacles);
        const canSeeEnemy = (hits.length === 0);

        // FSM 상태 전환
        if (this.hp < 40) {
          this.state = (canSeeEnemy || this.hp < 30) ? 'RETREAT' : 'HEAL';
        } else if (canSeeEnemy) {
          this.state = 'COMBAT';
        } else if (this.state === 'COMBAT' && !canSeeEnemy) {
          this.state = 'EXPLORE';
        }

        // 상태별 실행
        if (this.state === 'COMBAT') {
          const angle = Math.atan2(dirToEnemy.x, dirToEnemy.z);
          this.mesh.rotation.y = angle + Math.PI;

          if (distToEnemy > 8) {
            this.move(dirToEnemy);
          } else if (distToEnemy < 4) {
            this.move(new THREE.Vector3(-dirToEnemy.x, 0, -dirToEnemy.z));
          }
          this.shoot(enemy);

        } else if (this.state === 'RETREAT') {
          if (!this.targetWaypoint || Math.random() < 0.05) {
            this.targetWaypoint = this.findSafeCoverPoint(enemyPos);
          }

          if (this.targetWaypoint) {
            this.path = findPath(myPos, this.targetWaypoint, this.memoryGrid) || [];
            this.moveAlongPath();
          } else {
            this.move(new THREE.Vector3(-dirToEnemy.x, 0, -dirToEnemy.z));
          }

        } else if (this.state === 'HEAL') {
          this.hp = Math.min(100, this.hp + 0.2); 
          if (this.hp >= 85) this.state = 'EXPLORE';

        } else if (this.state === 'EXPLORE') {
          if (!this.targetWaypoint || new THREE.Vector3(this.targetWaypoint.x, 0, this.targetWaypoint.z).distanceTo(myPos) < 1.5) {
            const rx = (Math.random() - 0.5) * (MAP_SIZE - 6);
            const rz = (Math.random() - 0.5) * (MAP_SIZE - 6);
            this.targetWaypoint = { x: rx, z: rz };
            this.path = findPath(myPos, this.targetWaypoint, this.memoryGrid) || [];
          }
          this.moveAlongPath();
        }
      }

      moveAlongPath() {
        if (this.path && this.path.length > 1) {
          const next = this.path[1];
          const dir = new THREE.Vector3(next.x - this.mesh.position.x, 0, next.z - this.mesh.position.z);
          if (dir.length() < 0.6) {
            this.path.shift();
          } else {
            dir.normalize();
            const angle = Math.atan2(dir.x, dir.z);
            this.mesh.rotation.y = angle + Math.PI;
            this.move(dir);
          }
        }
      }

      shoot(target) {
        const now = Date.now();
        if (now - this.lastShot < 300) return;
        this.lastShot = now;

        const bulletGeo = new THREE.BufferGeometry().setFromPoints([
          this.mesh.position.clone().add(new THREE.Vector3(0, 1.0, 0)),
          target.mesh.position.clone().add(new THREE.Vector3(0, 0.8 + (Math.random() - 0.5) * 0.4, 0))
        ]);
        const bulletMat = new THREE.LineBasicMaterial({ color: this.color === 0xff3333 ? 0xff3333 : 0x0055ff, linewidth: 2 });
        const line = new THREE.Line(bulletGeo, bulletMat);
        scene.add(line);
        setTimeout(() => scene.remove(line), 40);

        if (Math.random() < 0.7) {
          target.takeDamage(12, this);
        }
      }

      takeDamage(amount, attacker) {
        this.hp -= amount;
        if (this.hp <= 0) {
          this.hp = 0;
          attacker.kills++;
          setTimeout(() => {
            redBot.reset(-10, -10);
            blueBot.reset(10, 10);
          }, 1000);
        }
      }
    }

    const redBot = new TacticalBot(0xdc3545, -10, -10, 'RED');
    const blueBot = new TacticalBot(0x0d6efd, 10, 10, 'BLUE');

    let currentCamMode = 'top';
    window.setCamView = function(mode) {
      currentCamMode = mode;
    };

    function updateCamera() {
      if (currentCamMode === 'top') {
        // 줄어든 판 크기에 딱 맞춰 시야에서 벗어나지 않게 조율된 탑뷰
        camera.position.set(0, 32, 0);
        camera.lookAt(0, 0, 0);
      } else if (currentCamMode === 'red') {
        const p = redBot.mesh.position;
        const rot = redBot.mesh.rotation.y;
        camera.position.set(p.x + Math.sin(rot) * 2, 2.0, p.z + Math.cos(rot) * 2);
        camera.lookAt(p.x - Math.sin(rot) * 10, 1.2, p.z - Math.cos(rot) * 10);
      } else if (currentCamMode === 'blue') {
        const p = blueBot.mesh.position;
        const rot = blueBot.mesh.rotation.y;
        camera.position.set(p.x + Math.sin(rot) * 2, 2.0, p.z + Math.cos(rot) * 2);
        camera.lookAt(p.x - Math.sin(rot) * 10, 1.2, p.z - Math.cos(rot) * 10);
      }
    }

    const stateTexts = {
      'EXPLORE': '상태: 탐색 중',
      'COMBAT': '상태: 교전 중!',
      'RETREAT': '상태: 후퇴 중',
      'HEAL': '상태: 회복 중...'
    };

    function updateUI() {
      document.getElementById('hp-red').innerText = `HP: ${Math.ceil(redBot.hp)}`;
      document.getElementById('state-red').innerText = stateTexts[redBot.state];
      document.getElementById('score-red').innerText = `${redBot.kills} Kills`;

      document.getElementById('hp-blue').innerText = `HP: ${Math.ceil(blueBot.hp)}`;
      document.getElementById('state-blue').innerText = stateTexts[blueBot.state];
      document.getElementById('score-blue').innerText = `${blueBot.kills} Kills`;
    }

    function animate() {
      requestAnimationFrame(animate);

      redBot.update(blueBot);
      blueBot.update(redBot);

      updateCamera();
      updateUI();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
